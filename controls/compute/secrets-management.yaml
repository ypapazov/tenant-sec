---
id: compute.secrets-management
domain: compute
name: "Secrets Management"
description: >
  Dedicated secrets store for API keys, database passwords, certificates,
  and other sensitive values. Covers automatic rotation, access audit logging,
  injection mechanisms into compute runtimes (no plaintext in environment
  variables), and integration breadth across compute services.

criteria:
  L0: >
    No dedicated secrets management service. Secrets must be stored in
    environment variables, configuration files, or object storage. No
    automated rotation. Secrets are accessible to anyone with read access
    to the configuration.
  L1: >
    Secrets management is achievable through self-deployed solutions (HashiCorp
    Vault, CyberArk) running on cloud infrastructure. Tenants manage the Vault
    cluster, its availability, and integration with compute services.
  L2: >
    A managed secrets store exists (Secrets Manager, Key Vault, Secret Manager
    equivalent) with access control and audit logging. Automatic rotation is
    supported for a limited set of secret types (e.g., database passwords for
    specific engines), or injection into compute runtimes requires custom code
    to call the secrets API (no native environment-variable injection).
  L3: >
    Full managed secrets management: automatic rotation for broad secret types
    (databases, API keys, certificates), native injection into function
    environments and Kubernetes pods (via CSI driver or equivalent, not
    environment variable fetch at startup), fine-grained access control
    per secret, full audit log of all secret access events, and cross-account
    secret sharing.

framework_mappings:
  ccm: ["EKM-01"]
  nist_800_53_r5: ["IA-5", "SC-28"]
  cis_aws_v5: []
  cis_azure_v5: []
  cis_gcp_v4: []
  mitre_attack: ["T1552"]

service_scoped: false
