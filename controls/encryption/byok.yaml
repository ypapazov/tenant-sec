---
id: enc.byok
domain: encryption
name: "Bring Your Own Key (BYOK)"
description: >
  Ability to import externally generated key material into the provider's KMS.
  Covers import mechanisms (direct import, wrapped key material), supported
  key types and sizes, key material origin constraints (whether the provider
  requires proof of external generation), and whether imported keys have the
  same capabilities as provider-generated keys.

criteria:
  L0: >
    No key import capability. Keys used for encryption at rest must always be
    generated by the provider's KMS. Tenants cannot prove provenance of key
    material or use keys generated on-premises or in an external HSM.
  L1: >
    Key import is achievable through client-side encryption (tenants encrypt
    data with their own keys before upload) but this is not true BYOK into
    the KMS — the provider's services do not natively use the imported material
    for envelope encryption.
  L2: >
    Key import into the KMS is supported but with significant limitations:
    only specific key types (e.g., RSA but not AES), limited wrapping mechanisms,
    imported keys cannot be used with all services that support CMK, or
    imported key material has different rotation/management properties than
    natively generated keys.
  L3: >
    Full BYOK: tenants can import externally generated AES-256 or RSA key
    material into the KMS using documented, secure import procedures (wrapped
    with a provider-provided public wrapping key). Imported keys have the same
    capabilities as provider-generated CMKs. Rotation of imported key material
    is supported. Available across all services that support CMK.

framework_mappings:
  ccm: ["EKM-03"]
  nist_800_53_r5: ["SC-12", "SC-28"]
  cis_aws_v5: []
  cis_azure_v5: []
