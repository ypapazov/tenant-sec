---
id: iam.credential-management
domain: iam
name: "API Key & Credential Management"
description: >
  Tenant control over API keys, access keys, and service account credentials.
  Covers rotation capabilities, expiry enforcement, scope limitation (least
  privilege), detection of unused or overly-broad credentials, and the
  ability to prevent long-lived credential creation entirely in favor of
  short-lived tokens.

criteria:
  L0: >
    API keys or access key pairs are the only authentication mechanism.
    No expiry, rotation, or scoping capability exists. Keys are indefinitely
    valid unless manually deleted. No visibility into key usage patterns.
  L1: >
    Credential lifecycle management is achievable through tenant-built tooling:
    custom scripts that audit key age and force rotation, CI/CD pipelines that
    regenerate secrets, or external secret stores with rotation automation.
    The platform provides no managed rotation or enforcement natively.
  L2: >
    Managed credential features exist but incomplete: expiry can be set on
    new keys but not enforced on existing ones, rotation is supported for
    specific credential types (e.g., database passwords) but not general
    API keys, or usage auditing is available but remediation is manual.
  L3: >
    Full managed credential lifecycle: configurable expiry for all credential
    types, automated rotation with zero-downtime mechanisms, scope limitation
    per credential, access pattern anomaly detection (flagging unused keys),
    ability to enforce a policy that prohibits long-lived keys for human
    identities, and integration with secrets management services for workloads.

framework_mappings:
  ccm: ["IAM-08", "IAM-10"]
  nist_800_53_r5: ["IA-5", "AC-2"]
  cis_aws_v5: []
  cis_azure_v5: []
  cis_gcp_v4: []
  mitre_attack: ["T1552", "T1078"]

service_scoped: false
