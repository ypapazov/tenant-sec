---
id: iam.permission-boundaries
domain: iam
name: "Permission Boundaries"
description: >
  Managed mechanisms that constrain either the maximum permissions a principal
  can exercise or the permissions a delegated IAM administrator can grant.
  Both patterns support safer delegation by enforcing a provider-side ceiling
  rather than relying only on organizational convention and monitoring.

criteria:
  L0: >
    No permission boundary or permission ceiling mechanism exists. Any principal
    that can attach policies can grant any permission available to them, enabling
    privilege escalation. Delegation of IAM administration is not safe without
    full administrative trust.
  L1: >
    Permission ceilings are achievable only through coarse organization or
    account policy plus convention and monitoring. Custom automation detects
    and remediates grants outside the delegated administrator's allowed scope;
    no managed per-principal ceiling or delegated-grant constraint exists.
  L2: >
    A managed permission-ceiling mechanism exists but is limited to specific
    principal types or predefined policies; OR managed conditions constrain
    which roles or permissions a delegated IAM administrator may grant and
    revoke. At least one safe-delegation path is enforced by the provider, but
    it does not provide broad per-principal ceilings plus grant constraints.
  L3: >
    Provider-enforced permission ceilings cover the principal types used for
    delegation and are evaluated at authorization time as an intersection with
    granted permissions. Delegated administrators can also be constrained in
    what they grant, or boundary inheritance/equivalent enforcement prevents
    created principals from escaping the allowed scope.

framework_mappings:
  ccm: ["IAM-06", "IAM-09"]
  nist_800_53_r5: ["AC-3", "AC-6"]
  cis_aws_v5: []
  cis_azure_v5: []
  cis_gcp_v4: []
  mitre_attack: ["T1548.005"]

service_scoped: false
