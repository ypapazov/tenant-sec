---
id: iam.permission-boundaries
domain: iam
name: "Permission Boundaries"
description: >
  Mechanisms to cap the maximum permissions a principal can exercise, regardless
  of what individual policies grant. Enables safe delegation: an administrator
  can grant another principal the ability to create IAM roles, constrained by
  a boundary that prevents privilege escalation beyond an allowed scope.

criteria:
  L0: >
    No permission boundary or permission ceiling mechanism exists. Any principal
    that can attach policies can grant any permission available to them, enabling
    privilege escalation. Delegation of IAM administration is not safe without
    full administrative trust.
  L1: >
    Permission boundaries are achievable through organizational convention and
    monitoring: SCPs or equivalent limit what any role can do at the account
    level, and custom automation detects and remediates policy violations.
    No per-principal boundary that follows delegation is available natively.
  L2: >
    A permission boundary mechanism exists but is limited to specific principal
    types (e.g., only IAM users, not roles, or not service accounts), or
    boundaries can only be set from a predefined list of managed policies
    rather than arbitrary boundary documents.
  L3: >
    Per-principal permission boundaries supported for all principal types
    (users, roles, service accounts, federated identities). Boundaries are
    evaluated as an intersection with the principal's attached policies. The
    boundary is enforced at policy evaluation time, not monitored post-hoc.
    Supports boundary inheritance in delegation scenarios.

framework_mappings:
  ccm: ["IAM-06", "IAM-09"]
  nist_800_53_r5: ["AC-3", "AC-6"]
  cis_aws_v5: []
  cis_azure_v5: []
  cis_gcp_v4: []
  mitre_attack: ["T1548.005"]

service_scoped: false
