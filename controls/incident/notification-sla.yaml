---
id: incident.notification-sla
domain: incident
name: "Incident Notification SLA"
surface: vignette
description: >
  Contractual commitments on provider-side security incident notification
  timeline. Covers both infrastructure-level security incidents affecting
  tenant data and platform vulnerabilities that require tenant action.
  Includes transparency of incident communication and historical track record.

criteria:
  L0: >
    No contractual incident notification commitment. Tenants are not guaranteed
    to be notified of security incidents affecting their data or the provider
    infrastructure. Notifications, when they occur, have no defined timeline.
  L1: >
    Incident notification exists on a best-effort basis: the provider communicates
    incidents through a public status page or blog, but there is no contractual
    SLA, no direct notification to affected tenants, and no private advance
    notice for critical vulnerabilities.
  L2: >
    Contractual incident notification exists and requires a processor to notify
    the controller without undue delay, consistent with GDPR Article 33(2), but
    does not define a shorter measurable provider-to-customer deadline or cover
    security incidents without confirmed personal-data exposure. The GDPR
    72-hour clock is the controller-to-supervisory-authority obligation under
    Article 33(1), not the processor-to-customer deadline.
  L3: >
    Strong notification commitment: targeted notice to directly affected
    tenants under a measurable contractual deadline (for example, within
    24 hours of confirmation), broader coverage than personal-data breaches,
    advance notice for vulnerabilities requiring tenant action where feasible,
    a dedicated incident channel, and post-incident reporting.

framework_mappings:
