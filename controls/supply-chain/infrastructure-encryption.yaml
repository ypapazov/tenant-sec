---
id: supply-chain.infrastructure-encryption
domain: supply-chain
name: "Infrastructure-Level Encryption"
description: >
  Provider-managed encryption of all data at rest at the infrastructure level,
  independent of tenant configuration (hardware or software encryption of
  physical storage media). This is a provider attestation, not a tenant-testable
  capability.

criteria:
  L0: >
    The provider does not attest to infrastructure-level encryption of physical
    storage media. Tenant data at rest relies entirely on service-layer encryption
    (if configured) with no underlying hardware or infrastructure encryption.
  L1: >
    Infrastructure encryption attestation is available informally (blog posts,
    security papers) but is not part of contractual commitments or third-party
    audited certifications.
  L2: >
    Infrastructure-level encryption is attested in published security
    documentation and is audited as part of SOC 2 Type II or ISO 27001 scope.
    However, the attestation does not specify encryption algorithm details,
    key management approach, or scope of physical media coverage.
  L3: >
    Full attestation: documented algorithm and key management for physical media
    encryption, included in SOC 2 Type II and ISO 27001 audit scope, attested
    by a third-party auditor, and specific to the regions/datacenters where
    tenant data is stored. Public transparency report includes this attestation.

framework_mappings:
  ccm: ["EKM-02"]
  nist_800_53_r5: ["SC-28"]
  cis_aws_v5: []
  cis_azure_v5: []
  cis_gcp_v4: []
  mitre_attack: []

service_scoped: false
