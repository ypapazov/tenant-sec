---
name: "data-sovereignty"
methodology_version: "2.0"
cohort: "eu-public"
description: >
  Profile for organizations with strict data sovereignty requirements —
  government, critical infrastructure, or highly regulated sectors where
  data location and provider access controls are paramount.
  This methodology-2 profile gates tenant-operable technical controls only;
  contractual sovereignty and qualifications must be reviewed separately.

must_have:
  - control: "data.residency-guarantees"
    min_level: 3
  - control: "enc.external-key-management"
    min_level: 2
  - control: "enc.cmk"
    min_level: 3

weights:
  iam: 0.10
  governance: 0.10
  encryption: 0.27
  network: 0.10
  logging: 0.10
  data: 0.26
  compute: 0.03
  incident: 0.04
  supply-chain: 0.00

mixed_aggregation: "min"
