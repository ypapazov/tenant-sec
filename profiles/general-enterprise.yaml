---
name: "general-enterprise"
methodology_version: "2.0"
cohort: "hyperscaler"
description: >
  Balanced weighting profile for a general enterprise with broad cloud
  security requirements. No domain is dramatically over-weighted; provides
  a reasonable baseline for enterprise migration decisions.

must_have:
  - control: "iam.external-idp-federation"
    min_level: 2
  - control: "enc.encryption-at-rest-default"
    min_level: 2
  - control: "log.control-plane-audit"
    min_level: 2

weights:
  iam: 0.15
  governance: 0.13
  encryption: 0.15
  network: 0.13
  logging: 0.12
  data: 0.13
  compute: 0.11
  incident: 0.08
  supply-chain: 0.00

mixed_aggregation: "mean"
