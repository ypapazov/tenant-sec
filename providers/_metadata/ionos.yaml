vignette:
  legal:
    summary: IONOS Cloud operates under the EU's GDPR, acting as a processor for customer
      data and processing personal information according to national and international
      data protection standards. Customers are responsible for the legality of data
      processed in the Virtual Data Center (VDC)/Data Center Designer (DCD) and for
      pseudonymization and encryption of their own customer data, including backups.
      IONOS Cloud Object Storage meets EU GDPR requirements for data storage and archiving.
    facts:
      data_processor_role: IONOS Cloud acts as a data processor for customer data.
      customer_data_responsibility: Customers are responsible for the legality, pseudonymization,
        and encryption of their data.
      gdpr_compliance: IONOS Cloud Object Storage complies with EU GDPR for data storage
        and archiving.
    references:
    - url: https://cloud.ionos.com/protection
      title: Data Protection and Cloud Security | IONOS
    - url: https://cloud.ionos.com/solutions/eu-gdpr-requirements
      title: GDPR requirements regarding Storage as a Service (STaaS)| IONOS CLOUD
    - url: https://www.ionos.com/digitalguide/websites/digital-law/gain-users-confidence-with-a-privacy-policy/
      title: 'Privacy policy for Websites 2022: Templates - IONOS'
  operations:
    summary: IONOS Cloud is responsible for maintaining the underlying infrastructure,
      including physical servers, virtualization layers, and hypervisors, ensuring
      their availability, reliability, and performance. They implement security controls
      at the infrastructure level, such as network security, host-based firewalls,
      and intrusion detection systems. Customers are responsible for securing their
      compute instances, including access controls, operating systems, and applications.
    facts:
      provider_infrastructure_responsibility: IONOS Cloud maintains physical servers,
        virtualization, and hypervisors.
      provider_security_controls: IONOS Cloud implements network security, host-based
        firewalls, and intrusion detection systems.
      customer_instance_responsibility: Customers secure compute instances, access
        controls, OS, and applications.
    references:
    - url: https://docs.ionos.com/cloud/security-safeguards/best-practice-guideline/best-practice-cloud-server-security-products
      title: Best Practices for IONOS CLOUD Server Security Products | Products
    - url: https://cloud.ionos.com/protection
      title: Data Protection and Cloud Security | IONOS
    - url: https://docs.ionos.com/cloud/security-safeguards/report-security-event/malfunctions-and-incidents
      title: Malfunctions and Security Incidents | Products
  privileged_access:
    summary: IONOS Cloud customers are responsible for configuring and managing access
      controls for their VM operating systems and applications, including setting
      up user accounts with appropriate credentials. The principle of least privilege
      access applies to these systems. IONOS Cloud provides interfaces like the Data
      Center Designer (DCD) for customers to control and manage their services, including
      creating and managing SSH keys.
    facts:
      customer_access_control_responsibility: Customers configure and manage access
        controls for VMs and applications.
      least_privilege_principle: The principle of least privilege applies to VM operating
        systems and applications.
      ssh_key_management: Customers can create and manage SSH keys via the Data Center
        Designer.
    references:
    - url: https://docs.ionos.com/cloud/security-safeguards/best-practice-guideline/best-practice-cloud-server-security-products
      title: Best Practices for IONOS CLOUD Server Security Products | Products
    - url: https://docs.ionos.com/cloud/support/general-information/service-catalog
      title: Service Catalog | Support | Products
  subcontracting:
    summary: IONOS Cloud's price list applies to IONOS CLOUD GmbH, IONOS Cloud Solutions
      Spain, S.L.U., and IONOS CLOUD France SAS. The company offers various cloud
      services and solutions, including AI Model Hub, Backup and Storage, Block Storage,
      IONOS Cloud Object Storage, Network File Storage, Compute Engine, Cloud GPU
      VM, and Managed Kubernetes. IONOS Cloud also provides a partner program for
      ISVs.
    facts:
      applicable_entities: Price list applies to IONOS CLOUD GmbH, IONOS Cloud Solutions
        Spain, S.L.U., and IONOS CLOUD France SAS.
      service_offerings: Services include AI Model Hub, various storage options, compute,
        and managed Kubernetes.
      isv_partner_program: IONOS Cloud offers an ISV Partner Program.
    references:
    - url: https://docs.ionos.com/cloud/support/general-information/price-list/ionos-cloud-eur-en
      title: IONOS CLOUD (EUR) | Support | Products
    - url: https://cloud.ionos.com/partner/isv
      title: IONOS CLOUD ISV Partner Program
    - url: https://docs.ionos.com/cloud/support/general-information/service-catalog
      title: Service Catalog | Support | Products
  audit_and_exit:
    summary: IONOS Cloud Object Storage can record logs of all activities within a
      bucket, storing data in a specified destination bucket to provide an audit trail.
      This helps ensure only authorized users access buckets and objects and tracks
      changes. In combination with versioning, it aids in transparency and object
      recovery. Customers are responsible for ensuring the legality of data processed
      in the VDC/DCD.
    facts:
      object_storage_logging: IONOS Cloud Object Storage records activity logs for
        audit trails.
      audit_trail_benefits: Logs ensure authorized access, track changes, and aid
        in recovery with versioning.
      customer_data_legality_responsibility: Customers are responsible for the legality
        of data processed in VDC/DCD.
    references:
    - url: https://docs.ionos.com/cloud/security-safeguards/best-practice-guideline/best-practice-cloud-storage-products
      title: Best Practices for IONOS CLOUD Storage Products | Products
    - url: https://cloud.ionos.com/protection
      title: Data Protection and Cloud Security | IONOS
    - url: https://docs.ionos.com/cloud/support/general-information/service-catalog
      title: Service Catalog | Support | Products
  continuity:
    summary: IONOS Cloud offers Cloud Disaster Recovery (Cloud DR) as an emergency
      backup strategy for data, applications, and hardware, relying on cloud storage.
      This allows for quick restoration of affected resources in case of failure.
      IONOS Cloud backup policies support business continuity with automated backups
      and fast restore capabilities, ensuring data integrity and reducing the risk
      of data loss.
    facts:
      cloud_disaster_recovery: IONOS Cloud offers Cloud DR for emergency backup and
        restoration.
      automated_backups: Automated backups and fast restore capabilities support business
        continuity.
      data_integrity: Backup policies protect data integrity and reduce data loss
        risk.
    references:
    - url: https://www.ionos.com/digitalguide/server/security/cloud-disaster-recovery/
      title: Cloud Disaster Recovery | Definition, Tips and How to - IONOS
    - url: https://cloud.ionos.com/managed/dbaas
      title: Database as a Service (DBaaS) | IONOS CLOUD
    - url: https://cloud.ionos.com/solutions/disaster-recovery
      title: Data backup and disaster recovery for companies
  vulnerability_disclosure:
    summary: IONOS Cloud encourages reporting of vulnerabilities in its systems, configurations,
      or services that could impact confidentiality, integrity, or availability. Reports
      should be sent to security@ionos.com with detailed information, including affected
      systems, exploitation methods, and reproduction steps. IONOS Cloud will not
      prosecute security researchers who report in good faith and investigates all
      reports to protect customers.
    facts:
      reporting_vulnerabilities: Vulnerabilities impacting confidentiality, integrity,
        or availability should be reported.
      reporting_email: Reports should be sent to security@ionos.com.
      no_prosecution_for_good_faith: IONOS Cloud will not prosecute good-faith security
        researchers.
    references:
    - url: https://docs.ionos.com/cloud/security-safeguards/report-security-event/vulnerabilities
      title: Vulnerabilities | Products
    - url: https://www.ionos.com/it-security
      title: IT Security - Reporting security threats
    - url: https://docs.ionos.com/cloud/release-notes/october-2026
      title: October 2026 | Products
  transfers:
    summary: IONOS Cloud stores information encrypted and redundantly within its data
      centers, often using distributed object storage systems. Data transfers between
      user devices and the cloud are protected through encrypted connections like
      TLS. The cloud provider manages internal data organization, redundancy, and
      routine backup processes. IONOS Cloud Object Storage offers no vendor lock-in
      of data due to the S3 standard, allowing data migration at any time.
    facts:
      data_encryption_at_rest: Information is encrypted and stored redundantly within
        data centers.
      data_in_transit_encryption: Data transfers are protected via encrypted connections
        like TLS.
      no_vendor_lock_in: IONOS Cloud Object Storage uses S3 standard, allowing data
        migration.
    references:
    - url: https://www.ionos.com/digitalguide/server/know-how/what-is-the-cloud/
      title: What is the cloud? Definition, uses, and how cloud computing works -
        IONOS
    - url: https://docs.ionos.com/cloud/security-safeguards/best-practice-guideline/best-practice-cloud-storage-products
      title: Best Practices for IONOS CLOUD Storage Products | Products
    - url: https://cloud.ionos.com/protection
      title: Data Protection and Cloud Security | IONOS
