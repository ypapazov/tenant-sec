vignette:
  legal:
    summary: Oracle's Services Privacy Policy outlines the privacy and security practices
      for handling Services Personal Information and System Operations Data. It details
      how Oracle processes personal information on behalf of customers for various
      services and the practices for data incidentally contained in system operation
      data.
    facts:
      policy_scope: services personal information, system operations data
      data_types_covered: family, lifestyle, employment, financial, online identifiers,
        geolocation, online behavior, log files, statistical information
    references:
    - url: https://www.oracle.com/legal/privacy/services-privacy-policy/
      title: https://www.oracle.com/legal/privacy/services-privacy-policy/
  operations:
    summary: Oracle Cloud Infrastructure (OCI) is designed with a security-first approach
      across compute, network, and storage. Oracle has a Security Incident Management
      Policy that defines requirements for reporting and responding to security events,
      with the Integrated Cyber Center (ICC) coordinating responses. Oracle also releases
      Critical Patch Updates and Critical Security Patch Updates to address vulnerabilities.
    facts:
      security_approach: security-first across compute, network, storage
      incident_response_coordination: Integrated Cyber Center (ICC)
      patch_release_frequency: quarterly Critical Patch Updates, targeted Critical
        Security Patch Updates
    references:
    - url: https://www.oracle.com/trust/
      title: Security, Privacy, and Compliance | Oracle
    - url: https://www.oracle.com/corporate/security-practices/corporate/security-incident-response/
      title: Information Security Incident Response | Oracle
    - url: https://www.oracle.com/security-alerts/cspusep2026.html
      title: Oracle Critical Security Patch Update Advisory - September 2026
  privileged_access:
    summary: Oracle Access Governance allows for sequential processing of multiple
      access requests for a single identity and supports generating downloadable reports
      for identities, access bundle assignments, accounts, and access bundles. It
      also enables the use of OCI Vault as a credential store for Microsoft Entra
      ID Orchestrated systems.
    facts:
      access_request_processing: sequential processing for single identity
      reporting_capabilities: downloadable reports for identities, access bundles,
        accounts
      credential_storage: OCI Vault for Microsoft Entra ID Orchestrated systems
    references:
    - url: https://docs.oracle.com/en-us/iaas/Content/access-governance/whats-new.htm
      title: What's New in Oracle Access Governance
  subcontracting:
    summary: Oracle identifies sub-processors for cloud services and distributes these
      lists to customers via the Oracle Cloud Customer Support Portal. Customers can
      subscribe to notifications for updates to these lists. Oracle also provides
      strategic subcontractor lists for Oracle Cloud Services and NetSuite products.
    facts:
      subprocessor_identification: lists distributed via Oracle Cloud Customer Support
        Portal
      notification_availability: customers can subscribe to subprocessor list updates
      strategic_subcontractor_lists: available for Oracle Cloud Services and NetSuite
    references:
    - url: https://www.oracle.com/corporate/security-practices/corporate/supply-chain/suppliers/
      title: Supplier Security | Oracle
    - url: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/article_11140441968.html
      title: NetSuite Applications Suite - Viewing the Oracle Cloud Services Strategic
        Subcontractor List
    - url: https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/article_34140437468.html
      title: NetSuite Applications Suite - Viewing the Oracle NetSuite Subprocessors
        List
  audit_and_exit:
    summary: Oracle will retire the Oracle Identity Cloud Service (IDCS) AuditEvents
      APIs and associated out-of-the-box reports in February 2027. Customers are advised
      to migrate their integrations and reporting workflows to OCI Audit before this
      date and use OCI Audit service APIs to retrieve audit events.
    facts:
      api_retirement_date: February 2027
      replacement_service: OCI Audit
      migration_recommendation: migrate integrations and reporting workflows to OCI
        Audit
    references:
    - url: https://docs.oracle.com/en-us/iaas/Content/servicechanges.htm
      title: Service Change Announcements
  continuity:
    summary: Oracle provides safeguards against computing downtime through its Oracle
      Cloud Infrastructure (OCI), which separates global cloud regions into isolated
      availability domains with independent power and cooling systems. Oracle Lines
      of Business (LOBs) are required to maintain and test Disaster Recovery (DR)
      plans, including backup and recovery strategies, with annual DR exercises conducted
      for internal infrastructure.
    facts:
      disaster_recovery_architecture: isolated availability domains within regions
      dr_plan_requirement: LOBs must maintain and test DR plans
      dr_exercise_frequency: annual for internal infrastructure
    references:
    - url: https://www.oracle.com/business-continuity/business-continuity-disaster-recovery/
      title: What Is Business Continuity and Disaster Recovery (BCDR)?
    - url: https://www.oracle.com/corporate/security-practices/corporate/resilience-management/disaster-recovery/
      title: Disaster Recovery | Risk Management Resiliency Program | Oracle
  vulnerability_disclosure:
    summary: Oracle encourages reporting security vulnerabilities through designated
      support mechanisms for customers and partners, or via email for non-customers.
      Reporters are encouraged to use Oracle's public PGP key for encrypting sensitive
      information. Oracle credits researchers who follow responsible disclosure practices
      in its Critical Patch Update or Critical Security Patch Update advisories.
    facts:
      reporting_channels: designated support mechanism or email secalert_us@oracle.com
      encryption_recommendation: use Oracle's public PGP key for sensitive information
      researcher_credit_policy: credited in advisories for responsible disclosure
    references:
    - url: https://www.oracle.com/corporate/security-practices/testing/faq/
      title: FAQs | Security Testing Policy | Oracle
    - url: https://www.oracle.com/corporate/security-practices/assurance/vulnerability/reporting/
      title: How to Report Security Vulnerabilities to Oracle | Oracle
    - url: https://www.oracle.com/security-alerts/cpujul2026.html
      title: Oracle Critical Patch Update Advisory - July 2026
  transfers:
    summary: Oracle's Services Privacy Policy details how Services Personal Information,
      provided by customers and residing on Oracle, customer, or third-party systems,
      is processed by Oracle on behalf of customers to perform services. This information
      may include various personal details and online identifiers related to customer
      representatives and end-users.
    facts:
      data_residency: on Oracle, customer, or third-party systems
      processing_purpose: to perform services on customer's behalf
      data_subjects: customer representatives and end-users
    references:
    - url: https://www.oracle.com/legal/privacy/services-privacy-policy/
      title: https://www.oracle.com/legal/privacy/services-privacy-policy/
