vignette:
  legal:
    summary: STACKIT emphasizes data sovereignty, which includes where data resides,
      the governing law, and who can technically access it. This goes beyond mere
      data residency to ensure that data in a specific location, like Frankfurt, is
      not technically decryptable by parties outside the EU. The provider also considers
      operational sovereignty, which addresses who can affect the ability to operate,
      and software sovereignty, which concerns the technical ability to migrate away
      from the platform.
    facts: {}
    references:
    - url: https://framework.stackit.cloud/architecture/pillars/sovereignty/
      title: https://framework.stackit.cloud/architecture/pillars/sovereignty/
  operations:
    summary: STACKIT offers 24/7 managed cloud operations, including automated monitoring,
      incident management, patch management, and backup with SLA guarantees. This
      aims to reduce incidents compared to on-premises solutions. The provider also
      offers professional services for IT migration with a focus on sovereignty and
      security-by-design. For secure configuration of virtual machines, STACKIT recommends
      system hardening measures such as installing only necessary packages, disabling
      root login, implementing strong password policies, and using firewalls.
    facts: {}
    references:
    - url: https://marketplace.stackit.cloud/en/products
      title: STACKIT Marketplace - Product Catalog
    - url: https://docs.stackit.cloud/products/security/security-hardening/security-in-compute-engine/
      title: Security in Compute Engine | Docs
  privileged_access:
    summary: STACKIT uses Role Based Access Control (RBAC) to manage access to its
      services, where permissions define specific actions users can perform. Roles
      are collections of permissions, and general roles like Owner, Editor, and Reader
      provide broad access. The STACKIT Identity Provider (IdP) is an authentication
      system that offers fine-grained access management, supporting user accounts,
      service accounts, and client accounts. It handles authentication by confirming
      a user's identity and provides identity information for authorization.
    facts: {}
    references:
    - url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions/
      title: Understand roles and permissions | Docs
    - url: https://docs.stackit.cloud/platform/access-and-identity/stackit-idp/
      title: Understand STACKIT IdP | Docs
    - url: https://docs.stackit.cloud/platform/access-and-identity/
      title: Understand STACKIT IAM | Docs
  subcontracting:
    summary: STACKIT advises customers to maintain a current inventory of every party
      that processes their data, extending beyond infrastructure to include support
      tools, analytics services, payment processors, and email delivery services.
      This inventory should establish the jurisdiction of each party, not just their
      location, and treat third-party and marketplace services as part of the data
      processing chain. The platform-side facts, such as region and operating entity,
      are documented and stable, but customers are responsible for enumerating parties
      beyond the platform.
    facts: {}
    references:
    - url: https://framework.stackit.cloud/architecture/pillars/sovereignty/sov-06-jurisdictional-chain/
      title: https://framework.stackit.cloud/architecture/pillars/sovereignty/sov-06-jurisdictional-chain/
  audit_and_exit:
    summary: The STACKIT Audit Log is a centralized service that records administrative
      and access events across cloud products for compliance and security monitoring.
      It captures events from most managed services and core platform services, including
      membership, resource manager, and service account services. Audit logs are processed
      and forwarded according to the OpenTelemetry Schema. STACKIT also supports the
      FinOps Open Cost and Usage Specification (FOCUS) versions 1.1 and 1.2, providing
      standardized cost and usage data in compressed CSV format for cost allocation,
      analysis, and monitoring.
    facts: {}
    references:
    - url: https://docs.stackit.cloud/platform/audit-log/
      title: Understand STACKIT Audit Log | Docs
    - url: https://docs.stackit.cloud/products/logging-and-monitoring/telemetry-router/basics/dataformats/
      title: Data Formats | Docs
    - url: https://docs.stackit.cloud/platform/cost-and-billing/focus/
      title: FOCUS report | Docs
  continuity:
    summary: STACKIT emphasizes the importance of defining Recovery Time Objective
      (RTO) and Recovery Point Objective (RPO) targets for disaster recovery. The
      provider notes that more aggressive RTO and RPO targets lead to higher ongoing
      costs, suggesting a proportionate approach. For regulated industries, disaster
      recovery is a regulatory requirement, with examples like BAIT (banking) and
      KRITIS (critical infrastructure) requiring documented contingency plans and
      regular tests.
    facts: {}
    references:
    - url: https://framework.stackit.cloud/adoption/adapting-operating-models/disaster-recovery/
      title: https://framework.stackit.cloud/adoption/adapting-operating-models/disaster-recovery/
  vulnerability_disclosure:
    summary: STACKIT provides a security bulletin hub for transparent information
      regarding security advisories, vulnerability disclosures, and mitigation guidance.
      Each advisory includes an impact analysis, a severity assessment based on the
      Common Vulnerability Scoring System (CVSS), and clear instructions for mitigation
      and remediation. STACKIT prioritizes CVSS v4.0 scoring. The provider encourages
      security researchers, customers, and partners to report potential security issues
      to the STACKIT security team.
    facts: {}
    references:
    - url: https://docs.stackit.cloud/platform/security-bulletin/
      title: Security bulletin | Docs
  transfers:
    summary: STACKIT hosts all regions exclusively in Germany (eu01) and Austria (eu02),
      ensuring compliance with European data protection laws like GDPR. Each region
      is physically separate, preventing service disruptions in one from affecting
      others. Within each region, there are at least three physically separate availability
      zones (AZs) with independent power, cooling, and network infrastructure. The
      Metro Availability Zone feature automatically distributes virtual machines and
      data across two or more AZs within a region for high availability.
    facts: {}
    references:
    - url: https://docs.stackit.cloud/platform/regions/
      title: Regions | Docs
