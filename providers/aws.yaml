  enc.key-lifecycle:
    status: assessed
    score: 3
    evidence: AWS Key Management Service (KMS) provides comprehensive, native key
      lifecycle management. It supports automatic key rotation of customer managed
      keys with either the default annual cycle or a custom period specified in days.
      It automatically retains older cryptographic material versions to transparently
      decrypt ciphertexts encrypted with previous versions. AWS KMS also enforces
      a mandatory scheduled deletion period (7 to 30 days) during which the key state
      is 'Pending deletion' and can be recovered by canceling the deletion. After
      the waiting period, key material is permanently destroyed, cryptographically
      shredding all data encrypted under that key.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
      title: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
    - url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
      title: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
    evidence_items:
    - id: ev-kms-rotation
      url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
      title: Rotate AWS KMS keys - AWS Key Management Service
      source_class: technical
      quote: "You cannot select a particular version of the key material for decrypt\
        \ operations, AWS KMS automatically chooses the correct version.\n- Rotation\
        \ period\n- \n                    Rotation period defines the number of days\
        \ after you enable automatic key rotation that AWS KMS will rotate your key\
        \ material, and the number of days between each automatic key rotation thereafter."
      retrieved_at: '2026-09-23T03:35:43.507746+00:00'
      content_hash: sha256:e1ca9c1d45566bcfe84421708678a405f80e8bbfe0897053e7deec2d719fd6fb
