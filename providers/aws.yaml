  gov.preventive-policy:
    status: assessed
    score: 2
    evidence: AWS Organizations Service Control Policies (SCPs) act as a robust, tenant-authorable
      preventive policy engine. SCPs use AWS IAM JSON policy syntax, enabling tenants
      to write custom rules with complex condition keys (e.g., restricting regions,
      enforcing MFA, or forbidding specific resource configurations). These policies
      are hierarchically inherited from the Organization Root down to Organizational
      Units (OUs) and individual Member Accounts. They are evaluated synchronously
      at the API gateway level, resulting in a direct request denial before action
      execution. SCPs apply globally to all AWS services and API actions for identities
      managed under member accounts, with limited exceptions (such as service-linked
      roles and some root registration tasks). While SCPs do not natively support
      an 'Audit' effect parameter in their syntax, the equivalent detection capability
      is achieved using AWS Config rules and CloudTrail logging.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
