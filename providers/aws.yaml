        - s3
        edition: standard
    - id: ev-cloudtrail-integrity-validation
      url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
      title: Validating CloudTrail log file integrity - AWS CloudTrail
      source_class: technical
      quote: 'To determine whether a log file was modified, deleted, or unchanged
        after CloudTrail delivered it, you can use CloudTrail log file integrity validation.
        This feature is built using industry standard algorithms: SHA-256 for hashing
        and SHA-256 with RSA for digital signing. This makes it computationally infeasible
        to modify, delete or forge CloudTrail log files without detection.'
      retrieved_at: '2026-09-23T04:22:27.055665+00:00'
      content_hash: sha256:cba70253ed18d33b17834b476164267e3c41095842c0e2e99428b348cbe6cf5a
