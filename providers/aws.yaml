  net.waf:
    status: assessed
    score: 3
    evidence: AWS WAF provides a comprehensive, fully managed Web Application Firewall
      service that meets all criteria for Level 3. It supports extensive managed rule
      sets (including AWS Managed Rules and third-party rules from the AWS Marketplace)
      which receive automatic updates. For custom rules, AWS WAF provides highly customizable
      match conditions, including geographical (country) matching, IP address sets,
      custom string/regex matching on headers or query parameters, and SQL injection/XSS
      pattern matching. These can be combined with logical AND/OR/NOT operators. It
      natively integrates with CloudFront (CDN), Application Load Balancers, API Gateway,
      and AppSync, and supports detailed request logging to Amazon S3, CloudWatch
      Logs, or Kinesis Data Firehose.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rules.html
