  net.flow-logging:
    status: assessed
    score: 3
    evidence: 'AWS VPC Flow Logs provides native network flow logging capabilities.
      As verified by official documentation, flow logs can be configured at multiple
      levels of granularity: VPC, subnet, or network interface (ENI). The capture
      of accepted and rejected IP traffic metadata (source/destination IP, port, protocol,
      packets, bytes, etc.) is fully managed without affecting network throughput.
      Additionally, the logged data can be seamlessly published to destinations such
      as Amazon S3 (for cost-effective object storage), Amazon CloudWatch Logs (for
      log analytics), or Amazon Data Firehose (for streaming to external SIEM platforms
      and real-time processing). Combined with AWS native Traffic Mirroring for deep
      packet capture and AWS Config/SCPs for organization-level enforcement, the offering
      fully satisfies the criteria for Level 3.'
