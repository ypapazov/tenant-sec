    score: 2
    evidence: AWS Organizations provides managed Tag Policies that allow tenants to
      define standard tag keys, case sensitivity, and acceptable values (including
      wildcards). While tag policies support the enforced_for directive to prevent
      non-compliant tagging operations, they explicitly ignore untagged resources
      ('Untagged resources don't appear as noncompliant in results'). Consequently,
      Tag Policies alone cannot prevent the creation of completely untagged resources.
      Additionally, there is no native platform-wide mechanism for automatic tag inheritance
      from parent resources (such as OUs or resource groups) to child resources. This
      aligns with Level 2 maturity.
