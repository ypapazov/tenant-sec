controls:
  compute.container-orchestration:
    status: assessed
    score: 2
    evidence: Amazon EKS provides a managed Kubernetes service that achieves Level
      2 maturity. It integrates natively with AWS IAM to enforce RBAC by default,
      and provides fully managed control plane patching. Audit logging is supported
      and can be explicitly enabled via CloudWatch. Standard network policies and
      Kubernetes Pod Security Standards are fully supported but must be configured
      or enabled by the tenant, meaning the default out-of-the-box configuration is
      not hardened to Level 3 standards.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html
      title: https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html
    - url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
      title: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
    - url: https://docs.aws.amazon.com/eks/latest/best-practices/pod-security.html
      title: https://docs.aws.amazon.com/eks/latest/best-practices/pod-security.html
    evidence_items:
    - id: ev-eks-pod-sec
      url: https://docs.aws.amazon.com/eks/latest/best-practices/pod-security.html
      title: Pod Security - Amazon EKS
      source_class: technical
      quote: "These modes and the profile (restriction) levels are configured at the\
        \ Kubernetes Namespace level, using labels, as seen in the below example.\n\
        apiVersion: v1\nkind: Namespace\nmetadata:\n  name: policy-test\n  labels:\n\
        \    pod-security.kubernetes.io/enforce: restricted\nWhen used independently,\
        \ these operational modes have different responses that result in different\
        \ user experiences."
      retrieved_at: '2026-09-23T02:07:30.801836+00:00'
      content_hash: sha256:b59f1c5f6dca8bf73ea42f93b9a7f000b91fedc2b8a4754aae0a53f44cd76bf2
      applicability:
        offering: public
        regions:
        - eu-west-1
        services:
        - eks
        edition: standard
    - id: ev-eks-cni-netpol
      url: https://docs.aws.amazon.com/eks/latest/userguide/cni-network-policy.html
      title: Limit Pod traffic with Kubernetes network policies - Amazon EKS
      source_class: technical
      quote: By default, there are no restrictions in Kubernetes for IP addresses,
        ports, or connections between any Pods in your cluster or between your Pods
        and resources in any other network. You can use Kubernetes network policy
        to restrict network traffic to and from your Pods.
      retrieved_at: '2026-09-23T02:07:30.801836+00:00'
      content_hash: sha256:6741343c341388a0e61c88654f552f1d6df2a51787cf270158d5b0a8068a84ed
      applicability:
        offering: public
        regions:
        - eu-west-1
        services:
        - eks
        edition: standard
    - id: ev-eks-iam-rbac
      url: https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html
      title: Identity and Access Management - Amazon EKS
      source_class: technical
      quote: "To get started, cluster administrators can create or update Amazon EKS\n\
        clusters, setting the preferred authentication to API_AND_CONFIG_MAP\nor API\
        \ method and define Access Entries to grant access the desired\nAWS IAM principals.\n\
        $ aws eks create-cluster \\\n    --name <CLUSTER_NAME> \\\n    --role-arn\
        \ <CLUSTER_ROLE_ARN> \\\n    --resources-vpc-config subnetIds=<value>,endpointPublicAccess=true,endpointPrivateAccess=true\
        \ \\\n    --logging '{\"clusterLogging\":[{\"types\":[\"api\",\"audit\",\"\
        authenticator\",\"controllerManager\",\"scheduler\"],\"enabled\":true}]}'\
        \ \\\n    --access-config authenticationMode=API_AND_CONFIG_MAP,bootstrapClusterCreatorAdminPermissions=false\n\
        The above command is an example to create an Amazon EKS cluster already without\
        \ the admin permissions of the cluster creator."
      retrieved_at: '2026-09-23T02:07:30.801836+00:00'
      content_hash: sha256:d3b0167cc16f9e6d68f709d39d058e97ecdef349e879b4b471facde7047fcc4f
      applicability:
        offering: public
        regions:
        - eu-west-1
        services:
        - eks
        edition: standard
    claims:
    - id: cl-eks-rbac
      assertion: EKS integrates IAM with Kubernetes RBAC, enabling RBAC by default
        for cluster access control.
      result: supported
      evidence_item_ids:
      - ev-eks-iam-rbac
      services:
      - eks
    - id: cl-eks-audit-logs
      assertion: EKS provides control plane audit logging which can be enabled by
