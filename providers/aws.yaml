  enc.byok:
    status: assessed
    score: 3
    evidence: AWS KMS provides a robust Bring Your Own Key (BYOK) capability, allowing
      tenants to generate cryptographic keys outside of AWS and securely import the
      key material. To use BYOK, tenants create a KMS key with an origin of `EXTERNAL`
      (which represents the key is designed for imported key material and prevents
      AWS KMS from generating key material). Tenants download a public wrapping key
      and import token from KMS, encrypt their local key material (such as 256-bit
      AES symmetric keys, RSA private keys of 2048/3072/4096 bits, or HMAC keys) on
      their own systems using the wrapping key, and then import it using the `ImportKeyMaterial`
      API. Once imported, the key functions normally in cryptographic operations and
      can be used across all AWS services integrated with KMS for CMKs. While automatic
      rotation is not supported for imported keys, manual/on-demand rotation of imported
      key material is fully supported by importing new key material under the `NEW_KEY_MATERIAL`
      type and performing the rotation operation.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys.html
      title: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys.html
    - url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-conceptual.html
      title: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-conceptual.html
    - url: https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys-import-key-material.html
