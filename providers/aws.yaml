      Zones. Every AWS Region includes three or more Availability Zones (AZs) which
      are geographically separate and possess independent power, cooling, and network
      routing to prevent correlated failures (AZ Independence). This is documented
      extensively in the AWS Fault Isolation Boundaries whitepaper. Multi-AZ deployment
      is the standard recommended practice across AWS and is embedded in the Well-Architected
      Framework. AWS offers managed cross-region replication and failover features
      (such as Amazon Route 53, DynamoDB Global Tables, and Aurora Global Database)
      along with explicit guidance on minimizing blast radius and achieving static
      stability.
