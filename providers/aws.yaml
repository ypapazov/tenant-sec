  iam.permission-boundaries:
    status: assessed
    score: 3
    evidence: AWS supports permissions boundaries for both IAM users and IAM roles.
      These boundaries act as a policy-evaluation-time policy intersection (or ceiling)
      that restricts the maximum permissions an identity-based policy can grant. Since
      IAM roles back EKS service accounts (IRSA) and federated identities, they are
      also constrained by these boundaries. Safe delegation is supported via IAM policy
      conditions (such as iam:PermissionsBoundary) that require boundary attachment
      upon principal creation, preventing privilege escalation.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
      title: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
    evidence_items:
    - id: ev-aws-pb-entities
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
      title: Permissions boundaries for IAM entities - AWS Identity and Access Management
      source_class: technical
      quote: AWS supports permissions boundaries for IAM entities (users or roles).
        A permissions boundary is an advanced feature for using a managed policy to
        set the maximum permissions that an identity-based policy can grant to an
        IAM entity. An entity's permissions boundary allows it to perform only the
        actions that are allowed by both its identity-based policies and its permissions
        boundaries.
      retrieved_at: '2026-09-23T04:07:09.476458+00:00'
