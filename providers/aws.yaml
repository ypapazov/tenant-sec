  enc.cmk:
    status: assessed
    score: 3
    evidence: AWS Key Management Service (KMS) offers comprehensive support for Customer-Managed
      Keys (CMKs) across all major in-scope storage, database, compute, and application
      services (such as S3, EBS, RDS, DynamoDB, Lambda, and Secrets Manager). Key
      policies in AWS KMS are highly expressive, allowing fine-grained control mapped
      to actions (like kms:Encrypt and kms:Decrypt) and specific IAM principals. Every
      cryptographic operation and management action performed on customer-managed
      keys is audited in detail within AWS CloudTrail. Crucially, tenants retain full
      control over key lifecycle, meaning keys can be disabled or scheduled for deletion
      at any time to immediately revoke access and prevent the cloud provider or unauthorized
      entities from decrypting the underlying data. This capability is uniformly available
      across all AWS commercial regions.
