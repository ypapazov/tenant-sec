  log.control-plane-audit:
    status: assessed
    score: 3
    evidence: AWS CloudTrail automatically logs all management plane events (control
      plane API calls) for all AWS services from the moment an account is created.
      By default, these management events are retained for 90 days in the CloudTrail
      Event History at no additional cost. To retain logs beyond 90 days and secure
      them, users can configure a Trail to deliver events to an Amazon S3 bucket.
      These delivered logs can be locked against deletion (even by the root account
      owner) using Amazon S3 Object Lock in Compliance mode. Additionally, CloudTrail
      supports log file integrity validation to detect any unauthorized modification
      or deletion of log files.
    verified_at: '2026-09-23'
    confidence: high
    references:
