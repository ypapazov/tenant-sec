  net.isolation-model:
    status: assessed
    score: 3
    evidence: AWS VPC provides a complete network isolation model that defaults to
      a deny-all posture. Custom security groups are created with no inbound rules,
      preventing any inbound traffic until explicitly permitted by the tenant. The
      architecture supports tiered subnets (public, private, isolated) with configurable
      route tables per subnet. Network ACLs allow stateless security filtering at
      the subnet boundary. AWS also supports cross-account and cross-region VPC peering
      as well as VPC Flow Logs to monitor all subnet traffic. This satisfies all L3
      criteria.
