  gov.quotas-service-control:
    status: assessed
    score: 3
    evidence: AWS Organizations supports Service Control Policies (SCPs) which act
      as organizational permission guardrails. SCPs are applied centrally to the entire
      organization, specific Organizational Units (OUs), or individual member accounts.
      They allow both allow-listing (by replacing the default FullAWSAccess policy
      with a policy listing only permitted actions) and deny-listing (by explicitly
      denying unauthorized actions, services, or regions). Because SCPs utilize standard
      IAM JSON policy syntax, tenants can write policies that enforce regional constraints
      (using conditions like aws:RequestedRegion) and restrict specific resource types
      or configurations (such as denying the creation of specific EC2 instance types).
      Restrictions automatically cascade down the OU hierarchy, and newly created
      or moved accounts in an OU automatically inherit the policies without manual
      intervention.
