      services:
      - eks
    criteria_results:
    - level: 0
      met: false
      reasoning: AWS EKS is a managed Kubernetes offering, so container orchestration
        security is not entirely tenant-managed on bare metal or unmanaged EC2 instances.
      claim_ids: []
    - level: 1
      met: false
      reasoning: EKS provides managed control plane patching, RBAC enabled, and support
        for audit logging, which exceeds the permissive-only defaults of Level 1.
      claim_ids:
      - cl-eks-rbac
      - cl-eks-audit-logs
    - level: 2
      met: true
      reasoning: EKS meets Level 2 as it features a managed control plane, RBAC enablement,
        available audit logs, and supports both standard network policies and Pod
        Security Admission, although both must be explicitly configured by the tenant.
      claim_ids:
      - cl-eks-rbac
      - cl-eks-audit-logs
      - cl-eks-network-policy
      - cl-eks-pod-security
    - level: 3
      met: false
      reasoning: EKS does not meet Level 3 because network policies are not enabled
        in the default namespace by default, and Pod Security Standards are not enforced
        out-of-the-box without user intervention.
      claim_ids:
      - cl-eks-network-policy
      - cl-eks-pod-security
  compute.image-management:
    status: assessed
    score: 2
    evidence: AWS provides Amazon Elastic Container Registry (ECR) as a managed private
      registry with integrated vulnerability scanning (Basic CVE and Enhanced Inspector
      continuous scanning). Image signing is supported via AWS Signer and Notation.
      EKS supports admission controllers for verification, and Lambda natively supports
      Code Signing configurations. However, EC2 (AMIs) lacks native managed signature
      verification at launch, and there is no native registry-level severity-based
      blocking or simple org-level policies to mandate registry sources natively without
      custom policies, placing the overall capability at L2.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html
      title: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html
