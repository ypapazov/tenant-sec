    evidence: AWS achieves Level 3 for automated incident response capabilities. AWS
      Security Hub acts as the security-specific event bus that aggregates and normalizes
      findings from diverse detection sources (GuardDuty, Inspector, Macie, etc.)
      into the AWS Security Finding Format (ASFF), forwarding them to Amazon EventBridge
      in near-real-time. For response playbooks, AWS provides 'Automated Security
      Response on AWS', an out-of-the-box solution using AWS CloudFormation, AWS Step
      Functions, and Systems Manager to automatically remediate common findings (such
      as isolating compromised EC2 instances, revoking active IAM access keys, or
      disabling public S3 buckets). Third-party SOAR and ticketing systems integrate
      natively using EventBridge API destinations or the AWS Service Management Connector
      (which supports bi-directional ticket updates with Jira and ServiceNow). Every
      automated remediation action creates execution trails in AWS CloudTrail for
      auditing.
