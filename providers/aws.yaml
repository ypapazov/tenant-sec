  iam.privileged-access:
    status: assessed
    score: 1
    evidence: AWS does not offer a native, fully managed Just-In-Time (JIT) or Privileged
      Access Management (PAM) capability directly inside AWS IAM or IAM Identity Center.
      Instead, AWS relies on and recommends third-party AWS Security Competency partner
      solutions (such as Apono, CyberArk, etc.) or custom, tenant-built automation
      (e.g., using Lambda functions, DynamoDB, and external ticketing integrations)
      to handle request, approval, and temporary elevation workflows. Well-Architected
      guidance explicitly advises customers to define emergency and temporary access
      requests within their own service request workflow systems or pre-create emergency
      roles and handle rotations manually.
