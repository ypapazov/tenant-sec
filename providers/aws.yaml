      title: Delete an AWS KMS key - AWS Key Management Service
      source_class: technical
      quote: After a KMS key is deleted, you can no longer decrypt the data that was
        encrypted under that KMS key, which means that data becomes unrecoverable.
      retrieved_at: '2026-09-23T03:35:43.507746+00:00'
      content_hash: sha256:252dda7219990103fe781edf45dc92f3d90648c08b8fa5e3dfbe470c6dbdb25b
      applicability:
        offering: public
        regions:
        - eu-west-1
        services: []
        edition: standard
    claims:
    - id: cl-automatic-rotation
      assertion: AWS KMS supports automatic key rotation with configurable rotation
