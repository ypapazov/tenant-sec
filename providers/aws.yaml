  compute.runtime-security:
    status: assessed
    score: mixed
    summary: AWS EC2, ECS, and EKS support advanced runtime security features meeting
      L3 criteria. EC2 instances on supported virtualized and Nitro-based hardware
      support UEFI Secure Boot and NitroTPM (virtual TPM) with measured boot and remote
      attestation. For host-based threat detection, AWS offers GuardDuty Runtime Monitoring
      which automatically installs, updates, and manages security agents on EC2 instances
      on behalf of the tenant, performing behavioral analysis rather than simple signature-based
      scannin
    services:
      ec2:
        status: assessed
        evidence: AWS EC2 supports NitroTPM (vTPM/measured boot) and UEFI Secure Boot,
          but they are not enabled by default on standard Linux AMIs (e.g., AL2023).
          Managed behavioral runtime monitoring is available through GuardDuty Runtime
          Monitoring with automated agent deployment via Systems Manager, which is
          a paid, opt-in feature.
        confidence: high
        score: 2
        references:
        - url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/nitrotpm.html
          title: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/nitrotpm.html
        - url: https://docs.aws.amazon.com/guardduty/latest/ug/how-runtime-monitoring-works-ec2.html
          title: https://docs.aws.amazon.com/guardduty/latest/ug/how-runtime-monitoring-works-ec2.html
        - url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/launch-instance-with-uefi-sb.html
          title: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/launch-instance-with-uefi-sb.html
      eks:
        status: assessed
        evidence: EKS node groups run on EC2 instances and support NitroTPM and UEFI
          Secure Boot as opt-in features. GuardDuty EKS Runtime Monitoring is available
          to provide container-level behavioral detection using a fully managed eBPF-based
          DaemonSet agent, but it must be explicitly enabled as a paid add-on.
        confidence: high
        score: 2
        references:
        - url: https://docs.aws.amazon.com/guardduty/latest/ug/how-runtime-monitoring-works-ec2.html
          title: https://docs.aws.amazon.com/guardduty/latest/ug/how-runtime-monitoring-works-ec2.html
      ecs:
        status: assessed
        evidence: ECS workloads on EC2 can leverage host-level secure launch features
          (opt-in). For ECS on Fargate, infrastructure and host runtime security are
