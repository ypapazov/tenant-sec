  log.immutability:
    status: assessed
    score: 3
    evidence: AWS achieves Level 3 maturity for log immutability by combining Amazon
      S3 Object Lock in Compliance Mode with CloudTrail log file integrity validation.
      In S3 Compliance Mode, log objects are protected by a WORM lock that cannot
      be overridden or deleted by any identity, including the root user. The retention
      period cannot be shortened, and any deletion or modification attempts are rejected
      with an access-denied error, which is captured in CloudTrail. Furthermore, CloudTrail's
      log file integrity validation uses SHA-256 hashing and digital signatures to
      provide an audit trail of any tamper attempts. To mitigate the risk of administrative
      bypass at the trail level (e.g., deleting or stopping the trail), AWS recommends
      deploying a dedicated, isolated Log Archive account controlled by service control
      policies (SCPs) in AWS Organizations.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
      title: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
    - url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
      title: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
    - url: https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/log-archive.html
      title: https://docs.aws.amazon.com/prescriptive-guidance/latest/security-reference-architecture/log-archive.html
    evidence_items:
    - id: ev-s3-object-lock-compliance
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
      title: Locking objects with Object Lock - Amazon Simple Storage Service
      source_class: technical
      quote: "Retention modes\nS3 Object Lock provides two retention modes that apply\
        \ different levels of protection to your objects:\n- \n                Compliance\
        \ mode\n- \n                Governance mode\nIn compliance mode, a protected\
        \ object version can't be overwritten or deleted by any user, including the\
        \ root user in your AWS account."
      retrieved_at: '2026-09-23T04:22:27.055665+00:00'
      content_hash: sha256:8ccfca5f7e8584417f5ba52cab467e90c07260e6a727e7a154dac99c891d4201
      applicability:
