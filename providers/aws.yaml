        services: []
        edition: standard
    - id: ev-kms-deletion
      url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
      title: Delete an AWS KMS key - AWS Key Management Service
      source_class: technical
      quote: "During the waiting period, the KMS key status and key state is Pending\
        \ deletion.\n- \n        A KMS key pending deletion cannot be used in any\
        \ cryptographic operations.\n- \n        AWS KMS does not rotate the key material\
        \ of KMS keys that are pending deletion."
      retrieved_at: '2026-09-23T03:35:43.507746+00:00'
      content_hash: sha256:252dda7219990103fe781edf45dc92f3d90648c08b8fa5e3dfbe470c6dbdb25b
      applicability:
        offering: public
        regions:
        - eu-west-1
        services: []
        edition: standard
    - id: ev-kms-shred
