  iam.root-account-recovery:
    status: assessed
    score: 1
    evidence: AWS provides a managed recovery control plane for member accounts via
      AWS Organizations Centralized Root Access Management. Using this feature, organization
      administrators can delete root credentials from member accounts, deactivate
      root MFA, and completely block root user password recovery. Under normal conditions,
      member accounts cannot sign in or recover their root password unless the management
      account explicitly enables the 'Allow password recovery' setting temporarily.
      However, this managed protection does not cover the AWS Organization's management
      account itself. The management account root user still relies on standard email-based
      password reset combined with phone/email verification if MFA is lost. To secure
      the management account's recovery path, tenants must rely on manual, procedurally-built
      multi-person approval (e.g., splitting access to the password and physical MFA
      device). Because managed recovery policy enforcement is highly advanced for
      member accounts but limited and cannot be required for the management account
      (the highest-privilege root recovery path), the capability is assessed at L2.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-enable-root-access.html
      title: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-enable-root-access.html
