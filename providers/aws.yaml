  enc.external-key-management:
    status: assessed
    score: 3
    evidence: AWS KMS supports External Key Stores (XKS), enabling customers to protect
      their AWS resources using cryptographic keys managed outside of AWS in an external
      key manager. Under this setup, AWS KMS delegates cryptographic operations to
      the customer-hosted external key manager through an external key store proxy
      (XKS proxy). If the tenant revokes access or the external key manager is disconnected,
      AWS KMS cannot decrypt the data keys, ensuring true hold-your-own-key (HYOK)
      capability. This capability is integrated with all major AWS storage and database
      services that support customer-managed keys (such as EBS, RDS, S3, and DynamoDB).
      Client-side encryption is also supported via the S3 Encryption Client.
    verified_at: '2026-09-23'
    confidence: high
