      AWS Shield Standard (default, free protection against layer 3 and 4 volumetric
      attacks) and AWS Shield Advanced (paid-tier subscription). Shield Standard is
      automatically enabled and protects all AWS resources at layers 3 and 4. Shield
      Advanced provides extensive layer 7 (application-layer) DDoS protection by integrating
      with AWS WAF, allowing automatic custom mitigation policies, such as web request
      rate-limiting from known DDoS sources. In addition, Shield Advanced offers real-time
      visibility into attacks, access to the AWS Shield Response Team (SRT), and financial
      cost protection against scaling charges resulting from DDoS spikes. It protects
      resources deployed directly in the VPC (ALB, NLB, EC2) as well as global endpoints
      (CloudFront, Route 53).
