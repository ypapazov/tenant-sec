  data.deletion-guarantees:
    status: assessed
    score: 1
    evidence: 'AWS achieves Level 2 on this control. AWS allows tenants to secure
      and logically erase storage devices, confirming compliance with DoD 5220.22-M
      and NIST SP 800-88 guidelines before storage block reuse. Cryptographic erasure
      (crypto-shredding) is fully supported via AWS KMS by scheduling the deletion
      of a customer-managed key (CMK) or deleting imported key material. However,
      AWS does not meet the strict requirements of Level 3 because: (1) AWS KMS key
      deletion has a mandatory waiting period of 7 to 30 days (for standard CMKs);
      (2) AWS does not contractually guarantee a complete data purge across all backups
      and replicas within 30 days of resource deletion; and (3) individual, per-customer
      certificates of physical destruction (media sanitization attestations) are not
      provided on request (AWS relies on systemic SOC/ISO audit reports instead).'
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.aws.amazon.com/ebs/latest/userguide/data-protection.html
      title: https://docs.aws.amazon.com/ebs/latest/userguide/data-protection.html
    - url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
      title: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
    evidence_items:
    - id: ev-ebs-data-protection
      url: https://docs.aws.amazon.com/ebs/latest/userguide/data-protection.html
      title: Data protection in Amazon EBS - AWS Documentation
      source_class: technical
      quote: The Amazon EBS service ensures that the devices are logically empty (that
        is, the raw blocks are zeroed or contain cryptographically pseudorandom data)
        before any customer use or re-use. If your procedures require erasing all
        data using a specific method, such as those detailed in DoD 5220.22-M (National
        Industrial Security Program Operating Manual) or NIST 800-88 (Guidelines for
        Media Sanitization), you can do so on Amazon EBS.
      retrieved_at: '2026-09-23T02:37:02.287572+00:00'
      content_hash: sha256:a5d7d22f0ab68b48d71cbcef2a71a002da2e2691d1483ced3d245801aa5f64b4
      applicability:
        offering: public
        regions:
        - eu-west-1
        services:
        - ebs
        edition: standard
    - id: ev-kms-deleting-keys
      url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
      title: Delete an AWS KMS key - AWS Documentation
      source_class: technical
      quote: After a KMS key is deleted, you can no longer decrypt the data that was
        encrypted under that KMS key, which means that data becomes unrecoverable.
        (The only exceptions are multi-Region replica keys and asymmetric and HMAC
        KMS keys with imported key material.) This risk is significant for asymmetric
        KMS keys used for encryption where, without warning or error, users can continue
        to generate ciphertexts with the public key that cannot be decrypted after
        the private key is deleted from AWS KMS.
      retrieved_at: '2026-09-23T02:37:02.287572+00:00'
      content_hash: sha256:252dda7219990103fe781edf45dc92f3d90648c08b8fa5e3dfbe470c6dbdb25b
      applicability:
        offering: public
        regions:
        - eu-west-1
        services:
        - kms
        edition: standard
    claims:
    - id: cl-crypto-shred-kms
      assertion: Tenants can achieve crypto-shredding by scheduling the deletion of
        a KMS key or deleting imported key material, rendering the encrypted data
        permanently unrecoverable.
      result: supported
      evidence_item_ids:
      - ev-kms-deleting-keys
      services:
      - kms
    - id: cl-logical-sanitization
      assertion: AWS guarantees logical volume sanitization before reuse and allows
