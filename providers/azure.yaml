  iam.multi-tenancy-isolation:
    status: assessed
    score: 3
    evidence: Azure implements multi-tenancy isolation within a tenant's footprint
      through Azure Subscriptions, which act as the primary security, billing, and
      quota boundary. Subscriptions are organized into a flexible hierarchy of up
      to six levels of depth using Management Groups. This hierarchy allows security
      policies and Role-Based Access Control (RBAC) to cascade and inherit automatically,
      achieving automated governance. Resource isolation is absolute by default, requiring
      explicit configurations to cross subscription boundaries. Independent billing
      is managed via cost scopes, and resource quotas are isolated per subscription.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://learn.microsoft.com/azure/governance/management-groups/overview
      title: https://learn.microsoft.com/azure/governance/management-groups/overview
    - url: https://learn.microsoft.com/azure/cost-management-billing/costs/understand-work-scopes
      title: https://learn.microsoft.com/azure/cost-management-billing/costs/understand-work-scopes
    - url: https://learn.microsoft.com/azure/azure-resource-manager/management/azure-subscription-service-limits
      title: https://learn.microsoft.com/azure/azure-resource-manager/management/azure-subscription-service-limits
    evidence_items:
    - id: ev-azure-mg-overview
      url: https://learn.microsoft.com/azure/governance/management-groups/overview
      title: Organize your resources with management groups - Azure Governance
      source_class: technical
      quote: If your organization has many Azure subscriptions, you might need a way
        to efficiently manage access, policies, and compliance for those subscriptions.
        Management groups provide a governance scope above subscriptions. When you
        organize subscriptions into management groups, the governance conditions that
        you apply cascade by inheritance to all associated subscriptions.
      retrieved_at: '2026-09-23T04:08:01.341175+00:00'
      content_hash: sha256:631b1aa136c33f606ed68a18216abe1db711cf14c71d38cb5a985aa452a3c331
