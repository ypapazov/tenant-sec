  iam.permission-boundaries:
    status: assessed
    score: 1
    evidence: Azure does not offer a native per-principal permission boundary mechanism
      that attaches directly to an IAM identity (user, role, or service principal)
      and evaluates permissions as an intersection with its assigned roles. Instead,
      Azure provides subscription-level and management-group-level controls through
      Azure Policy (functioning similarly to AWS SCPs as a permission ceiling), and
      natively supports constrained delegation via Azure Attribute-Based Access Control
