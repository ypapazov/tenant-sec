      title: Configure VPN Gateway Transit for Virtual Network Peering
      source_class: technical
      quote: "Replace the variables with the names of your virtual networks and resource\
        \ groups.\n$SpokeRG = \"SpokeRG1\"\n$SpokeRM = \"Spoke-RM\"\n$HubRG   = \"\
        HubRG1\"\n$HubRM   = \"Hub-RM\"\n$spokermvnet = Get-AzVirtualNetwork -Name\
        \ $SpokeRM -ResourceGroup $SpokeRG\n$hubrmvnet   = Get-AzVirtualNetwork -Name\
        \ $HubRM -ResourceGroup $HubRG\nAdd-AzVirtualNetworkPeering `\n  -Name SpokeRMtoHubRM\
        \ `\n  -VirtualNetwork $spokermvnet `\n  -RemoteVirtualNetworkId $hubrmvnet.Id\
        \ `\n  -UseRemoteGateways\nAdd-AzVirtualNetworkPeering `\n  -Name HubRMToSpokeRM\
        \ `\n  -VirtualNetwork $hubrmvnet `\n  -RemoteVirtualNetworkId $spokermvnet.Id\
        \ `\n  -AllowGatewayTransit\nNext steps\n- Use a VPN or ExpressRoute gateway\
        \ in a different region.\n- Learn more about virtual network peering constraints\
        \ and behaviors and virtual network peering settings before creating a virtual\
        \ network peering for production use.\n- Learn how to create a hub and spoke\
        \ network topology with virtual network peering and gateway transit.\n- Create\
        \ virtual network peering with the same deployment model.\n- Create virtual\
        \ network peering with different deployment models."
      retrieved_at: '2026-09-23T04:26:16.528947+00:00'
      content_hash: sha256:b6d904d7e804cc99ac94db6d0052afbee7469f99b6b427ba7584c20e0e559c26
