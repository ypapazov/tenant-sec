    status: assessed
    score: 2
    evidence: Azure provides native, managed exfiltration prevention and data discovery
      capabilities, placing it at L2. Through Virtual Network Service Endpoint Policies,
      tenants can restrict egress traffic to authorized Azure Storage accounts to
      prevent exfiltration. In addition, Microsoft Entra Tenant Restrictions allow
      organizations to enforce that users only access approved Entra tenants, preventing
      data sharing to external directories. While Azure SQL Database features integrated
      Data Discovery & Classification to identify and label sensitive information
      (integrating with Purview), it lacks native, real-time, inline content-aware
      blocking of data uploads or sharing across PaaS/IaaS storage surfaces, preventing
      it from reaching L3.
