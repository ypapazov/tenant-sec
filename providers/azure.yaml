  compute.image-management:
    status: assessed
    score: 2
    evidence: Azure offers managed private registries for containers (Azure Container
      Registry) and virtual machine images (Azure Compute Gallery). For AKS workloads,
      Microsoft Defender for Containers provides vulnerability scanning and support
      for gated deployments, while AKS Image Integrity (using Ratify/Notation) verifies
      image signatures. However, AKS Image Integrity is in preview and supports the
      'Audit' effect only, and signed image enforcement is unavailable for VM deployments,
      which matches the L2 criteria.
