    criteria_results:
    - level: 0
      met: false
      reasoning: Azure offers a highly integrated, managed Kubernetes service (AKS)
        with provider-managed control planes, which invalidates L0.
      claim_ids:
      - cl-aks-modes
    - level: 1
      met: false
      reasoning: AKS offers built-in identity integration, managed control planes,
        and robust infrastructure patching capabilities rather than a completely unmanaged
        and permissive environment.
      claim_ids:
      - cl-aks-modes
    - level: 2
      met: true
      reasoning: AKS Standard meets the criteria for L2. It provides managed control
        planes and node security patching defaults, integrated RBAC, and audit logs.
        However, network policies must be explicitly created or specified during provisioning,
        and pod security baselines are not universally enforced out-of-the-box on
        Standard clusters.
      claim_ids:
      - cl-aks-modes
      - cl-aks-network-policy-opt-in
    - level: 3
      met: false
      reasoning: While AKS Automatic contains many L3 capabilities by default, the
        broader AKS offering still relies on opt-in choices for runtime threat detection
        (Defender for Containers) and does not enforce these hardened defaults universally
        on the standard deployment tier.
      claim_ids:
