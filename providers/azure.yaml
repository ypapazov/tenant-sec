  gov.hierarchy-delegation:
    status: assessed
    score: 3
    evidence: Azure fully meets the criteria for L3 maturity. It provides Azure Management
      Groups as a native hierarchical governance framework above the subscription
      level, supporting up to six levels of nested depth (excluding the root and subscription
      levels). Policies (via Azure Policy) and access controls (via Azure RBAC) are
      fully inherited down the tree from the point of assignment. Administrators can
      delegate permissions at any management group node, enabling scoped administrative
      control. Programmatic node creation is supported via Azure CLI, PowerShell,
      Terraform, and REST APIs.
