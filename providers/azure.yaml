  log.immutability:
    status: assessed
    score: 2
    evidence: Azure supports log immutability primarily through Azure Blob Storage
      with Immutable Storage (WORM) policies. Azure Monitor Logs are append-only but
      can be purged for compliance purposes; their workspace-level resource locks
      can also be removed by administrators. For a highly secure, tamper-proof audit
      trail, Azure recommends exporting logs (via diagnostic settings or workspace
      data export) to Azure Blob Storage and enabling locked time-based retention
      policies. These locked policies cannot be deleted or shortened by any user,
      including subscription owners or administrators. However, because log delivery
      is configured through Diagnostic Settings, an account administrator can delete
      or modify these diagnostic settings to stop log forwarding or redirect the logs
      to a parallel, non-locked storage account, which fits the L2 criteria.
    verified_at: '2026-09-23'
    confidence: high
    references:
