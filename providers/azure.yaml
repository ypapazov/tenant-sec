  gov.tagging-governance:
    status: assessed
    score: 3
    evidence: Azure provides comprehensive tagging governance through Azure Policy.
      It allows tenants to enforce tag requirements natively. Specifically, it can
      prevent the creation or modification of resources missing specific tags using
      the deny policy effect. It also supports automated tag remediation/inheritance
      using the modify policy effect (e.g., inheriting tags from parent resource groups
      using template functions like [resourcegroup().tags['TagName']]). Policies can
      be grouped into initiatives and applied hierarchically at the Management Group,
      Subscription, or Resource Group level. Cost allocation views based on these
      tags are natively supported in Azure Cost Management.
    verified_at: '2026-09-23'
    confidence: high
    references:
