controls:
  compute.container-orchestration:
    status: assessed
    score: 2
    evidence: 'Azure Kubernetes Service (AKS) operates under a shared responsibility
      model across two modes: AKS Standard and AKS Automatic. In the default and widely
      deployed AKS Standard mode, Azure provides improved defaults including a fully
      managed and updated control plane, integration with Microsoft Entra ID and Kubernetes
      RBAC, and support for audit logs. However, several hardening steps remain manual:
      network policies are not enabled by default and must be explicitly specified
      at cluster creation time (e.g., using `--network-policy azure`), and runtime
      threat detection with Microsoft Defender for Containers is an opt-in service.
      While AKS Automatic enforces a higher security baseline by default, the overall
      offering as evaluated against the standard baseline is assessed at L2.'
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://learn.microsoft.com/azure/aks/operator-best-practices-cluster-security
      title: https://learn.microsoft.com/azure/aks/operator-best-practices-cluster-security
    evidence_items:
    - id: ev-aks-security-best-practices
      url: https://learn.microsoft.com/azure/aks/operator-best-practices-cluster-security
      title: Best practices for cluster security and upgrades in Azure Kubernetes
        Service (AKS)
      source_class: technical
      quote: 'AKS supports two cluster modes: AKS Automatic and AKS Standard. Security
        objectives are the same in both modes, but implementation responsibility differs.
        AKS Automatic includes a hardened baseline with more preconfigured controls
        in supported configurations. AKS Standard provides broader direct configuration
        control, which increases operator responsibility for baseline setup and ongoing
        operations.'
      retrieved_at: '2026-09-23T02:09:41.206950+00:00'
      content_hash: sha256:1bb2e7c9018ba82ecd01485d9101cf5490dfeb270d93422fad85940cd53627f1
      applicability:
        offering: public
        regions:
        - westeurope
        services:
        - aks
        edition: standard
    - id: ev-aks-network-policy
      url: https://learn.microsoft.com/azure/aks/operator-best-practices-cluster-security
      title: Best practices for cluster security and upgrades in Azure Kubernetes
        Service (AKS)
      source_class: technical
      quote: To implement Network Policy, include the attribute --network-policy azure
        when creating the AKS cluster.
      retrieved_at: '2026-09-23T02:09:41.206950+00:00'
      content_hash: sha256:1bb2e7c9018ba82ecd01485d9101cf5490dfeb270d93422fad85940cd53627f1
      applicability:
        offering: public
        regions:
        - westeurope
        services:
