  iam.root-account-recovery:
    status: assessed
    score: 2
    evidence: Microsoft Entra ID provides managed capabilities to configure, protect,
      and monitor high-privilege account recovery, but lacks native platform-enforced
      multi-party approval or automated time delays for administrative recovery paths.
      To secure the recovery of the highest-privilege (Global Administrator) accounts,
      Microsoft recommends creating cloud-only 'emergency access' or 'break-glass'
      accounts. These accounts are configured with passwordless, phishing-resistant
      factors (such as FIDO2 passkeys or Certificate-Based Authentication) and must
      be excluded from typical Conditional Access policies to prevent lockout during
      federated identity provider outages. However, the multi-party operational safeguards
      (such as split custody of keys and storage in physical safes) are managed out-of-band
      rather than through an on-platform policy engine. Entra ID tracks all sign-ins
      and administrative changes in its audit logs, allowing tenants to set up custom
      monitoring and alerts on recovery events. Because managed recovery supports
      multiple hardened factors, out-of-band recovery controls, and immediate auditable
      notifications, but lacks programmatic multi-party approval or delay enforcement
      for all recovery paths, the offering is assessed at L2.
    verified_at: '2026-09-23'
    confidence: high
    references:
