  net.cross-environment-connectivity:
    status: assessed
    score: 3
    evidence: Azure virtual networking supports full cross-environment connectivity.
      Virtual Network Peering allows direct, low-latency connection between VNets.
      It is global (cross-region), cross-subscription, and cross-tenant (Microsoft
      Entra ID). To build hub-and-spoke topologies at scale with transitive routing,
      Azure offers Azure Virtual WAN (Microsoft-managed hub) and Azure Virtual Network
      Manager (for grouping and managing connectivity at scale). Centralized egress/ingress
      inspection is fully supported by routing spoke traffic through Azure Firewall
      or custom NVAs in the hub VNet using User-Defined Routes (UDRs). Gateway transit
      is also supported, allowing spokes to leverage the hub VNet's VPN or ExpressRoute
      gateways.
    verified_at: '2026-09-23'
    confidence: high
    references:
