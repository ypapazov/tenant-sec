  net.ddos-protection:
    status: assessed
    score: 3
    evidence: Azure provides a multi-layered DDoS protection architecture that meets
      the requirements for L3. By default, all Azure services are inherently protected
      by infrastructure-level Layer 3/4 DDoS protection. For dedicated protection,
      Azure offers Azure DDoS Protection (available as DDoS Network Protection or
      DDoS IP Protection) which delivers adaptive real-time tuning, telemetry, and
      logging for resources in virtual networks (VNets). For Layer 7 protection, Azure
      Web Application Firewall (WAF) is available on Application Gateway v2 or Azure
      Front Door Premium, which supports automated L7 mitigation (HTTP DDoS ruleset),
      custom rules (IP/geo/ASN allow/deny), and rate limiting. Additionally, Microsoft
      provides a cost guarantee to issue service credits for resource costs incurred
      during a documented DDoS attack.
    verified_at: '2026-09-23'
    confidence: high
