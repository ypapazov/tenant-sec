    evidence_items:
    - id: ev-azure-physical-security-disposal
      url: https://learn.microsoft.com/azure/security/fundamentals/physical-security
      title: Azure Physical Security - Equipment Disposal and Media Sanitization
      source_class: technical
      quote: When a system reaches end of life, Microsoft operational personnel follow
        rigorous data handling and hardware disposal procedures to ensure that untrusted
        parties can't access hardware that contains your data. Microsoft uses best
        practices and a wiping solution that complies with NIST 800-88. Microsoft
        uses a secure erase approach for hard drives that support it. If Microsoft
        can't wipe a hard drive, Microsoft uses a destruction process that destroys
        the drive and renders the recovery of information impossible.
      retrieved_at: '2026-09-23T02:22:17.964956+00:00'
      content_hash: sha256:f0a5562446a77fbc83f781cf7952b70c0ae924ee61d5b6c6e1eb9087ed452fc3
