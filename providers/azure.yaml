  incident.availability-zones:
    status: assessed
    score: 2
    evidence: Azure provides Availability Zones (AZs) in many of its regions, featuring
      physically separate datacenters with independent power, cooling, and networking
      infrastructure. In regions where AZs are supported, there are typically three
      zones. However, AZs are not universally available across all Azure regions globally,
      as some older or restricted regions do not offer them. Additionally, while zone
      redundancy is supported and thoroughly documented for major services, it is
      not the default configuration for all managed services; tenants must explicitly
      configure zone-redundant or zone-spanning resources for many services (e.g.,
      Virtual Machines, certain storage SKUs, and SQL databases). Cross-region deployment
      and geo-replication (using paired or nonpaired regions) are available but require
      complex tenant configuration. This architecture aligns perfectly with Level
      2 of the maturity model.
