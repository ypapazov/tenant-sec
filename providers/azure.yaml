  gov.quotas-service-control:
    status: assessed
    score: 3
    evidence: Azure Policy provides full service, regional, and resource-type control
      at the organizational level (Management Groups). Using built-in policy definitions
      such as Allowed locations (which allow-lists regions) and Allowed resource types
      (which allow-lists specific Azure services/resources), tenants can restrict
      what can be deployed. Additionally, custom policies can restrict specific resource
      configurations (such as blocking certain VM SKUs like standard G series). These
      policies can be assigned at the Management Group scope, automatically cascading
      to all child subscriptions and applying to newly added resource groups or subscriptions
      dynamically without manual intervention.
