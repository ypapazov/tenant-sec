  compute.serverless-security:
    status: assessed
    score: 1
    evidence: Azure Functions security is managed at the Function App level rather
      than the individual function level. Inbound Private Endpoints and outbound Virtual
      Network (VNet) integration are fully supported across Flex Consumption, Premium,
      and Dedicated hosting plans, satisfying private networking requirements. For
      IAM, permissions take effect at the Function App level; Microsoft explicitly
      recommends organizing functions by privilege into separate Function Apps to
      achieve granular IAM roles and prevent cross-function credential sharing. However,
      because multiple functions in the same Function App share the same execution
      environment, identity, and application settings, there is no technical security
      isolation between functions in the same app. Additionally, concurrency and timeout
      limits are configured globally or at the host level (via host.json) for the
      entire app rather than strictly per-function, which aligns precisely with L2
      criteria.
    verified_at: '2026-09-23'
    confidence: high
