  data.deletion-guarantees:
    status: assessed
    score: 1
    evidence: Based on the provided documentation, Azure supports Customer-Managed
      Keys (CMK) via Azure Key Vault or Managed HSM. This allows tenants to control
      the key lifecycle, including destroying key material to perform crypto-shredding,
      satisfying the L1 requirements. Additionally, Microsoft's physical security
      documentation details equipment disposal and media sanitization procedures conforming
      to NIST 800-88. However, the specific tenant-logical data deletion timelines
      (e.g., 30-day, 90-day, or 180-day guarantees) and per-customer sanitization
      attestations are not documented in the provided files. Consequently, higher
      levels (L2 and L3) cannot be verified, leading to a score of L1. Deep research
      is recommended to locate Azure's Data Protection Addendum (DPA) or specific
      Data Deletion Policy.
