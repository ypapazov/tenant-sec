    - id: ev-aks-defender
      url: https://learn.microsoft.com/azure/aks/operator-best-practices-cluster-security
      title: Best practices for cluster security and upgrades in Azure Kubernetes
        Service (AKS)
      source_class: technical
      quote: You can enable Defender for Containers to help secure your containers.
        Defender for Containers can assess cluster configurations and provide security
        recommendations, run vulnerability scans, and provide real-time protection
        and alerting for Kubernetes nodes and clusters.
      retrieved_at: '2026-09-23T02:09:41.206950+00:00'
      content_hash: sha256:1bb2e7c9018ba82ecd01485d9101cf5490dfeb270d93422fad85940cd53627f1
