      source_class: technical
      quote: "Each layer catches traffic the layer above it doesn't.\n| Layer | What\
        \ it does | Where to configure it | \n|---|---|---|\n| Platform DDoS protection\
        \ | Absorbs L3/L4 volumetric attacks on the Azure edge and on your origin\
        \ public IPs | Built in by default on Azure Front Door; requires Azure DDoS\
        \ Network Protection for Application Gateway public IPs and origin public\
        \ IPs | \n| Automated L7 mitigation | Learns your normal traffic and throttles\
        \ offending clients during a surge, with no emergency tuning | HTTP DDoS ruleset\
        \ (preview) on Azure Front Door Premium and Application Gateway WAF v2 | \n\
        | Client verification | Separates humans and legitimate clients from automated\
        \ attack traffic before blocking | Bot Manager ruleset, JavaScript challenge,\
        \ CAPTCHA | \n| Rate limiting | Caps how many requests any client, geography,\
        \ or endpoint can send | Rate limit custom rules on Front Door and Application\
        \ Gateway | \n| Targeted custom rules | Blocks a known attack signature during\
        \ an incident | Match custom rules (geo, IP, ASN, client fingerprint, header,\
        \ URI) | \n| Origin protection | Keeps attack traffic from reaching your compute\
        \ at all | Caching, origin lock-down, autoscale | \nBaseline configuration "
