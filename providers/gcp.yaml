  data.dlp:
    status: assessed
    score: 3
    evidence: Google Cloud provides a native DLP service called Sensitive Data Protection
      (formerly Cloud DLP) that allows automated discovery, profiling, and deep inspection
      of sensitive data across key storage and analytical services (Cloud Storage,
      BigQuery, Cloud SQL) at the organization, folder, or project level. While it
      offers content policies that can evaluate content and return an ALLOW or BLOCK
      verdict, the platform does not natively and automatically block uploads or egress
      based on these policies in a turnkey manner; instead, the client application
      must intercept the traffic and enforce the verdict. Thus, it qualifies as Level
      2.
