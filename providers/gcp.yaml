    evidence_items:
    - id: ev-gcp-resource-locations
      url: https://docs.cloud.google.com/organization-policy/restrict-locations
      title: Restrict resource locations | Organization Policy
      source_class: technical
      quote: 'Go to Organization policies

        - From the project picker, select the organization, folder, or project for
        which you want to set the organization policy.

        - Select the Google Cloud Platform - Resource Location Restriction constraint
        to open its Policy details page.

        - Click Manage policy.

        - On the Edit policy page, select Override parent''s policy.

        - Under Policy enforcement, select Replace.

        - Click Add rule.

        - Under Policy values, select Custom.

        - Under Policy type, select Allow to create a list of allowed locations, or
        select Deny to create a list of denied locations.

        - In the Policy value box, enter the in prefix and a

        value group location string, then press Enter.For example, in:us-locations
        orin:us-west1-locations .'
