    - id: cl-integrity-monitoring
      assertion: Google Cloud Compute Engine offers advanced integrity monitoring
        comparing boot measurements to a trusted baseline and logging discrepancies.
      result: supported
      evidence_item_ids:
      - ev-gcp-shielded-vm-docs
      services:
      - compute-engine
    criteria_results:
    - level: 0
      met: false
      reasoning: Compute Engine offers Shielded VM capabilities, meaning it does not
        fall into the L0 category of having no runtime or boot security features.
      claim_ids:
      - cl-secure-boot
    - level: 1
      met: true
      reasoning: While tenant-managed agents can be installed, Google Cloud provides
        native managed boot-level security controls.
      claim_ids:
      - cl-secure-boot
      - cl-vtpm
      - cl-integrity-monitoring
    - level: 2
      met: true
      reasoning: Google Cloud provides Shielded VMs with Secure Boot, vTPM, and measured
        boot with integrity monitoring on startup, but standard configurations do
        not include managed runtime behavioral detection.
      claim_ids:
      - cl-secure-boot
      - cl-vtpm
      - cl-integrity-monitoring
    - level: 3
      met: false
      reasoning: Full managed host-based runtime behavioral detection integrated into
        the security console is not part of the standard default Shielded VM capability
        shown in the core documentation, limiting the standard offering to L2.
      claim_ids: []
  compute.secrets-management:
    status: assessed
    score: 3
    evidence: Google Cloud Platform provides a fully managed secrets store called
      Secret Manager. It supports fine-grained IAM-based access control on individual
      secrets, comprehensive audit logging of all secret access, and managed automatic
      rotation. Secrets can be programmatically retrieved via API/SDKs or natively
      injected without writing custom code into compute runtimes. Specifically, the
      Google-managed Secret Manager add-on for GKE (derived from the CSI Secrets Store
      driver) mounts secrets as volumes directly in Kubernetes pods, while Cloud Run
      and Cloud Run functions support native volume-mount injection of secrets as
      files.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/secret-manager/docs/using-other-products
      title: https://cloud.google.com/secret-manager/docs/using-other-products
