  iam.permission-boundaries:
    status: assessed
    score: 1
    evidence: Google Cloud does not natively support per-principal IAM permission
      boundaries (which cap the maximum permissions a delegated admin can grant or
      that a principal can exercise). GCP's Principal Access Boundary (PAB) policies
      are designed to limit resource access (e.g., restricting which projects, folders,
      or organizations a principal can access to prevent data exfiltration) rather
      than restricting specific IAM permissions or actions. Organization-level and
      folder-level ceilings can be enforced using IAM Deny policies (similar to SCPs),
      satisfying L1 criteria through organizational boundaries and custom monitoring,
      but safe delegatable permission boundaries are not natively available.
    verified_at: '2026-09-23'
    confidence: high
    references:
