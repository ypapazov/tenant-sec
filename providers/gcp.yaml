  compute.serverless-security:
    status: assessed
    score: 2
    evidence: Google Cloud serverless compute (Cloud Run and Cloud Functions) provides
      a solid serverless security posture that aligns with Level 2. Each service/function
      can run under its own dedicated IAM Service Account, though the use of unique
      identities is not strictly enforced by default (falling back to a default service
      account if unspecified). Outbound VPC networking is supported via Direct VPC
      Egress or Serverless VPC Access connectors. Sandboxing and execution environment
      isolation are heavily prioritized using gVisor (1st gen) and Linux microVMs
      (2nd gen) with VMM-enforced boundaries to prevent cross-tenant/cross-function
      leakage. However, warm instances are reused across sequential invocations for
      performance, meaning a clean environment is not guaranteed for every single
      invocation. Per-service concurrency limits are fully configurable, and anomalous
      runtime behavior monitoring is supported through Cloud Run Threat Detection.
    verified_at: '2026-09-23'
    confidence: high
    references:
