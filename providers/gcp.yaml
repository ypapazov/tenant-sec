    evidence: Google Cloud meets L3 requirements by offering comprehensive, managed
      cross-environment connectivity architectures. For simple cross-environment connectivity,
      Google Cloud supports VPC Network Peering (connecting VPCs across projects and
      organizations) and Shared VPC (sharing subnets from a central host project to
      multiple service projects). To manage complex topologies at scale and overcome
      transitive routing limitations of traditional peering, Google Cloud provides
      Network Connectivity Center (NCC). NCC supports VPC spokes attached to a centralized
      global Hub resource to dynamically exchange subnet routes. NCC also supports
      Gateway spokes to integrate third-party Security Service Edge (SSE) platforms,
      enabling centralized ingress/egress security and traffic inspection across connected
      environments.
