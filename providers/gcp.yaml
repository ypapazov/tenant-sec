  compute.runtime-security:
    status: assessed
    score: 2
    evidence: Google Cloud Compute Engine provides Shielded VMs with a triple shield
      architecture comprising Secure Boot, virtual Trusted Platform Module (vTPM),
      and integrity monitoring. Secure Boot ensures that the boot components are cryptographically
      signed and verified; vTPM enables Measured Boot to establish a secure baseline;
      and integrity monitoring compares the latest boot measurements against that
      baseline, writing verification events to Cloud Logging and Security Command
      Center.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/compute/shielded-vm/docs/shielded-vm
      title: https://cloud.google.com/compute/shielded-vm/docs/shielded-vm
    evidence_items:
    - id: ev-gcp-shielded-vm-docs
      url: https://cloud.google.com/compute/shielded-vm/docs/shielded-vm
      title: Shielded VM
      source_class: technical
      quote: Shielded VM offers verifiable integrity of your Compute Engine VM instances,
        so you can be confident your instances haven't been compromised by boot- or
        kernel-level malware or rootkits.
      retrieved_at: '2026-09-23T02:10:58.633377+00:00'
      content_hash: sha256:359475612bbc9186e4b34db4d9006d2139ec1b128048124321234601bb44d3c0
      applicability:
