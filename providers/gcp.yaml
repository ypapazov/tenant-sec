  net.isolation-model:
    status: assessed
    score: 3
    evidence: Google Cloud Platform (GCP) provides a highly scalable, global Virtual
      Private Cloud (VPC) network architecture that is logically isolated. By default,
      every custom VPC network implements a distributed virtual firewall with implied
      rules that block all incoming connections (deny-all ingress) and allow all outgoing
      connections (allow-all egress). Subnets are regional resources within the global
      VPC and support tiered designs, including private subnets via Private Google
      Access where VMs only have internal IP addresses. VPC Network Peering is fully
      supported across different projects and organizations using internal IP routing.
      While routing tables are network-wide, route targeting can be customized at
      the instance level using network tags. Subnet-level traffic monitoring is supported
      via VPC Flow Logs.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/vpc/docs/overview
