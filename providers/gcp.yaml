  net.threat-prevention:
    status: assessed
    score: 2
    evidence: Google Cloud provides highly mature, native network threat prevention
      capabilities through Cloud IDS (Intrusion Detection System) and Cloud Next Generation
      Firewall (Cloud NGFW) Enterprise. Cloud IDS offers managed threat detection
      (powered by Palo Alto Networks) with visibility into north-south, east-west,
      and VM-to-VM traffic. For active prevention, Cloud NGFW Enterprise delivers
      managed Intrusion Prevention System (IPS) capabilities using zonal firewall
      endpoints that inspect intercepted traffic for anti-spyware, antivirus, and
      vulnerability signatures. Policy management is centralized via Organization
      or Project-level Security Profiles and Security Profile Groups attached to global
      or hierarchical firewall rules. Encryption is addressed natively through TLS
      Inspection, enabling decryption and threat scanning for inbound, outbound, and
      internal Google Cloud traffic. Real-time threat logs are exported to Cloud Logging
      for response integration.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/intrusion-detection-system/docs/overview
      title: https://cloud.google.com/intrusion-detection-system/docs/overview
    - url: https://cloud.google.com/firewall/docs/about-intrusion-prevention
      title: https://cloud.google.com/firewall/docs/about-intrusion-prevention
    - url: https://cloud.google.com/firewall/docs/about-security-profiles
      title: https://cloud.google.com/firewall/docs/about-security-profiles
    evidence_items:
    - id: ev-gcp-cloud-ids-overview
      url: https://cloud.google.com/intrusion-detection-system/docs/overview
      title: Cloud IDS overview
      source_class: technical
      quote: Traffic in the peered network is mirrored and then inspected by Palo
        Alto Networks threat protection technologies to provide advanced threat detection.
      retrieved_at: '2026-09-23T04:24:23.963941+00:00'
      content_hash: sha256:3088d90d5760ecba4270b59d72a6c0399a9af51478c8ab547900f1ce81ae03de
      applicability:
        offering: public
        regions:
        - europe-west1
        services:
        - vpc
        edition: standard
    - id: ev-gcp-ngfw-idps-overview
      url: https://cloud.google.com/firewall/docs/about-intrusion-prevention
      title: Intrusion detection and prevention service overview
      source_class: technical
      quote: 'Security profiles and security profile groups

        Cloud NGFW references security profiles and security profile groups to implement
        deep packet inspection for intrusion detection and prevention service.

        - Security profiles are generic policy structures that you can configure at
        the organization level or at the project level.'
      retrieved_at: '2026-09-23T04:24:23.963941+00:00'
      content_hash: sha256:15d0eea233ea098c2f471f2a82dc8d98805b94727c50b2ba140ea03c31349310
      applicability:
        offering: public
        regions:
        - europe-west1
        services:
        - vpc
        edition: standard
    - id: ev-gcp-ngfw-security-profiles
      url: https://cloud.google.com/firewall/docs/about-security-profiles
      title: Security profile overview
      source_class: technical
      quote: "Specifications\n- Cloud Next Generation Firewall (Cloud NGFW) supports\
        \ the following types of security profiles: \n  - THREAT_PREVENTION\n  - WILDFIRE_ANALYSIS\
        \ (Preview)\n  - URL_FILTERING\n- A security profile is a resource that you\
        \ can configure at the organization level or the project level. \n  - Organization-level\
        \ security profile: use this profile to create and manage organization-level\
        \ and project-level firewall endpoints.\n  - Project-level security profile:\
        \ use this profile to create and manage project-level firewall endpoints in\
        \ the same project.\n- The name of a security profile is configured in the\
        \ following URL identifier format: \n  - Organization-level: organizations/ORGANIZATION_ID/locations/global/securityProfiles/NAME\n\
        \  - Project-level: projects/PROJECT_ID/locations/global/securityProfiles/NAME\n\
        \ The NAME of the security profile must meet the following requirements:\n\
        \  - A string 1 to 63 characters long\n  - Contains only lowercase alphanumeric\
        \ characters or hyphens (-)\n  - Starts with a letter\n Examples: \n  - Organization-level\
        \ security profile: organizations/2345678432/locations/global/securityProfiles/example-security-profile\n\
        \  - Project-level security profile: projects/my"
      retrieved_at: '2026-09-23T04:24:23.963941+00:00'
      content_hash: sha256:55280477e1a824c8dfde5d2a96f5759e40097d5ba96a78188e2896b406dd809c
      applicability:
        offering: public
        regions:
        - europe-west1
        services:
        - vpc
        edition: standard
    claims:
    - id: cl-gcp-ids-detection
      assertion: Cloud IDS provides managed threat detection for north-south and east-west
        VPC traffic, leveraging Palo Alto Networks technologies.
      result: supported
      evidence_item_ids:
      - ev-gcp-cloud-ids-overview
      services:
      - vpc
      - compute-engine
    - id: cl-gcp-ngfw-prevention
      assertion: Cloud NGFW Enterprise provides managed intrusion prevention (IPS)
        to detect and block malicious traffic.
      result: supported
      evidence_item_ids:
