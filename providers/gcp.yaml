  net.flow-logging:
    status: assessed
    score: 2
    evidence: Google Cloud provides a managed VPC Flow Logs capability that can be
      enabled at the subnet, VPC, or organization level. It aggregates sampled connection
      metadata (5-tuple) and supports near real-time aggregation intervals down to
      5 seconds, exportable to Google Cloud Storage (object storage), BigQuery, or
      Pub/Sub (for external SIEMs). It does not, however, support enabling logs directly
      at individual network interfaces (it must be done at the subnet level), and
      the VPC Flow Logs themselves do not capture packets dropped/rejected by firewall
      rules (this requires enabling separate Firewall Rules Logging). Therefore, it
      meets the L2 criteria but falls short of L3.
    verified_at: '2026-09-23'
    confidence: high
    references:
