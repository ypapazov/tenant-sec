  iam.abac:
    status: assessed
    score: 2
    evidence: Google Cloud Platform (GCP) natively supports Attribute-Based Access
      Control (ABAC) through IAM Conditions and Resource Manager Tags. IAM Conditions
      use Common Expression Language (CEL) to write boolean logic expressions combining
      attributes of the resource (such as name, service, type, or tags) and the request
      (such as request time or access levels representing device posture/IP). Resource
      Manager Tags are tenant-defined key-value pairs attached at the resource, project,
      folder, or organization level and are inherited downstream, allowing conditional
      access to be applied to any Google Cloud resource. However, GCP IAM Conditions
      do not natively support arbitrary principal tags or session-based principal
      tags flowing through delegation chains, keeping it at L2.
