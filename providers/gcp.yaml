  iam.service-identity:
    status: assessed
    score: 3
    evidence: Google Cloud Platform (GCP) provides robust, first-class support for
      workload identities and federation across all major environments. For resources
      running inside GCP, Google Compute Engine (GCE), GKE, and serverless compute
      surfaces natively use attached Service Accounts to fetch short-lived OAuth 2.0
      access tokens via the metadata server, avoiding the use of static credentials.
      For Kubernetes, Workload Identity Federation for GKE dynamically maps Kubernetes
      ServiceAccounts to Google Service Accounts. For external or cross-cloud workloads,
      Google Cloud Workload Identity Federation supports OpenID Connect (OIDC) and
      SAML 2.0 token exchange natively, allowing workloads running in AWS, Azure,
      GitHub Actions, GitLab, or on-premises environments to exchange their local
      credentials directly for short-lived Google Cloud STS tokens without storing
      long-lived service account keys.
