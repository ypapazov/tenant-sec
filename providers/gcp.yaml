  net.egress-control:
    status: assessed
    score: 3
    evidence: Google Cloud Platform (GCP) provides L3 egress control capabilities
      through Cloud Next Generation Firewall (Cloud NGFW), Secure Web Proxy, and Cloud
      NAT. Users can deploy centralized egress configurations where outbound traffic
      is routed through managed gateways, with Cloud NGFW executing Layer 7 URL and
      domain-level filtering based on HTTP Host headers and SNI details. Egress policies
      support TLS inspection for deep-packet decryption of HTTPS traffic headers.
      Logging is supported at the firewall rule level, and hierarchical (org-level)
      firewall policies enable uniform enforcement of egress inspection across all
      projects in the organization.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/firewall/docs/about-url-filtering
      title: https://cloud.google.com/firewall/docs/about-url-filtering
    - url: https://cloud.google.com/secure-web-proxy/docs/use-cloud-nat-for-swp
      title: https://cloud.google.com/secure-web-proxy/docs/use-cloud-nat-for-swp
    - url: https://cloud.google.com/firewall/docs/quickstarts/configure-nwfwpolicy-fqdn-egress
      title: https://cloud.google.com/firewall/docs/quickstarts/configure-nwfwpolicy-fqdn-egress
    evidence_items:
    - id: ev-url-filtering-overview
      url: https://cloud.google.com/firewall/docs/about-url-filtering
      title: URL filtering service overview | Cloud Next Generation Firewall | Google
        Cloud Documentation
      source_class: technical
      quote: 'How the URL filtering service works

        The URL filtering service processes the HTTP(S) traffic in the following sequence:

        - The URL filtering service applies firewall policy rules to the traffic to
        and from the VM instances or Google Kubernetes Engine (GKE) clusters in the
        network.

        - The URL filtering service intercepts and sends matched traffic to the firewall
        endpoint for Layer 7 inspection.

        - For encrypted traffic where TLS inspection is enabled, the URL filtering
        service decrypts the message headers and uses the domain specified in the
        host header along with the SNI sent during TLS negotiation to check for a
        match against the configured URLs.'
      retrieved_at: '2026-09-23T04:17:41.266817+00:00'
      content_hash: sha256:c5fa6f69016ea7508148b91491184c46ac6a047f311614cd29cae4a5c2570569
      applicability:
        offering: public
        regions:
        - europe-west1
        services: []
        edition: standard
    - id: ev-secure-web-proxy-nat
      url: https://cloud.google.com/secure-web-proxy/docs/use-cloud-nat-for-swp
      title: Use Cloud NAT for Secure Web Proxy | Google Cloud Documentation
      source_class: technical
      quote: When you provision a Secure Web Proxy instance, a Cloud NAT gateway is
        automatically created in the same region and Virtual Private Cloud (VPC) network.
        This gateway then manages internet access by mapping private IPs to public
        IPs for all outbound web traffic that originates from your Secure Web Proxy
