  compute.image-management:
    status: assessed
    score: 2
    evidence: Google Cloud Platform provides high-maturity image management capabilities.
      For containerized workloads on GKE and Cloud Run, it achieves L3 through Artifact
      Registry, Artifact Analysis continuous scanning, and Binary Authorization for
      signature verification/enforcement (with org-policy hooks). For Compute Engine
      (VMs), it achieves L2, allowing organization-level restrictions on image sources
      via compute.trustedImageProjects but lacking continuous vulnerability-based
      deployment blocking or cryptographic image signing verification.
    verified_at: '2026-09-23'
    confidence: high
    references:
