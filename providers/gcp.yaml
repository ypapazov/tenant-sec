    score: 2
    evidence: Google Cloud provides Identity-Aware Proxy (IAP) TCP forwarding as a
      managed session/bastion service that permits interactive access (SSH/RDP) to
      Compute Engine instances without requiring external IP addresses. This access
      is authenticated and authorized via Identity and Access Management (IAM) permissions
      prior to tunnel creation. When coupled with the OS Login feature, SSH key distribution
      is automated and linked to the user's Google Identity. While connection events
