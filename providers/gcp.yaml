  enc.external-key-management:
    status: assessed
    score: 3
    evidence: Google Cloud fully supports External Key Management (Cloud EKM), allowing
      tenants to protect data at rest in supported Google Cloud services (such as
      Compute Engine Persistent Disk, Cloud Storage, and BigQuery) using keys stored
      and managed in a tenant-hosted external key manager (EKM). Key material resides
      entirely outside the cloud provider, and externally managed keys are never cached
      or stored within Google Cloud; instead, Cloud KMS communicates directly with
      the external key manager over the internet or a VPC for each cryptographic operation.
      If the EKM is unavailable or access is revoked, data becomes completely inaccessible
      to Google, fulfilling the strict criteria for L3 maturity.
