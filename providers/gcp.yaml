      quote: 'When to use Sensitive Data Protection

        The following are some common use cases:

        - Discover shadow data across enterprise cloud repositories: Continuously
        scan and profile data assets across BigQuery, Cloud SQL, and Cloud Storage
        to locate uncatalogued sensitive data and evaluate organizational security
        posture.

        - Prevent sensitive data exposure in real-time applications: Inspect and redact
        sensitive tokens (such as PII or credentials) from streaming API payloads,
        user forms, and LLM prompt inputs before storing the data.

        - De-identify analytical datasets while preserving utility: Transform direct
        and indirect identifiers using pseudonymization, date shifting, or bucketing
        so research and business intelligence teams can analyze data without exposing
        plaintext PII.

        - Automate compliance auditing and regulatory reporting: Detect and monitor
        protected health information (PHI) and financial records to satisfy compliance
        obligations under GDPR, HIPAA, and PCI DSS.

        - Stream security findings into incident response pipelines: Send high-risk
        finding alerts to Pub/Sub and Security Command Center to trigger automated
        data tagging, access revocation, and security remediation workflows.'
