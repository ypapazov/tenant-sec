      services:
      - vpc
      - compute-engine
      - gke
    - id: cl-gcp-ngfw-centralized
      assertion: Cloud NGFW supports centralized security profiles and security profile
        groups configured at the organization or project level, enforced via hierarchical
        or global network firewall policies.
      result: supported
      evidence_item_ids:
      - ev-gcp-ngfw-security-profiles
      - ev-gcp-ngfw-idps-overview
      services:
      - vpc
    - id: cl-gcp-ngfw-decryption
      assertion: Cloud NGFW supports explicit TLS decryption (TLS inspection) to inspect
        encrypted traffic (inbound, outbound, and internal).
      result: supported
      evidence_item_ids:
      - ev-gcp-ngfw-idps-overview
      services:
      - vpc
      - compute-engine
    criteria_results:
    - level: 0
      met: false
      reasoning: Google Cloud provides highly capable, native platform interfaces
        for network threat detection and prevention (Cloud IDS and Cloud NGFW), meaning
        inspection and prevention are fully achievable from the tenant space.
      claim_ids:
      - cl-gcp-ids-detection
      - cl-gcp-ngfw-prevention
    - level: 1
      met: false
      reasoning: While tenants can deploy their own virtual appliances, they are not
        forced to manage scaling, routing, availability, or signatures manually, because
        GCP provides fully managed platform-native threat prevention services.
      claim_ids:
      - cl-gcp-ids-detection
      - cl-gcp-ngfw-prevention
    - level: 2
      met: true
      reasoning: Google Cloud satisfies all Level 2 conditions as managed IDS, IPS,
        packet mirroring, and threat prevention are native and fully supported.
      claim_ids:
      - cl-gcp-ids-detection
      - cl-gcp-ngfw-prevention
      - cl-gcp-ngfw-decryption
    - level: 3
      met: true
      reasoning: Google Cloud achieves Level 3 by offering managed prevention (Cloud
        NGFW Enterprise IPS) with highly centralized policy definition (organization-level
        security profiles and groups integrated with hierarchical firewall policies),
        broad ingress/egress/east-west coverage, customizable signature actions (overrides
        and exceptions), native TLS decryption for inspection, high availability via
        Google-managed endpoints, and real-time logging integration.
      claim_ids:
      - cl-gcp-ids-detection
      - cl-gcp-ngfw-prevention
      - cl-gcp-ngfw-centralized
      - cl-gcp-ngfw-decryption
  net.waf:
    status: assessed
    score: 3
    evidence: Google Cloud Armor represents a comprehensive managed Web Application
      Firewall (WAF) service, satisfying all requirements of the Level 3 criteria.
      It includes preconfigured WAF rule sets (OWASP Core Rule Set 3.0, 3.3, 4.22),
      a flexible custom rules language for complex L7 matching conditions, rate limiting,
      and threat intelligence. Bot management is fully supported through deep integration
      with Google reCAPTCHA, offering manual CAPTCHA challenges and frictionless risk
      scoring. It integrates seamlessly with global and regional external Application
      Load Balancers, Cloud CDN, and various external proxy Network Load Balancers.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.cloud.google.com/armor/docs/cloud-armor-overview
      title: https://docs.cloud.google.com/armor/docs/cloud-armor-overview
    - url: https://docs.cloud.google.com/armor/docs/security-policy-overview
      title: https://docs.cloud.google.com/armor/docs/security-policy-overview
    - url: https://cloud.google.com/armor/docs/bot-management
      title: https://cloud.google.com/armor/docs/bot-management
    evidence_items:
    - id: ev-ca-overview
      url: https://docs.cloud.google.com/armor/docs/cloud-armor-overview
      title: Cloud Armor overview
      source_class: technical
      quote: 'You can attach security policies to the backend services of the following
        load balancers:

        - All external Application Load Balancers, including classic Application Load
        Balancers

        - Regional internal Application Load Balancer

        - Global external proxy Network Load Balancer (TCP/SSL)

        - Classic proxy Network Load Balancer (TCP/SSL)

        - Regional external passthrough Network Load Balancer (TCP/UDP)

        Cloud Armor security policies allow you to permit or deny access to your deployment
        at the Google Cloud edge, close to the traffic source.'
      retrieved_at: '2026-09-23T04:24:08.709818+00:00'
      content_hash: sha256:b474d5af38179503b421e7dab3c632b316916c8ee4bb9243ca96d3ed451439de
      applicability:
        offering: public
        regions:
        - europe-west1
        services:
        - cloud-armor
        edition: standard
    - id: ev-ca-policy
      url: https://docs.cloud.google.com/armor/docs/security-policy-overview
      title: Security policy overview
      source_class: technical
      quote: "In the following diagram, the Cloud Armor security policy\ninternal-users-policy\
        \ is associated with the backend service test-network.\n- You can optionally\
        \ use the QUIC protocol with load balancers that use\nCloud Armor.\n- You\
        \ can use Cloud Armor with load balancers that are in either of the following\
        \ Network Service Tiers: \n  - Premium Tier\n  - Standard Tier\n- You can\
        \ use backend security policies with GKE and the default ingress controller.\n\
        - You can use a default security policy that throttles traffic over a user-specified\
        \ threshold when you configure one of the following load balancers: \n  -\
        \ Global external Application Load Balancer\n  - Classic Application Load\
        \ Balancer\n  - Regional external Application Load Balancer\n  - Regional\
        \ internal Application Load Balancer\n  - Global external proxy Network Load\
        \ Balancer (TCP/SSL)\n  - Classic proxy Network Load Balancer (TCP/SSL)\n\
        In addition, you can configure Cloud Armor preconfigured WAF rules, which\
        \ are complex web application firewall (WAF) rules with dozens of signatures\
        \ that are compiled from open source industry standards."
      retrieved_at: '2026-09-23T04:24:08.709818+00:00'
      content_hash: sha256:48173aa7ed4a03af3ce75f4bac4b8391dae729a2a93f77f4e820ce832075e2f4
      applicability:
        offering: public
        regions:
        - europe-west1
        services:
        - cloud-armor
        edition: standard
    - id: ev-ca-bot
      url: https://cloud.google.com/armor/docs/bot-management
      title: Cloud Armor bot management overview
      source_class: technical
      quote: "Cloud Armor's bot management includes the following integrated capabilities.\n\
        - Manual challenge (reCAPTCHA challenge page) \n  - You must configure a security\
        \ policy rule to redirect a request for reCAPTCHA assessment.\n  - You can\
        \ create your own reCAPTCHA WAF site key and associate it with your security\
        \ policy."
      retrieved_at: '2026-09-23T04:24:08.709818+00:00'
      content_hash: sha256:9a149e47276f3b18fe70d5c01642d2ffe6f6a2114c62a639ee879d03a6f2bfb3
      applicability:
        offering: public
        regions:
        - europe-west1
        services:
        - cloud-armor
        edition: standard
    claims:
    - id: cl-preconfigured-rules
      assertion: Google Cloud Armor provides preconfigured WAF rules based on OWASP
        ModSecurity Core Rule Sets (CRS) with automatic updates to mitigate CVEs.
      result: supported
      evidence_item_ids:
      - ev-ca-overview
      services:
      - cloud-armor
    - id: cl-custom-rules-language
      assertion: Cloud Armor features a custom rules language to construct complex
        conditions matching URL path, request method, request headers, IP ranges,
        and threat intelligence.
      result: supported
      evidence_item_ids:
      - ev-ca-overview
      - ev-ca-policy
      services:
      - cloud-armor
    - id: cl-bot-recaptcha
      assertion: Cloud Armor integrates with reCAPTCHA to offer manual CAPTCHA challenges,
        frictionless assessments, and 302 redirects for bot management.
      result: supported
      evidence_item_ids:
      - ev-ca-bot
      services:
      - cloud-armor
    - id: cl-lb-cdn-integration
      assertion: Cloud Armor security policies can be attached to Google Cloud global
        external Application Load Balancers, Cloud CDN backend services, and external
        proxy Network Load Balancers.
      result: supported
      evidence_item_ids:
      - ev-ca-overview
      - ev-ca-policy
      services:
      - cloud-armor
    criteria_results:
    - level: 0
      met: false
      reasoning: Google Cloud provides Cloud Armor, a comprehensive managed application-layer
        protection service, meaning WAF is available to tenants.
      claim_ids:
      - cl-preconfigured-rules
    - level: 1
      met: false
      reasoning: Tenants do not need to self-manage or deploy their own open-source
        reverse proxy WAFs as Google Cloud offers Cloud Armor as a native managed
        service.
      claim_ids:
      - cl-preconfigured-rules
    - level: 2
      met: true
      reasoning: While a managed WAF with predefined rules exists (meeting Level 2),
        Cloud Armor exceeds these limitations by providing advanced custom rule authoring,
        full bot management, and integration across several load balancer types.
      claim_ids:
      - cl-preconfigured-rules
      - cl-custom-rules-language
      - cl-bot-recaptcha
      - cl-lb-cdn-integration
    - level: 3
      met: true
      reasoning: 'Cloud Armor meets all Level 3 criteria: it provides extensive managed
        rules with automatic updates, a custom rules language with complex match conditions,
        integrated bot management (reCAPTCHA and CAPTCHA), and broad CDN/load balancer
        integration.'
      claim_ids:
      - cl-preconfigured-rules
      - cl-custom-rules-language
      - cl-bot-recaptcha
      - cl-lb-cdn-integration
