  enc.cmk:
    status: assessed
    score: 3
    evidence: 'Google Cloud Platform provides extensive Customer-Managed Encryption
      Keys (CMEK) integration via Cloud KMS across all of its major services in scope.
      It meets the L3 maturity level because: 1) CMEK is natively supported by all
      major data-storing services (Compute Engine, GKE, Cloud Storage, Cloud SQL,
      BigQuery, and Secret Manager); 2) Key policies (IAM bindings) allow fine-grained
      controls specifying exactly which service agents or users can encrypt/decrypt;
      3) All cryptographic operations (encryption/decryption calls) are logged through
      Cloud Audit Logs (Data Access logs); and 4) Tenants can disable a key or key
      version at any time, instantly revoking data access and blocking the provider
      from decrypting customer data.'
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/kms/docs/cmek
