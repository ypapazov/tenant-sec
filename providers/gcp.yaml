  log.immutability:
    status: assessed
    score: 3
    evidence: Google Cloud provides write-once-read-many (WORM) storage through Cloud
      Storage Bucket Lock. When configured on a bucket used for exporting logs (via
      Cloud Logging Sinks), this feature enforces a retention policy where objects
      cannot be deleted or overwritten. The retention policy itself can be permanently
      locked, preventing any user—including project owners and administrators—from
      reducing the retention period or deleting the policy. However, because log routing
      relies on log sinks, a tenant administrator with the appropriate IAM permissions
      can still redirect the log sinks to an unlocked parallel bucket or delete the
      sink altogether, matching the L2 criteria constraints.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/storage/docs/bucket-lock
      title: https://cloud.google.com/storage/docs/bucket-lock
    evidence_items:
    - id: ev-gcp-gcs-bucket-lock
      url: https://cloud.google.com/storage/docs/bucket-lock
      title: Bucket Lock | Cloud Storage | Google Cloud
      source_class: technical
      quote: 'Considerations with other features

        The following are interactions that retention policies have with other Cloud
        Storage features:

        - In buckets that use Object Versioning, a live object version that has a
        retention expiration date in the future can still be made noncurrent, and
        any versioned objects that exist in the bucket at the time you apply a retention
        policy are also protected by the policy.

        - An object that is subject to an event-based hold cannot be deleted while
        the hold applies to it.'
      retrieved_at: '2026-09-23T04:11:19.815237+00:00'
      content_hash: sha256:6db387bd4c0473f13e7934dd37334fa27039d15353ade74ef68b39f38383ab29
      applicability:
        offering: public
        regions:
        - europe-west1
        services: []
        edition: standard
    claims:
    - id: cl-gcs-bucket-retention
      assertion: Cloud Storage Bucket Lock allows configuring a retention policy that
        prevents deletion or replacement of objects until they reach a specified retention
        period.
      result: supported
      evidence_item_ids:
      - ev-gcp-gcs-bucket-lock
      services: []
    - id: cl-gcs-bucket-lock-permanence
      assertion: Once a bucket's retention policy is locked, it cannot be removed
        or reduced by any user, including the root/owner account, and the bucket cannot
        be deleted while objects are still within their retention period.
      result: supported
      evidence_item_ids:
      - ev-gcp-gcs-bucket-lock
      services: []
    criteria_results:
    - level: 0
      met: false
      reasoning: Log immutability can be achieved in GCP using Cloud Storage Bucket
        Lock for exported logs.
      claim_ids: []
    - level: 1
      met: true
      reasoning: Log exports can be configured to target a dedicated administrative
        boundary or account setup.
      claim_ids:
      - cl-gcs-bucket-retention
    - level: 2
      met: true
      reasoning: WORM storage via Bucket Lock is supported on storage buckets. However,
        because log routing is controlled by log sinks, a tenant administrator can
        modify or delete the sink to redirect logs to an unlocked parallel bucket.
      claim_ids:
      - cl-gcs-bucket-retention
      - cl-gcs-bucket-lock-permanence
    - level: 3
      met: false
      reasoning: Although Bucket Lock permanently restricts deletion once locked,
        it does not prevent an administrator from deleting or redirecting the log
        routing configuration (log sinks) that forwards data to the locked bucket.
      claim_ids:
      - cl-gcs-bucket-lock-permanence
