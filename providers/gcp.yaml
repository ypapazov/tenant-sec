      url: https://cloud.google.com/kms/docs/cmek
      title: Customer-managed encryption keys (CMEK) | Cloud KMS Overview
      source_class: technical
      quote: 'When to use customer-managed encryption keys

        You can use manually-created CMEKs or keys created by Autokey in compatible
        services to help you meet the following goals:

        - Own your encryption keys.

        - Control and manage your encryption keys, including choice of location, protection
        level, creation, access control, rotation, use, and destruction.

        - Generate key material in Cloud KMS or import key material that is maintained
        outside of Google Cloud.

        - Set policy regarding where your keys must be used.

        - Selectively delete data protected by your keys in the case of off-boarding
        or to remediate security events (crypto-shredding).

        - Create and use keys that are unique to a customer, establishing a cryptographic
        boundary around your data.

        - Log administrative and data access to encryption keys.

        - Meet current or future regulation that requires any of these goals.'
      retrieved_at: '2026-09-23T02:39:33.234647+00:00'
