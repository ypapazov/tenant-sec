---
provider: gcp
display_name: "Google Cloud Platform"
assessed_by: "community:tenant-sec-maintainers"
assessed_at: "2026-02-01"
methodology_version: "1.0"
revision: 1

services_in_scope:
  - { id: "compute-engine", name: "Compute Engine (VMs)", category: "compute.vm" }
  - { id: "gke", name: "Google Kubernetes Engine", category: "compute.containers" }
  - { id: "cloud-functions", name: "Cloud Functions", category: "compute.serverless" }
  - { id: "cloud-run", name: "Cloud Run", category: "compute.serverless" }
  - { id: "cloud-storage", name: "Cloud Storage", category: "storage.object" }
  - { id: "persistent-disk", name: "Persistent Disk", category: "storage.block" }
  - { id: "cloud-sql", name: "Cloud SQL", category: "database.relational" }
  - { id: "firestore", name: "Firestore", category: "database.nosql" }
  - { id: "bigquery", name: "BigQuery", category: "database.warehouse" }
  - { id: "vpc", name: "VPC", category: "network.vpc" }
  - { id: "cloud-load-balancing", name: "Cloud Load Balancing", category: "network.loadbalancer" }
  - { id: "cloud-dns", name: "Cloud DNS", category: "network.dns" }
  - { id: "cloud-kms", name: "Cloud KMS", category: "security.kms" }
  - { id: "secret-manager", name: "Secret Manager", category: "security.secrets" }
  - { id: "cloud-armor", name: "Cloud Armor (WAF/DDoS)", category: "security.waf" }
  - { id: "iam", name: "Cloud IAM", category: "identity.iam" }

controls:

  iam.external-idp-federation:
    score: 3
    evidence: >
      GCP Cloud Identity and Workforce Identity Federation support SAML 2.0
      and OIDC for enterprise IdP federation. Multiple IdPs supported.
      Federation covers console, gcloud CLI, and API access. Workload Identity
      Federation for programmatic access from external identity providers.
      Attribute mapping via CEL expressions for flexible role binding.
    verified_at: "2026-01-30"

  iam.directory-integration:
    score: 3
    evidence: >
      Cloud Identity supports SAML and OIDC federation plus SCIM 2.0 for
      user and group provisioning from Azure AD, Okta, and other IdPs.
      Auto-deprovisioning on source directory deletion. Google Workspace
      Directory Sync for Active Directory integration. Multiple directory
      sources supported.
    verified_at: "2026-01-30"

  iam.privileged-access:
    score: 3
    evidence: >
      Privileged Access Manager (PAM) in Resource Manager provides JIT
      access elevation with configurable approval workflows, time-bound grants,
      and full audit trail. PAM integrates with Cloud Audit Logs. Eligible
      role grants with activation workflow. Break-glass emergency access
      documented. Available at org, folder, and project levels.
    verified_at: "2026-01-30"

  iam.service-identity:
    score: 3
    evidence: >
      Workload Identity Federation for GKE (IRSA-equivalent), Cloud Run,
      Cloud Functions. Short-lived tokens via Metadata Server. OIDC-based
      cross-cloud federation accepts tokens from GitHub, AWS, Azure, and
      external IdPs. Service account impersonation chaining. No static keys
      required for GCP-hosted workloads.
    verified_at: "2026-01-30"

  iam.abac:
    score: 3
    evidence: >
      IAM Conditions support attribute-based access using resource tags,
      request context (time, IP, target resource), and custom CEL expressions.
      Tag-based policies (resource manager tags with IAM bindings). Available
      across all major GCP services. Principal access boundary policies
      provide ABAC for principals. Session-based conditions via Access Context Manager.
    verified_at: "2026-01-30"

  iam.permission-boundaries:
    score: 3
    evidence: >
      Principal Access Boundary (PAB) policies cap the maximum permissions
      of a principal regardless of IAM role assignments. Enforced at request
      time. Supported for all principal types. Enables safe IAM delegation
      without privilege escalation risk. Complements existing IAM Conditions.
    verified_at: "2026-01-30"

  iam.credential-management:
    score: 3
    evidence: >
      Service Account Key management with IAM Recommender for unused credential
      detection. Org policy to disable Service Account key creation (no static
      keys). Automatic SA key rotation via Workload Identity Federation.
      Cloud KMS for manual key rotation. Cloud Identity MFA enforcement.
      IAM Audit Logs for all credential operations.
    verified_at: "2026-01-30"

  iam.multi-tenancy-isolation:
    score: 3
    evidence: >
      GCP Resource Manager hierarchy: Organization → Folders → Projects.
      Deep folder hierarchy (up to 10 levels). Policy inheritance at each
      level. Each project is an independent blast radius boundary. Shared VPC
      for controlled cross-project networking. Org Policy constraints cascade
      from organization to all sub-nodes. Project provisioning via Project
      Factory automation.
    verified_at: "2026-01-30"

  gov.preventive-policy:
    score: 3
    evidence: >
      GCP Organization Policy Service provides synchronous deny-before-execution
      constraints at org, folder, and project levels. 100+ managed constraints
      (region restriction, CMK enforcement, public IP restriction). Custom
      organization policy constraints via CEL-based rules. Hierarchical inheritance
      with override options. Both boolean and list constraints. Enforced
      synchronously on API calls.
    verified_at: "2026-01-30"

  gov.detective-policy:
    score: 3
    evidence: >
      Security Command Center (Premium) provides continuous compliance monitoring
      with managed detectors for CIS Benchmarks, PCI DSS, NIST 800-53. Custom
      security findings via SCC Findings API. Real-time evaluation on resource
      changes. Org-wide aggregated view. Automated remediation via Cloud Functions
      triggered by SCC findings. Security Health Analytics for misconfigurations.
    verified_at: "2026-01-30"

  gov.tagging-governance:
    score: 3
    evidence: >
      Resource Manager Tags provide enforced labeling with IAM-based
      tag value management. Tags can be set as mandatory via Org Policy
      constraints (require-tag constraints on resource creation). Tag bindings
      with IAM conditions for access control. Tag inheritance via resource
      hierarchy. Tag reports and compliance views in Resource Manager.
    verified_at: "2026-01-30"

  gov.hierarchy-delegation:
    score: 3
    evidence: >
      Deep folder hierarchy supports complex organizational structures.
      Policy inheritance at every level. Delegated administration via
      folder-level IAM roles (Folder Admin can manage sub-tree without
      org-level access). Organization-level delegated admins for specific
      services (Security Command Center, Billing). Folder-level Org Policy override.
    verified_at: "2026-01-30"

  gov.account-lifecycle:
    score: 3
    evidence: >
      Project Factory (via Google Cloud Landing Zone) automates project
      provisioning with baseline constraints and configurations. Org Policy
      constraints applied automatically to new projects. Config Connector
      for K8s-based project management. Project offboarding via Project
      deletion API with 30-day recovery window. Lien mechanism prevents
      accidental project deletion.
    verified_at: "2026-01-30"

  gov.quotas-service-control:
    score: 3
    evidence: >
      Organization Policy Service allows service restriction (disable specific
      APIs at org/folder/project level). Region restriction via Org Policy
      resource location constraints. Resource type constraints via allowed
      resources Org Policies. All enforced synchronously via API interceptors.
      VPC Service Controls provide perimeter-level service restriction.
    verified_at: "2026-01-30"

  enc.encryption-at-rest-default:
    score: mixed
    summary: "Default encryption universal across GCP services"
    services:
      cloud-storage:
        score: 3
        evidence: >
          All GCS objects encrypted at rest by default with Google-managed
          AES-256 keys. Cannot be disabled. Applies to all storage classes.
      persistent-disk:
        score: 3
        evidence: >
          All Persistent Disk volumes encrypted at rest by default with
          Google-managed keys. Cannot be disabled. Applies to all disk types.
      cloud-sql:
        score: 3
        evidence: >
          All Cloud SQL instances encrypted at rest by default with Google-managed
          keys. Cannot be disabled. Applies to all database engines.
      bigquery:
        score: 3
        evidence: >
          All BigQuery data encrypted at rest by default. Cannot be disabled.
          Google-managed keys used by default.
      gke:
        score: 2
        evidence: >
          GKE etcd encrypted at rest by default with Google-managed keys.
          Application-layer secrets encryption (envelope encryption with CMEK)
          requires explicit configuration.
    verified_at: "2026-01-30"

  enc.cmk:
    score: mixed
    summary: "CMEK available across all major GCP services with full key policy control"
    services:
      cloud-storage:
        score: 3
        evidence: >
          CSEK (customer-supplied) and CMEK via Cloud KMS supported. Full
          key policy control. Usage logged in Cloud Audit Logs. Key access
          revocation effectively locks data. Per-bucket and per-object CMEK.
      cloud-sql:
        score: 3
        evidence: >
          CMEK supported for all Cloud SQL instances at instance creation.
          Supports per-region keys. Key usage logged.
      bigquery:
        score: 3
        evidence: >
          CMEK per dataset and per table. Cloud KMS integration. Key usage
          logging in Cloud Audit Logs. BigQuery CMEK covers data at rest
          and temporary query results.
      gke:
        score: 3
        evidence: >
          Application-layer secrets encryption (CMEK for etcd). Persistent
          volumes use Persistent Disk CMEK. Node disk CMEK configurable.
      cloud-run:
        score: 2
        evidence: >
          CMEK supported for container images in Artifact Registry.
          In-memory data and execution environment encryption uses
          Google-managed keys. No CMEK for execution environment.
    verified_at: "2026-01-30"

  enc.byok:
    score: 3
    evidence: >
      Cloud KMS supports import of externally generated AES-256, RSA, and
      EC key material. Import jobs with RSA wrapping key. Imported keys
      have same capabilities as Cloud KMS-generated keys. Cloud HSM
      can serve as external key generator for provenance. Key version
      re-import for rotation.
    verified_at: "2026-01-30"

  enc.external-key-management:
    score: 3
    evidence: >
      Cloud EKM (External Key Manager) allows Cloud KMS to wrap keys via
      an external key manager on every crypto operation. Key material never
      enters Google infrastructure. Partners include Thales, Fortanix,
      Mithril Security. Access to EKM-protected resources requires the
      external KMS to be available. Available for Cloud Storage, BigQuery,
      Compute Engine, and more.
    verified_at: "2026-01-30"

  enc.key-lifecycle:
    score: 3
    evidence: >
      Cloud KMS automatic key rotation with configurable rotation period.
      Key versions managed independently (old versions accessible for
      decryption). Scheduled key destruction with 24-hour delay and
      cancellation option. Key disablement for immediate effective revocation.
      CMEK metadata in Cloud Audit Logs. Autokey feature automates
      CMK provisioning.
    verified_at: "2026-01-30"

  enc.hsm-backing:
    score: 3
    evidence: >
      Cloud HSM (part of Cloud KMS) provides FIPS 140-2 Level 3 single-tenant
      HSM key storage in all major GCP regions. Standard Cloud KMS uses
      multi-tenant HSMs. Cloud HSM attestation statements available for
      every key. HSM key operations logged in Cloud Audit Logs.
    verified_at: "2026-01-30"

  enc.encryption-in-transit:
    score: 3
    evidence: >
      All GCP service endpoints enforce TLS 1.3 minimum. Application Default
      Credentials always use HTTPS. Mutual TLS supported via Traffic Director
      for inter-service communication. Certificate Authority Service for
      managed private CA. Cloud Load Balancing supports TLS cipher suite
      restriction. BeyondCorp Enterprise for mTLS at the application layer.
    verified_at: "2026-01-30"

  enc.confidential-computing:
    score: 3
    evidence: >
      Confidential VMs (AMD SEV) available for N2D, C2D, C3D instance types.
      Confidential GKE Nodes for container workloads. Confidential Space for
      multi-party data sharing with attestation. Attestation via Confidential
      Computing API. Available in all major GCP regions. Attestation verifiable
      via open-source tooling.
    verified_at: "2026-01-30"

  net.isolation-model:
    score: 3
    evidence: >
      GCP VPC is a global resource with regional subnets. Deny-all default
      for all inbound traffic. Flexible subnet architecture. Hierarchical
      firewall policies from org → folder → VPC → subnet → VM. VPC Flow Logs
      for all subnets. Private Google Access for accessing Google APIs
      without public IPs.
    verified_at: "2026-01-30"

  net.cross-environment-connectivity:
    score: 3
    evidence: >
      VPC Peering (non-transitive) and Shared VPC for cross-project networking.
      Cloud Interconnect and Cloud VPN for on-premises. Network Connectivity
      Center (NCC) for hub-spoke architecture with transitive routing.
      Partner Interconnect. Cross-project firewall policies via hierarchical
      firewalls.
    verified_at: "2026-01-30"

  net.firewall:
    score: 3
    evidence: >
      Hierarchical Firewall Policies at org and folder level (enforced before
      VPC-level rules). VPC Firewall Rules for fine-grained control. Cloud
      NGFW (Network Firewall) for Layer 7 inspection, FQDN-based rules,
      IDS/IPS (Threat Intelligence feeds). Secure Web Proxy for explicit
      egress proxy with URL filtering. Org policy enforcement of minimum
      firewall rules via SCC.
    verified_at: "2026-01-30"

  net.private-connectivity:
    score: 3
    evidence: >
      Private Service Connect (PSC) for accessing Google APIs and third-party
      services without public IPs. Private Service Access (PSA) for managed
      services (Cloud SQL, Filestore). VPC Service Controls as a perimeter
      around services. Private Google Access. Available for all major GCP
      services. DNS automatically resolves to private endpoints.
    verified_at: "2026-01-30"

  net.dns-security:
    score: 3
    evidence: >
      Cloud DNS private zones integrated with VPC. DNS policy for custom
      resolver servers. DNS Security (DNSSEC) for public zones. Cloud DNS
      logging for all queries. Response Policy Zones (RPZ) for DNS filtering.
      DNS forwarding across VPCs and on-premises. Centralized DNS policy
      shareable via Shared VPC.
    verified_at: "2026-01-30"

  net.ddos-protection:
    score: 3
    evidence: >
      Cloud Armor provides L3/L4 DDoS protection (Standard) and L7 protection
      (Managed Protection Plus). Adaptive protection uses ML to detect attacks.
      Preconfigured WAF rules. Rate limiting. Geo-based rules. Custom
      mitigation policies. Real-time attack telemetry. Guaranteed DDoS
      mitigation capacity via Cloud Armor Managed Protection.
    verified_at: "2026-01-30"

  net.waf:
    score: 3
    evidence: >
      Cloud Armor WAF with preconfigured rules (OWASP Top 10), custom rules
      (CEL expressions), Bot Management (reCAPTCHA Enterprise), fraud
      prevention. Integrated with Cloud Load Balancing, Cloud CDN,
      Google-managed SSL certificates. Request logging. Available at edge.
      Advanced threat intelligence feeds.
    verified_at: "2026-01-30"

  net.egress-control:
    score: 3
    evidence: >
      Cloud NGFW for stateful L7 egress inspection including TLS inspection.
      VPC Service Controls as perimeter control for API-level exfiltration.
      Secure Web Proxy for explicit egress HTTP/HTTPS with URL filtering.
      Hierarchical Firewall Policies for org-wide egress enforcement.
      VPC Flow Logs for all egress traffic visibility.
    verified_at: "2026-01-30"

  log.control-plane-audit:
    score: 3
    evidence: >
      Cloud Audit Logs (Admin Activity) enabled by default for all GCP services.
      Cannot be disabled. Retained 400 days in Cloud Logging. Organization-wide
      aggregation via log sinks. Log bucket locking for tamper-proof retention.
      Access Transparency logs for Google personnel access. Log analytics via
      BigQuery log sink.
    verified_at: "2026-01-30"

  log.data-plane-logging:
    score: 3
    evidence: >
      Cloud Audit Logs Data Access available for all major GCP services.
      Configurable log types (DATA_READ, DATA_WRITE, ADMIN_READ). Org-level
      default audit log configuration. BigQuery Data Access logs capture
      all query operations. Cloud Storage Data Access logs for object reads.
    verified_at: "2026-01-30"

  log.immutability:
    score: 3
    evidence: >
      Cloud Logging bucket lock provides Write-Once-Read-Many (WORM)
      immutability. Locked buckets cannot be modified or deleted even
      by org admins during the lock period. Lock settings are per-bucket
      with configurable retention period. Attempts to unlock generate
      audit events. Integration with Assured Workloads for compliance.
    verified_at: "2026-01-30"

  log.export-integration:
    score: 3
    evidence: >
      Cloud Logging supports log sinks to BigQuery, Cloud Storage, Pub/Sub
      (Kafka-compatible), and Splunk/Elastic via Partners. Real-time streaming
      via Pub/Sub. Log Router for org-wide routing rules. OCSF format
      support via Security Command Center export. Aggregated log sinks
      at org level.
    verified_at: "2026-01-30"

  log.alerting-detection:
    score: 3
    evidence: >
      Security Command Center Premium with Event Threat Detection (ML-based,
      200+ threat detectors), Container Threat Detection, Web Security Scanner,
      VM Threat Detection. Chronicle SIEM for advanced threat hunting.
      Custom detection via SCC Security Findings API. Org-wide findings
      aggregation. EventArc integration for automated response. Mandiant
      Threat Intelligence integration.
    verified_at: "2026-01-30"

  log.resource-inventory:
    score: 3
    evidence: >
      Cloud Asset Inventory provides continuous tracking of all GCP resources.
      Configuration history with unlimited retention. CAI Search API for
      cross-org queries. Export to BigQuery for custom analysis. Real-time
      feed for asset changes via Pub/Sub. Policy Analysis tool for IAM
      and Org Policy evaluation. Available org-wide.
    verified_at: "2026-01-30"

  data.residency-guarantees:
    score: 3
    evidence: >
      Data Residency commitments in GCP DPA. Assured Workloads for technically
      enforced data location restrictions (prevents resource creation outside
      approved regions). Regional resources do not replicate outside selected
      region without explicit multi-region bucket configuration. Data Sovereignty
      controls available via Assured Workloads for EU and other jurisdictions.
    verified_at: "2026-01-30"

  data.sovereignty-controls:
    score: 2
    evidence: >
      Google is a US company subject to CLOUD Act and FISA. EU Sovereign
      Cloud via Sovereign Partners (T-Systems, Capgemini) provides full
      sovereignty with Google-managed infrastructure operated by local
      entity. Standard commercial GCP has Assured Workloads for data
      residency but not full sovereignty. Access Transparency for Google
      personnel access. HYOK via Cloud EKM is available.
    verified_at: "2026-01-30"

  data.classification:
    score: 3
    evidence: >
      Cloud Data Loss Prevention (Cloud DLP) provides automated sensitive
      data discovery across Cloud Storage, BigQuery, Datastore/Firestore.
      130+ predefined info types (PII, financial, credentials). Custom
      info types via regex and dictionary. De-identification capabilities.
      Findings integrated with Security Command Center. Inspection via API.
    verified_at: "2026-01-30"

  data.dlp:
    score: 3
    evidence: >
      Cloud DLP provides content inspection and de-identification capabilities.
      VPC Service Controls act as a DLP boundary for API-level exfiltration
      prevention. Cloud Armor for web-layer DLP patterns. Org policy to
      restrict public bucket access. DLP inspection integrated into pipelines
      via Pub/Sub triggers. Centrally enforceable via Org Policy + SCC.
    verified_at: "2026-01-30"

  data.backup-governance:
    score: 3
    evidence: >
      Cloud Backup and DR provides centralized backup management for Compute
      Engine, Cloud SQL, and VMware. Backup Vault with immutable backups.
      Cross-region backup replication. Org-level backup policies. CMK
      encryption for backups. PITR for Cloud SQL and Spanner. Backup
      plan enforcement via SCC.
    verified_at: "2026-01-30"

  data.deletion-guarantees:
    score: 3
    evidence: >
      Google publishes data deletion procedures in their data deletion FAQ
      and DPA. 180-day deletion timeline after contract termination
      (documented). CMEK key deletion provides crypto-shredding. Physical
      media destruction per NIST SP 800-88 with certificates available.
      Google's Transparency Report covers data handling. Cloud Storage
      object deletion is immediate for non-versioned objects.
    verified_at: "2026-01-30"

  compute.image-management:
    score: 3
    evidence: >
      Artifact Registry for container images with integrated Artifact Analysis
      (vulnerability scanning). Binary Authorization for signed image enforcement
      (policy can prevent deployment of unsigned or vulnerable images). Container
      Analysis for SBOM generation. Custom Image Policies via OPA Gatekeeper.
      VM Images via Compute Engine Image Gallery with shared images across projects.
    verified_at: "2026-01-30"

  compute.runtime-security:
    score: 3
    evidence: >
      Shielded VMs (Secure Boot, vTPM, integrity monitoring) available for
      most VM types. Confidential VMs for AMD SEV. VM Threat Detection
      (in-memory malware detection without agent). Chronicle integration
      for threat hunting. Container Threat Detection for GKE. OS patch
      management via OS Config. Crowdstrike/Wiz marketplace integrations.
    verified_at: "2026-01-30"

  compute.container-orchestration:
    score: 3
    evidence: >
      GKE Autopilot enforces pod security, workload identity, and Binary
      Authorization by default. GKE Standard with hardened node pools
      (COS image, Secure Boot). Binary Authorization for signed images.
      Config Connector for policy-as-code. Network Policy (Calico/Dataplane V2).
      Workload Identity for no-static-key pod auth. GKE CIS Benchmark profile.
      Container Threat Detection for runtime.
    verified_at: "2026-01-30"

  compute.serverless-security:
    score: 3
    evidence: >
      Cloud Run with per-service IAM (invoker, admin roles). VPC connector
      for Private Network access. Cloud Functions v2 with per-function
      service accounts. Serverless VPC Access. Binary Authorization for
      Cloud Run images. Per-function concurrency and timeout limits.
      Audit logs for all invocations. Secret Manager integration
      (secrets injected as env variables or volume mounts).
    verified_at: "2026-01-30"

  compute.patch-management:
    score: 3
    evidence: >
      OS Config Patch Management for VM fleet with compliance dashboard.
      GKE auto-upgrades for control plane and node pools. Cloud SQL
      automatic minor version maintenance. SCC vulnerability findings
      from OS patch data. VM Manager for inventory and OS policy enforcement.
      Confidential VM node pools auto-patched by Google.
    verified_at: "2026-01-30"

  compute.secrets-management:
    score: 3
    evidence: >
      Secret Manager with versioning, automatic rotation (via Cloud Functions),
      audit logging of every access, cross-project sharing with IAM controls.
      CSI driver for GKE (secrets mounted as volumes, not env variables).
      Cloud Run environment variable injection from Secret Manager at runtime.
      Regional secrets for data residency. Fine-grained IAM per secret version.
    verified_at: "2026-01-30"

  incident.forensic-access:
    score: 3
    evidence: >
      Compute Engine disk snapshots while running. Cross-project snapshot
      isolation for forensics. VPC Packet Mirroring for L2-L7 capture
      to IDS appliance. Chronicle for log investigation. Automated instance
      isolation via Org Policy or custom Cloud Function triggered by SCC.
      Secure shell access via IAP (Identity-Aware Proxy) with MFA requirement.
    verified_at: "2026-01-30"

  incident.notification-sla:
    score: 3
    evidence: >
      Google publishes security bulletins for GCP vulnerabilities requiring
      customer action. GDPR breach notification within 72 hours per DPA.
      Access Transparency provides logs of Google personnel access with
      justification. Google Trust and Safety direct communication for
      affected customers. Historical track record of timely disclosure.
      Security advisories on cloud.google.com/support/bulletins.
    verified_at: "2026-01-30"

  incident.automated-response:
    score: 3
    evidence: >
      Security Command Center Findings → Pub/Sub → Cloud Functions for
      automated response. Pre-built response playbooks in SCC documentation.
      Event Threat Detection automatic muting for known-good patterns.
      Chronicle SOAR (Siemplify) for orchestrated response workflows.
      Org-level EventArc routing for security events. Cloud Functions
      automated remediation library (publicly available).
    verified_at: "2026-01-30"

  incident.availability-zones:
    score: 3
    evidence: >
      All major GCP regions have 3+ zones with physically independent
      infrastructure. Zone independence guaranteed in SLA. Multi-zone
      is default recommendation for all managed services (Cloud SQL,
      GKE, Spanner globally distributed). Global load balancing via
      anycast. Cross-region active-active via Cloud Spanner (globally).
      99.99% regional SLA for many services.
    verified_at: "2026-01-30"

  incident.resilience-testing:
    score: 2
    evidence: >
      GCP does not have a native Fault Injection Service equivalent to
      AWS FIS. Chaos engineering is achievable through third-party tools
      (LitmusChaos, Chaos Toolkit GCP plugin) or manual procedures. Google
      publishes DiRT (Disaster Recovery Testing) methodology documentation
      and patterns. No managed fault injection API from GCP.
    compensating_controls: >
      LitmusChaos with GCP integration provides fault injection for GKE.
      Google SRE practices and runbooks available.
    verified_at: "2026-01-30"

  supply-chain.infrastructure-encryption:
    score: 3
    evidence: >
      Google attests to AES-256 encryption of all data at rest at the
      infrastructure layer across all storage media. Included in SOC 2 Type II,
      ISO 27001, and ISO 27018 scope. Google publishes detailed encryption
      at rest whitepaper. Per-region attestation in compliance documentation
      available on cloud.google.com/security/compliance.
    verified_at: "2026-01-30"

  supply-chain.physical-security:
    score: 3
    evidence: >
      Google datacenters certified under SOC 2 Type II, ISO 27001, ISO 27017.
      Google publishes a detailed datacenter security overview including
      multi-layer physical security, custom security cameras, biometric
      access, and environmental monitoring. Third-party security certifications
      at all production sites. Reports via Compliance Reports Manager.
    verified_at: "2026-01-30"

  supply-chain.hardware-supply-chain:
    score: 3
    evidence: >
      Google Titan security chip provides hardware root of trust on all
      Google-designed servers and networking equipment. Measured boot from
      Titan. Supply chain integrity: servers designed in-house, manufactured
      by vetted suppliers. Google publishes Titan technical paper with
      attestation details. Titan for both servers and networking equipment.
    verified_at: "2026-01-30"

  supply-chain.personnel-security:
    score: 3
    evidence: >
      Google employees with production access subject to background checks
      (SOC 2 scope). Access Transparency provides tenant-visible logs of
      Google personnel access (with justification). No standing access:
      Google uses just-in-time access grants with approval. Access Approval
      API allows tenants to approve/deny Google personnel access requests.
    verified_at: "2026-01-30"

  supply-chain.compliance-certifications:
    score: 3
    evidence: >
