controls:
  compute.container-orchestration:
    status: assessed
    score: 2
    evidence: Google Kubernetes Engine (GKE) provides a managed Kubernetes service
      with improved security defaults, which aligns with Level 2. Google manages and
      patches the GKE control plane (including etcd). RBAC is enabled by default,
      legacy ABAC is disabled, and audit logging is integrated with Cloud Logging.
      In GKE Standard clusters, Pod security standards are available but not enforced
      by default, and network policies must be explicitly created. GKE Autopilot improves
      on this by enforcing baseline Pod security standards by default, but still requires
      manual creation of network policies and does not enable runtime threat detection
      or binary authorization out of the box.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-security
      title: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-security
    - url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/security-overview
      title: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/security-overview
    evidence_items:
    - id: ev-gke-autopilot-security
      url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-security
      title: GKE Autopilot security measures
      source_class: technical
      quote: In Autopilot mode, GKE enforces Pod security constraints by using Kubernetes
        admission controllers. The default Autopilot Pod admission policy includes
        all of the recommendations in the Baseline level of the Pod Security Standards,
        with some modifications for usability.
      retrieved_at: '2026-09-23T02:08:53.105315+00:00'
      content_hash: sha256:81ae634cfbf25f4cfb3651a5b9a2d4d09ed069ede2e62387198a7e19bbe639d3
      applicability:
        offering: public
        regions:
        - europe-west1
        services: []
        edition: standard
    - id: ev-gke-security-overview
      url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/security-overview
      title: GKE security overview
      source_class: technical
      quote: 'Control plane security

        In GKE, the Kubernetes control plane components are managed and maintained
        by Google.'
      retrieved_at: '2026-09-23T02:08:53.105315+00:00'
      content_hash: sha256:3a4b3a34309b076198a82f05e903aecfc9937481fc85493b45657ace529b5e00
