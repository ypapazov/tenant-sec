  enc.encryption-in-transit:
    status: assessed
    score: 2
    evidence: Google Cloud Platform (GCP) provides robust default encryption in transit
      and options for tenant-configured TLS enforcement. GCP default public endpoints
      (for services like Cloud Storage and Cloud Run) are encrypted using TLS managed
      by the Google Front End (GFE). For custom user applications, Cloud Load Balancing
      (CLB) supports SSL Policies where tenants can define the minimum TLS version
      (up to TLS 1.2) and select cipher suites. Cloud SQL supports enforcing SSL/TLS
      via the 'Require SSL' configuration. Mutual TLS (mTLS) is supported on Cloud
      Load Balancing and through Cloud Service Mesh for GKE and Compute Engine workloads.
      However, GCP does not achieve L3 because tenants cannot configure TLS 1.3 as
      a selectable minimum version in SSL policies, and native service endpoints (such
      as GCS buckets and Cloud Run direct URLs) do not allow custom TLS version/cipher
      configurations directly without an intermediate load balancer.
    verified_at: '2026-09-23'
    confidence: high
    references:
