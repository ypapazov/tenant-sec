  gov.hierarchy-delegation:
    status: assessed
    score: 3
    evidence: Google Cloud provides a native, highly structured resource hierarchy
      with the Organization resource as the root node, optional nested Folders, and
      Projects as the leaf nodes containing resources. Up to 10 levels of folders
      can be nested to model complex organizational structures. Identity and Access
      Management (IAM) and Org Policies are inherited down the hierarchy tree, from
      Organization to Folders to Projects. Administration can be fully delegated by
      assigning roles at specific folder levels, isolating permissions to that branch.
      Additionally, folders can be created programmatically using the gcloud CLI or
      Cloud Resource Manager API.
