  enc.key-lifecycle:
    status: assessed
    score: 3
    evidence: Google Cloud KMS provides comprehensive key lifecycle management that
      meets all L3 criteria. It supports automatic key rotation on configurable schedules,
      which creates new key versions while keeping older versions active to decrypt
      existing data. Key destruction is not immediate; instead, key versions are placed
      in a scheduled for destruction state for a configurable grace period (default
      30 days) during which destruction can be cancelled. Once destroyed, key material
      is permanently deleted, cryptographically shredding the associated data. Furthermore,
      organizations can enforce minimum destroy schedule durations using policies.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://cloud.google.com/kms/docs/key-rotation
      title: https://cloud.google.com/kms/docs/key-rotation
    - url: https://cloud.google.com/kms/docs/destroy-restore
