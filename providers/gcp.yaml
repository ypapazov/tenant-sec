  data.deletion-guarantees:
    status: assessed
    score: 2
    evidence: Google Cloud publishes a detailed data deletion policy with defined
      stages (deletion request, up to 30 days soft-delete/recovery, logical deletion
      from active systems, and expiration from backups). While logical deletion uses
      cryptographic erasure (crypto-shredding) where available, the overall timeline
      for complete data purging from active and backup storage can take up to 180
      days (per the Cloud Data Processing Addendum). Since this timeline is long and
      exceeds the 30-day requirement for L3, but is publicly documented and provides
      robust tenant-controllable crypto-shredding via Cloud KMS key destruction, Google
      Cloud meets the L2 criteria.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://docs.cloud.google.com/docs/security/deletion
      title: https://docs.cloud.google.com/docs/security/deletion
    - url: https://docs.cloud.google.com/kms/docs/destroy-restore
      title: https://docs.cloud.google.com/kms/docs/destroy-restore
    evidence_items:
    - id: ev-gcp-deletion-pipeline
      url: https://docs.cloud.google.com/docs/security/deletion
      title: Data deletion on Google Cloud | Security
      source_class: technical
      quote: One advantage of using cryptographic erasure, whether it involves Google-supplied
        or customer-supplied encryption keys, is that logical deletion can be completed
        even before all deleted blocks of that data are overwritten in Google Cloud's
        active and backup storage systems.
      retrieved_at: '2026-09-23T02:20:17.679860+00:00'
      content_hash: sha256:6f89aa607cb968d9f0b86227a033ccbf2fc7664311634abd4668d6b95f637cee
