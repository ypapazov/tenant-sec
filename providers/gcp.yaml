    criteria_results:
    - level: 0
      met: false
      reasoning: Google Cloud offers GKE (Google Kubernetes Engine) as a managed Kubernetes
        service, meaning container orchestration is not entirely tenant-managed.
      claim_ids:
      - cl-managed-control-plane
    - level: 1
      met: false
      reasoning: GKE's default security posture is not entirely permissive. It enables
        RBAC, disables legacy ABAC, encrypts etcd at rest, and provides managed patching,
        and GKE Autopilot enforces pod security standards by default.
      claim_ids:
      - cl-managed-control-plane
      - cl-rbac-by-default
      - cl-pod-security-standard
    - level: 2
      met: true
      reasoning: GKE satisfies Level 2. RBAC is enabled, the control plane is managed
        and patched by Google, etcd is encrypted at rest, audit logging is available,
        and in Standard clusters, pod security is available but not enforced by default
        while network policies must be explicitly created.
      claim_ids:
      - cl-managed-control-plane
      - cl-rbac-by-default
      - cl-pod-security-standard
      - cl-network-policies
    - level: 3
      met: false
      reasoning: GKE does not fully meet Level 3 because network policies are not
        pre-enabled with rules in the default namespace by default, and other features
        like Binary Authorization and runtime threat detection require manual enablement
        and configuration.
      claim_ids:
