  data.residency-guarantees:
    status: assessed
    score: 2
    evidence: Hetzner Cloud contractually commits to geographic data residency based
      on the customer-selected product location. If an EU location (Falkenstein, Nuremberg,
      or Helsinki) is chosen, both the customer master data and the data stored on
      the cloud server are stored and processed entirely within the EU. However, Hetzner
      lacks tenant-operable technical policy controls (such as organizational policies
