  compute.serverless-security:
    status: not_applicable
    evidence: Hetzner Cloud does not offer a Serverless / Function-as-a-Service (FaaS)
      product. Its compute offerings are limited to virtual servers (Cloud Servers).
      Consequently, controls related to serverless function-level IAM, execution isolation,
      and serverless concurrency limits are not applicable to this provider's catalog.
    confidence: high
    verified_at: '2026-09-29'
    references:
    - url: https://docs.hetzner.com/cloud/
      title: https://docs.hetzner.com/cloud/
  data.backup-governance:
    status: assessed
    score: 0
    evidence: Hetzner Cloud lacks a managed backup policy engine or org-level backup
      governance. For Compute VM instances, automatic backups are restricted to a
      system-selected daily window with a rigid 7-slot retention policy that cannot
      be customized. Backups are bound to the parent server and are destroyed when
      the server is deleted, preventing isolation from the production lifecycle. Block
      volumes are excluded from standard server backups, and there are no native backup
      policies for volumes or object storage.
    verified_at: '2026-09-29'
    confidence: high
    references:
    - url: https://docs.hetzner.com/cloud/servers/backups-snapshots/faq
      title: https://docs.hetzner.com/cloud/servers/backups-snapshots/faq
