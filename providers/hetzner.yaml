controls:
  compute.container-orchestration:
    status: assessed
    score: 0
    evidence: Hetzner Cloud does not provide a managed Kubernetes or container orchestration
      service. Official documentation recommends using bare metal or self-managed
      servers for container orchestration environments (such as Kubernetes or Docker
      Swarm), meaning all security configurations (including RBAC, pod security, etcd
      encryption, and network policies) are entirely the tenant's responsibility with
      no managed platform support.
    verified_at: '2026-09-29'
    confidence: high
    references:
    - url: https://docs.hetzner.com/managed/managed-server/managed-vs-bare-metal-server
      title: https://docs.hetzner.com/managed/managed-server/managed-vs-bare-metal-server
