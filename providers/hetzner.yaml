  compute.secure-remote-access:
    status: assessed
    score: 1
    evidence: Hetzner Cloud does not offer a managed session manager service for interactive
      compute access. Accessing servers without public IPs requires deploying a tenant-managed
      bastion/jump server in the same private Network and using SSH configurations
      like ProxyJump (L1). A web-based VNC Console is provided via the Cloud Console,
      but it acts as a basic hypervisor console requiring traditional OS credentials
      (root password), and lacks audit command logs, keystroke recordings, or IAM-integrated
      access policies.
    verified_at: '2026-09-29'
    confidence: high
