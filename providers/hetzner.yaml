  net.isolation-model:
    status: assessed
    score: 1
    evidence: 'Hetzner Cloud offers a private Layer 3 network isolation model called
      ''Networks'' (VPC-equivalent). By default, Networks provide private, isolated
      communication channels between cloud servers attached to them, with no exposure
      to the public internet unless routed through a user-configured NAT gateway or
      server. However, this implementation has several L2-class limitations: networks
      are scoped regionally to specific network zones (e.g., eu-central, us-east),
      subnets within a network are not isolated from each other, there are no granular
      subnet-level routing tables, cross-account VPC peering is unsupported, and native
      Cloud Firewalls cannot yet filter private network traffic.


      Independent challenge: Hetzner Cloud supports tenant-isolated private layer
      3 networks (''Networks''), but the default posture of the platform is permissive,
      aligning with L1 criteria. Newly created Cloud Servers are assigned public IP
      interfaces that are fully open to the internet by default unless a Cloud Firewall
      is manually applied. Within the private networks, there is no default-deny configuration:
      all subnets can route to each other, and Cloud Firewalls cannot be used to restrict
      or filter traffic between servers on the private networks. Furthermore, Load
      Balancers do not yet support Cloud Firewalls.'
    verified_at: '2026-09-29'
    confidence: high
    references:
    - url: https://docs.hetzner.com/networking/networks/faq
      title: https://docs.hetzner.com/networking/networks/faq
