  compute.patch-management:
    status: assessed
    score: 0
    evidence: Hetzner Cloud does not provide any managed patch management or orchestration
      service for Cloud Servers (VMs); all operating system and application updates
      are the sole responsibility of the tenant. For its platform and managed services
      (Object Storage, Volumes, Networks, Load Balancers, DNS, Project Access), Hetzner
      applies security patches as part of its 'continuous maintenance and update cycle'
      but the schedule, compliance status, and windows are completely opaque to the
      tenant, with no scheduling control or notification interfaces provided.
    verified_at: '2026-09-29'
