  net.egress-control:
    status: assessed
    score: 1
    evidence: Hetzner Cloud provides egress filtering at the virtual machine level
      using stateful Firewalls applied to Cloud Servers. Users can define stateful
      outbound rules for TCP, UDP, ICMP, ESP, and GRE protocols. If any custom outbound
      rules are specified, the default outbound policy becomes an implicit deny, blocking
      all other egress traffic. However, filtering is strictly limited to destination
      IP prefixes (CIDRs) and port numbers; there is no managed support for DNS/domain-name
      filtering, URL lists, SSL/TLS decryption/inspection, or outbound connection
      logs. Furthermore, Hetzner does not offer a managed centralized NAT gateway
      or firewall service. To route egress traffic centrally, users must manually
      build and manage their own gateway using a Cloud Server instance.
