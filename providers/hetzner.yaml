  compute.image-management:
    status: assessed
    score: 1
    evidence: Hetzner Cloud does not offer any managed private container or VM image
      registry, scanning, or signing verification. VM image management is limited
      to basic server snapshots and backups, which are simple disk copies with no
      security analysis. Tenants must deploy self-managed registry solutions (such
      as Harbor or JFrog Artifactory) on Hetzner Cloud Servers if private image management
      is required. Thus, the only applicable compute service (Cloud Servers) is rated
      L1.
    verified_at: '2026-09-29'
    confidence: high
