    status: assessed
    score: 1
    evidence: Hetzner Cloud does not offer any native, managed Data Loss Prevention
      (DLP) services. However, because it provides standard infrastructure-as-a-service
      (IaaS), tenants can deploy their own processing loops (L1). Specifically, tenants
      can install host-based DLP agents on Cloud Servers or configure custom web proxies,
      firewalls, and IDS/IPS appliances within private Networks to inspect and block
      outbound traffic containing sensitive data. This approach requires significant
      manual setup, management of additional infrastructure, and does not natively
      prevent in-platform sharing such as configuring Hetzner Object Storage buckets
      to be publicly visible via the web.
