      title: 'Unit 7.1: Resilience and Business Continuity'
    evidence_items:
    - id: ev-resilience-not-product
      url: https://learn.cloud.ionos.com/expert/en/courses/module-7/unit-7.1-resilience-continuity.html
      title: 'Unit 7.1: Resilience and Business Continuity'
      source_class: technical
      quote: Resilience is not a product you buy on IONOS CLOUD; it is a property
        you compose. The platform gives you availability zones, a health-checking
        load-balancer tier, an anycast DNS service, point-in-time database recovery,
        and a backup service, but it does not sell a single "failover" button that
        orchestrates them.
