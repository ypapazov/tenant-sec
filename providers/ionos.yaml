      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm/overview/security-and-trust-model
      title: Security and Trust Model | Products
      source_class: technical
      quote: AMD SEV-SNP encrypts VM memory using keys that the AMD Secure Processor,
        a dedicated security microcontroller embedded in the CPU, generates and holds.
        These keys never leave the silicon. The hardware's design physically excludes
        the hypervisor, the host operating system, IONOS CLOUD administrators, and
        IONOS CLOUD itself from the decryption path. IONOS CLOUD has no keys, no backdoor,
        and no mechanism to access your VM's memory.
      retrieved_at: '2026-10-23T11:59:25.461350+00:00'
      content_hash: sha256:b11a88a63069750592dbe3a04cf6ec436c57e22fa922bc554ed99ce833741500
