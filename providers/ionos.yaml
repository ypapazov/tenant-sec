  iam.multi-tenancy-isolation:
    status: assessed
    score: 1
    evidence: IONOS Cloud operates under a single contract owner account model, but
      it allows tenants to create and manage multiple Virtual Data Centers (VDCs)
      within this contract. While VDCs provide a structured way for customers to logically
      group resources, apply IAM policies within each VDC, and implement network segmentation,
      the documentation does not indicate that these VDCs offer provider-enforced
      isolation boundaries between them, such as independent security principals,
      blast radius containment, or prevention of lateral movement. IAM focuses on
      access within a VDC. Cost data can be aggregated by VDC, but overall cost alerts
      and resource quotas remain at the contract level. Therefore, isolation between
      these logical sub-environments (VDCs) relies on tenant-implemented conventions
      rather than strong, provider-enforced boundaries, aligning with L1 criteria.
    verified_at: '2026-10-26'
