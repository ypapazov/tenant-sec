  net.egress-control:
    status: assessed
    score: 1
    evidence: IONOS Cloud provides Network Security Groups (NSGs) that enable customers
      to define egress rules based on IP addresses, port ranges, and protocols, thus
      preventing unrestricted outbound connections. Furthermore, IONOS Cloud offers
      a Managed NAT Gateway service that centralizes outbound internet-bound traffic
      from a Virtual Data Center (VDC). Flow Logs can be enabled for this Managed
      NAT Gateway, capturing detailed outbound connection information including source/destination
      IP/port, protocol, packet counts, and byte counts. However, the documentation
      does not indicate support for native DNS-based or network-layer URL/domain filtering,
      TLS inspection, or an organizational-level policy enforcement mechanism for
      egress traffic.
