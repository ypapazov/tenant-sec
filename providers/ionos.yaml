  gov.hierarchy-delegation:
    status: assessed
    score: 0
    evidence: The IONOS CLOUD offering provides Identity and Access Management (IAM)
      capabilities for managing users and groups, assigning privileges, and enabling
      Role-Based Access Control (RBAC) within a single customer account (contract).
      This allows for policy inheritance via groups and delegated administration for
      resources within Virtual Data Centers (VDCs) or other resources managed under
      that specific contract. However, the documentation consistently describes a
      flat account structure where each 'account' or 'contract ID' is an independent
      unit. There is no evidence of an organizational hierarchy that allows for grouping
      or nesting multiple distinct accounts (e.g., using management groups, folders,
      or OUs). Consequently, policy management is inherently per-account, and there
      is no mechanism for policy inheritance or delegated administration across a
      hierarchy of accounts or organizational units. This aligns directly with the
      L0 criteria, which describes a flat account structure with no organizational
      hierarchy for accounts, policies managed per-account, and no delegation model
      for sub-account administration.
