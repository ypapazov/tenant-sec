    criteria_results:
    - level: 0
      met: true
      reasoning: For services like Managed Kubernetes, Network File Storage, and PostgreSQL,
        no documented managed backup governance features exist. This implies that
        backup existence, retention, encryption, and replication must be configured
        per-resource manually, or are not available, meeting the L0 criteria. Similarly,
        backup deletion for these services would be subject to regular resource permissions.
      claim_ids:
      - cl-unknown-governance-nfs-k8s-postgres
    - level: 1
      met: true
      reasoning: For services lacking specific managed backup governance features
        (Managed Kubernetes, Network File Storage, PostgreSQL), the availability of
        APIs allows for tenant-implemented IaC, enabling backup schedules and retention
        policies. This means that backup governance is achievable through tenant-implemented
        IaC, fulfilling L1 criteria.
      claim_ids:
      - cl-unknown-governance-nfs-k8s-postgres
      - cl-api-enables-iac
    - level: 2
      met: true
      reasoning: Managed backup policy services exist for major services including
        vCPU servers (via Block Storage), Block Storage, Object Storage, and Managed
        MongoDB. These services offer configurable retention, frequency, and encryption
        options. However, for all services, full L3 criteria like provider-managed
        org-level policy enforcement that automatically applies to new resources,
        comprehensive backup isolation (preventing deletion by a compromised production
        account), or provider-provided automated recovery testing are not consistently
        and fully supported or explicitly detailed. Object Storage, while having strong
        features including SSE-C and replication, still lacks documented automated
        recovery testing and org-level auto-apply, thus scoring L2.
      claim_ids:
      - cl-storage-managed-backup-policies
      - cl-storage-lack-l3-features
      - cl-object-storage-managed-governance
      - cl-mongodb-managed-snapshots-retention
      - cl-mongodb-offsite-backup
      - cl-mongodb-lack-l3-features
      - cl-no-automated-recovery-testing
    - level: 3
      met: false
      reasoning: No service fully meets all L3 criteria. The primary blocker for all
        services is the lack of documented provider-provided automated recovery testing
        capabilities. Additionally, for vCPU servers, Block Storage, and Managed MongoDB,
        other L3 requirements such as org-level backup policies that automatically
        apply to new resources, comprehensive backup isolation (preventing deletion
        by a compromised production account), explicit tenant-controlled CMK for backup
        data, and cross-region replication configurable via policy are not consistently
        or explicitly supported.
      claim_ids:
      - cl-no-automated-recovery-testing
      - cl-storage-lack-l3-features
      - cl-mongodb-lack-l3-features
    licensing:
      status: unknown
      evidence: The documentation implies that backup capabilities for Block Storage
        and vCPU Servers are included, and for Managed MongoDB, they are part of the
        Business and Enterprise editions. However, explicit licensing terms (e.g.,
        'included', 'paid_add_on') for the general 'Backup Service' or specific features
        like SSE-C for Object Storage are not detailed in the provided documents.
      references:
      - url: https://docs.ionos.com/cloud/databases/mongodb/overview/features-benefits
        title: Features and Benefits | Managed MongoDB
      - url: https://docs.ionos.com/cloud/security-safeguards/best-practice-guideline/best-practice-cloud-storage-products
        title: Best Practices for IONOS CLOUD Storage Products
      - url: https://docs.ionos.com/cloud/backup-and-storage/ionos-object-storage/overview/features-benefits
        title: Features and Benefits
      - url: https://cloud.ionos.com/managed/dbaas/managed-mongodb
        title: Managed MongoDB
