    - id: ev-ionos-cvm-measurement-details
      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm/overview/security-and-trust-model
      title: Security and Trust Model | Products
      source_class: technical
      quote: 'What is a measurement and how is it computed?

        A measurement is the cryptographic identity of your Confidential VM''s software
        stack, a SHA-384 digest that the AMD Secure Processor computes during every
        VM start. It covers, in the following order:

        - OVMF firmware firmware-code.fd

        - Linux kernel vmlinuz

        - Initial ramdisk initrd.img

        - Kernel command-line parameters kernel-params.txt'
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
      content_hash: sha256:b11a88a63069750592dbe3a04cf6ec436c57e22fa922bc554ed99ce833741500
