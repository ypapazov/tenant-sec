      url: https://docs.ionos.com/cloud/release-notes/august-2026
      title: August 2026 | Products - Introducing Confidential VM and CrackArmor Vulnerability
        Advisory
      source_class: technical
      quote: Introducing Confidential VM August 12 IONOS CLOUD supports Confidential
        VM, a hardware-enforced security technology that encrypts virtual machine
        (VM) memory and CPU state at runtime using AMD SEV-SNP (Secure Encrypted Virtualization,
        Secure Nested Paging), ensuring that data in use remains protected from the
        cloud provider, hypervisor, and host administrators. Workloads run inside
        a Trusted Execution Environment (TEE), where sensitive data and code are cryptographically
        isolated within the AMD CPU and inaccessible to unauthorized users even at
        the infrastructure level. Organizations handling regulated data, including
        financial services, healthcare, and public sector workloads, can use IONOS
        CLOUD Confidential VMs to meet zero-trust security requirements and enforce
        data sovereignty. Confidential VMs can be attested using the IONOS CLOUD reference
        toolchain. For more information, see SNPGuard.
      retrieved_at: '2026-10-22T22:46:25.811939+00:00'
      content_hash: sha256:8987d5af1b957f9487f3117b8099d30041ed4c31743f83139d6194e4e23e40b2
