  enc.external-key-management:
    status: assessed
    score: 1
    evidence: IONOS Cloud Object Storage supports Server-Side Encryption with Customer-Provided
      Keys (SSE-C). With SSE-C, the customer provides the encryption key with each
      request, and IONOS Cloud does not store or manage this key. This means the key
      material never resides permanently within the provider's infrastructure and
      is managed externally by the tenant. This aligns with the L1 criterion for external
      key management through application-layer client-side encryption, where the provider
      has no visibility of the key material.
