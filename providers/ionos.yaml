    evidence_items:
    - id: ev-eu-data-act-guidance
      url: https://docs.ionos.com/cloud/data-export/eu-data-act
      title: Guidance for European Union (EU) Data Act
      source_class: technical
      quote: The Data Act of the European Union (EU) is part of the EU’s broader data
        strategy, following the Data Governance Act. It grants users the right to
        export their existing data, for example, when switching to another service
        provider. The regulation also establishes clear rules for data sharing between
        businesses (B2B) and between businesses and public sector bodies (B2G). The
        rules regulate who can use and access data generated in the EU across all
        sectors and improves portability, accessibility, and control over data, especially
        for businesses and individuals.
      retrieved_at: '2026-10-23T00:52:55.529759+00:00'
