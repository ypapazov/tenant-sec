  gov.tagging-governance:
    status: assessed
    score: 0
    evidence: The IONOS Cloud offering, specifically Object Storage, allows for programmatic
      application of tags to resources via API, CLI, and Terraform. However, extensive
      research, including targeted investigation into platform-native enforcement
      mechanisms, mandatory tag policies that prevent resource creation, tag value
      validation, inheritance, consolidated cost allocation views, and hierarchical
      policies at the organization level, yielded no documentation or evidence of
      such features across the IONOS Cloud offering. Crucially, no evidence was found
      for organizational-level visibility or reporting on tag compliance or untagged
      resources. While tags can be applied as metadata, the absence of platform-native
      detection or enforcement mechanisms means that resources can be created without
      any tags, and there is no platform-provided means to identify untagged resources
      at an organizational level. This aligns precisely with the L0 criteria, as robust
      tenant-built automation for compliance (L1) is not achievable without platform
      support for detecting non-compliance.
