  enc.hsm-backing:
    status: assessed
    score: 1
    evidence: While IONOS CLOUD's Confidential VM offering utilizes a hardware-level
      AMD Secure Processor for managing VM memory encryption keys, providing a form
      of hardware backing for that specific purpose, and explicitly stating that provider
      personnel have no access to these keys, there is no evidence that IONOS CLOUD
      offers a general-purpose, tenant-facing Key Management Service (KMS) that explicitly
      provides FIPS-validated HSM backing for customer-managed keys across multiple
      services. Block Storage also encrypts data at rest, potentially using Self-Encrypting
      Drives (SEDs), with securely stored keys stated to be inaccessible even to the
      root user, but without explicit mention of FIPS-validated HSMs as part of a
      general KMS. Therefore, for general HSM-backed key management needs, tenants
      would need to deploy and manage their own HSM solutions outside the provider's
      platform.
    verified_at: '2026-10-26'
    confidence: low
    references:
