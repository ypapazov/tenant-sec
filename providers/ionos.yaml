  net.dns-security:
    status: assessed
    score: 1
    evidence: IONOS Cloud DNS is a fully managed service for managing public DNS zones,
      including support for DNSSEC signing. However, it does not provide managed private
      DNS zones for internal resolution within a tenant's Virtual Data Center (VDC)
      or Virtual Private Cloud (VPC), nor does it offer a DNS firewall, DNSSEC validation
      by its resolvers, or DNS query logging. To achieve private DNS resolution for
      internal cloud resources, a tenant would need to deploy and manage their own
      DNS servers (e.g., BIND, Unbound) on VMs within their VDC, which is supported
      by IONOS Cloud's IaaS capabilities.
    verified_at: '2026-10-26'
    confidence: high
    references:
