    - id: ev-cp-events-not-logged
      url: https://learn.cloud.ionos.com/expert/en/courses/module-6/unit-6.1-kubernetes-platform-design.html
      title: 'Unit 6.1: Kubernetes Platform Design'
      source_class: technical
      quote: 'Node-pool logs flow to the IONOS CLOUD Logging Service (export to Object
        Storage is supported), but the managed control plane''s events do not. Because
        the control plane is hidden and operated by IONOS CLOUD, its component logs
        are outside your telemetry plane. You will not find kube-apiserver or scheduler
        events in your logging pipeline. Design around this by instrumenting what
        you do own: application and node-level logs through the in-cluster logging
        stack to the Logging Service or Object Storage, and Kubernetes API audit visibility
        built from your own resources. Do not design an alerting or forensic workflow
        that assumes control-plane event logs are available; they are not, and Unit
        7.2 treats this as one of the platform''s fixed observability gaps.'
      retrieved_at: '2026-10-22T22:23:11.560557+00:00'
      content_hash: sha256:fdbd81f3005d9afc3c15e4c9f12611e9aba321efb6b8123243a9bc3e16a285de
      applicability:
        offering: public
        regions:
        - de/fra/1
        services: []
        edition: standard
    - id: ev-nodes-immutable
      url: https://learn.cloud.ionos.com/expert/en/courses/module-6/unit-6.1-kubernetes-platform-design.html
      title: 'Unit 6.1: Kubernetes Platform Design'
      source_class: technical
      quote: 'Nodes are immutable. Nodes are never patched in place. When a node pool
        is upgraded, whether automatically during the weekly maintenance window or
        triggered manually for a version change, every node in the pool is rebuilt:
        an old node is replaced by a new one.'
      retrieved_at: '2026-10-22T22:23:11.560557+00:00'
      content_hash: sha256:fdbd81f3005d9afc3c15e4c9f12611e9aba321efb6b8123243a9bc3e16a285de
      applicability:
        offering: public
        regions:
        - de/fra/1
        services: []
        edition: standard
