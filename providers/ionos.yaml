controls:
  compute.container-orchestration:
    status: assessed
    score: 1
    evidence: 'IONOS CLOUD provides a fully managed Kubernetes offering with automated
      control plane setup, upgrades, and security fixes. The control plane is hidden,
      geo-redundant, and managed by the provider. However, the security posture for
      tenant-configurable aspects is permissive by default: no pod security standards
      are enforced, network policies are not enabled by default, and default RBAC
      policies or guardrails are not specified, leaving configuration to the tenant.
      It is unknown if etcd data is encrypted at rest by default, which aligns with
      an ''opt-in'' or manual configuration scenario. Crucially, Kubernetes API server
      audit logging is explicitly unavailable to the tenant. Therefore, the overall
      security posture requires manual hardening by the tenant, aligning with L1.'
    verified_at: '2026-10-26'
    confidence: low
