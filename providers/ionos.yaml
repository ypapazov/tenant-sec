  incident.forensic-access:
    status: assessed
    score: 1
    evidence: 'IONOS Cloud provides snapshot features for block storage and Flow Logs
      for VM NICs. However, the utility of snapshots for forensic purposes is severely
      limited: restoring a snapshot requires a server restart, and snapshots are automatically
      deleted after 3 days, making them unsuitable for long-term evidence preservation.
      There is no documented support for cross-account snapshot copying for forensic
      isolation. Flow Logs provide network traffic metadata but are not full packet
      capture. Crucially, there is no documented control plane capability for capturing
      memory dumps. The platform explicitly places responsibility for securing operating
      systems and applications, including implementing proper security measures within
      instances, on the service user. This implies that manual, host-based forensic
      procedures (e.g., via SSH) are the primary means for forensic data capture available
      to the tenant. These limitations prevent meeting the L2 criteria for non-disruptive
      forensic analysis, durable evidence preservation, or control-plane memory capture,
      thus aligning more closely with L1 capabilities where manual procedures are
      achievable.'
    verified_at: '2026-10-26'
    confidence: low
