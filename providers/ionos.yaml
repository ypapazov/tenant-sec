    - id: ev-iam-resource-authorization
      url: https://docs.ionos.com/cloud/support/general-information/service-catalog
      title: Service Catalog | Support | Products
      source_class: technical
      quote: 'Multi-User Management

        Account Types

        The authentication on the Data Center Designer requires that an account is
        assigned at least one username and one password. There are three distinct
        types of accounts:

        - Contract Owner – This account is created automatically for the user who
        initially registered with IONOS CLOUD. Only one "Contract Owner" account can
        exist per contract made with IONOS CLOUD. A “Contract Owner” is authorized
        to fully access all resources, create and delete “User” accounts, and assign
        an “Administrator” role to them.

        - Administrator - This role has the same privileges as the "Contract Owner",
        except this account type is restricted from changing the contract payment
        method. “Administrators” can assign “Administrator” roles to “User” accounts.
        It is possible to revoke the "Administrator" role after it has been assigned.

        - User - This is the most basic account type. “Contract Owner” and "Administrator"
        account types can create or delete an unlimited number of accounts of the
        "User" type. This account type can be upgraded to the "Administrator" role
        and assigned specific privileges.

        Resource Authorization

        Multi-user management controls access to the following resource'
      retrieved_at: '2026-10-26T01:35:33.664251+00:00'
      content_hash: sha256:95165712634656c4bcd5d901126482360dc044894f7a46bf4e7cdaa3b863a57f
