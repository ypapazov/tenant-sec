    - id: ev-ionos-cvm-remote-attestation-desc
      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm
      title: Confidential VM | Products
      source_class: technical
      quote: 'Why IONOS CLOUD Confidential VM

        Confidential VM replaces that trust requirement with a cryptographic proof.
        Using remote attestation, you can verify the TEE''s exact state, including
        the firmware, configuration, and startup measurements, before exposing sensitive
        data to it. No policy document or audit report is required.'
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
      content_hash: sha256:d99f06648a6b54bc9f95962e97498728b48694e9a9848945008405208f367c72
