    - id: ev-cp-managed-expert
      url: https://learn.cloud.ionos.com/expert/en/courses/module-6/unit-6.1-kubernetes-platform-design.html
      title: 'Unit 6.1: Kubernetes Platform Design'
      source_class: technical
      quote: 'The control plane (kube-apiserver, kube-scheduler, kube-controller-manager,
        etcd) is fully managed by IONOS CLOUD and is hidden: its components are not
        visible to you and cannot be modified directly, and the kube-apiserver is
