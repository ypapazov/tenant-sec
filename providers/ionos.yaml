    - id: ev-pcr-overview-managed
      url: https://docs.ionos.com/cloud/containers/private-container-registry/overview
      title: https://docs.ionos.com/cloud/containers/private-container-registry/overview
      source_class: technical
      quote: 'Our platform is responsible for providing the operations required to
        facilitate the distribution of images.

        - The Private Container Registry is available from the public internet and
        maximally available (High availability setup) for pushing and pulling artifacts.

        - The service is managed, including any components on which it is built.

        - The Private Container Registry supports the Docker Registry HTTP API v2,
        which allows it to be integrated into an automated CI/CD pipeline.

        - It also supports authentication tokens for use by robot accounts to be able
        to integrate into an automated CI/CD pipeline. You can create a one-time token
        to allow the CI/CD pipeline to push a new image.

        - You can use the Private Container Registry with Docker Registry HTTP API
        v2 compliant tools, e.g. Docker CLI.

        - You can use the same credentials to manage all Private Container Registries
        and repositories within your IONOS CLOUD account, provided you have the required
        permissions.

        - All data in the Private Container Registry will be encrypted at rest.'
      retrieved_at: '2026-10-22T22:30:36.344024+00:00'
