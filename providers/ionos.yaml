    - id: ev-ionos-cvm-snpguard
      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm/api-how-tos/attest-confidential-vm
      title: Attest a Confidential VM | Products - docs.ionos.com
      source_class: technical
      quote: 'SNPGuard is the IONOS CLOUD open-source reference implementation. It
        provides:

        - An attestation client that runs within the VM''s initrd at VMPL0 (the highest
        hardware privilege level, required for valid attestation reports).

        - A reference attestation service implementation.

        - Image preparation tooling that automates LUKS encryption, client injection,
        measurement registration, and artifact embedding.'
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
