    - id: ev-block-storage-encryption
      url: https://docs.ionos.com/cloud/backup-and-storage/block-storage/overview/data-security
      title: Data Security | Products
      source_class: technical
      quote: 'IONOS CLOUD provides block storage encryption to help secure your data
        while you are at rest. Encryption at rest refers to protecting data stored
        on physical storage devices. It ensures that data is encrypted when stored
        on disk and can be accessed only by authorized users with the correct encryption
        keys.

        IONOS CLOUD implements encryption at rest for Block Storage at two levels:

        - All logical Block Storage volumes created after the feature''s availability
        are automatically encrypted.

        - The encryption method used is AES-XTS 256-bit.

        - Each Block Storage volume uses a unique encryption key, ensuring that others
        remain secure even if one volume''s security is compromised.

        - These unique encryption keys are securely stored and remain inaccessible
        even to the root user, adding an extra layer of security.'
      retrieved_at: '2026-10-23T11:59:25.461350+00:00'
      content_hash: sha256:5112c6fc33b514a30fa2ecd880962d295ec41a7ea7c2f6fdbb0029d2ef3a1f2c
