        with the relevant formats and structures.

        Product Categories

        Products

        Format or Structure

        Supported Tools

        Containers

        "velero style"

        You can manually export using find /export -name "*.json" -print0 | xargs
        -0 kubectl apply -f.

        Data Analytics

        PGP-encrypted and a gzipped tarball containing a JSON array file for each
        Kafka topic

        Continuously read JSON messages from the stream and write them to the corresponding
        Kafka topics.

        Databases

        RDB file, including ACL, and configuration

        Move the files to the default directories used by a standard Redis installation.

        Observability

        Loki streams are Pipe (|) -delimited, Zstandard compressed CSV

        zstd - https://facebook.github.io/zstd/'
