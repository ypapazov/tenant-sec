  iam.root-account-recovery:
    status: assessed
    score: 1
    evidence: IONOS Cloud provides tenant-configurable safeguards such as Two-Factor
      Authentication (2FA) for login, a Support PIN for verifying identity during
      support interactions, and a self-service password reset. These are managed factors
      for account access. However, for a critical root/owner account recovery scenario
      where all credentials (password, 2FA device, and recovery codes) are lost, the
      documented process states that the user 'must contact the support team and request
      to turn off the 2-Step Verification.' The fetched documentation does not provide
      evidence that tenants can enforce multi-party approval, specific time delays,
      or out-of-band notifications for such support-initiated recovery paths. Furthermore,
      the Activity Log Service API monitors user activity and resource actions, but
      it does not explicitly state that support-initiated *account recovery events*
      are logged as distinct, auditable events available to the tenant. Since the
      ultimate recovery path for a fully compromised root account relies on provider
      support without tenant-enforceable policies over that process, the platform
      does not expose a managed recovery policy for every path, requiring the tenant
      to build compensating procedures around provider support for these critical
      scenarios, thus aligning with L1.
