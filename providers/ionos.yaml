    - id: ev-ionos-cvm-attest-overview
      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm/api-how-tos/attest-confidential-vm
      title: Attest a Confidential VM | Products - docs.ionos.com
      source_class: technical
      quote: 'Attestation cryptographically proves that your Confidential VM is running
        an unmodified software stack on genuine AMD SEV-SNP hardware, with the expected
        security policy active. This topic explains how attestation works, when to
        use it, and how to set it up using either the IONOS CLOUD open-source reference
        toolchain (Example: SNPGuard) or your own attestation service. It also covers
        re-attestation after software updates and the connectivity requirements your
        attestation service must meet.'
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
      content_hash: sha256:3ee192246e70d8d943b563c138259289c39acb670f5a3a925a56c48da6a4fbe7
      applicability:
        offering: public
        regions:
