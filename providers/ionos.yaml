  incident.resilience-testing:
    status: assessed
    score: 0
    evidence: IONOS CLOUD explicitly states that resilience is not a product offered
      but a property tenants must compose using basic infrastructure primitives like
      availability zones, load balancers, DNS, and backup services. There is no managed
      failover product, orchestrator, or native fault injection service available.
      Tenants are responsible for building their own health checks and automation
      for cross-zone/cross-site failover, which aligns directly with L0 where tenants
      must build their own fault injection mechanisms or use third-party tools without
      platform integration.
    verified_at: '2026-10-26'
    confidence: high
    references:
