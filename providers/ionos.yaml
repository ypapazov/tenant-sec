    summary: IONOS Cloud provides managed access logging for Object Storage, which
      captures data access operations at a granular level but is configured per-bucket.
      Managed network flow logs are available for vCPU server network interfaces,
      Virtual Data Centers, and Application Load Balancers (via NLB). These network
      logs are a form of data plane logging for network traffic but do not provide
      application-level granularity for specific data access operations on attached
      resources or HTTP requests. For service
    services:
