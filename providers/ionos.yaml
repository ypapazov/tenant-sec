  log.immutability:
    status: assessed
    score: 2
    evidence: IONOS Object Storage offers 'Object Lock' with a 'Compliance' mode that
      prevents deletion or modification of object content by any user, including the
      root account or IONOS CLOUD, for a specified retention period. This capability
      allows for the creation of WORM-compliant storage for audit logs, where attempts
      to modify or delete locked objects generate auditable error codes in access
      logs. However, the documentation explicitly states that 'delete markers on the
      objects are not subject to protection from deletion, irrespective of any retention
      period, or legal hold on the underlying object. Deleting the delete markers
      restores the previous version of the objects.' This limitation means that while
      the object content itself is immutable, the version history of a log, specifically
      regarding its perceived deletion state, can be manipulated by removing delete
      markers. This undermines the comprehensive tamper-evidence required for L3,
      as an administrator could obscure a historical 'deletion' event. Therefore,
      the control meets L2, where WORM is available but there are caveats regarding
      absolute immutability of the full audit trail for versioned objects.
    verified_at: '2026-10-26'
    confidence: low
    references:
    - url: https://docs.ionos.com/cloud/backup-and-storage/ionos-object-storage/settings/object-lock
      title: Object Lock | Products
