        services: []
        edition: standard
    - id: ev-object-storage-no-deletion-details
      url: https://cloud.ionos.com/storage/object-storage
      title: Object Storage | IONOS Cloud
      source_class: technical
      quote: '| Object Lock for long-term storage | Once an object has been stored,
        Object Lock protects it from being deleted, modified or overwritten — for
        years if required. You configure the retention periods according to your needs.
        If a new version of the same file is uploaded, the system automatically creates
        an additional version of the document. In this way, Object Lock makes your
        data auditable and meets the legal WORM ("Write Once Read Many") requirements
        for long-term data storage. |'
      retrieved_at: '2026-10-23T00:31:22.763798+00:00'
