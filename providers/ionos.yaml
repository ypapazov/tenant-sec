  data.portability-export:
    status: assessed
    score: 1
    evidence: IONOS Cloud provides both self-service APIs for metadata and configuration
      export, and support-assisted bulk export capabilities for certain application
      data (e.g., Databases, Containers, Data Analytics, Observability). It adheres
      to open standards and supports various standard formats for data export. The
      commitment to data portability is underpinned by compliance with the EU Data
      Act. However, bulk data export explicitly does not include metadata, requiring
      a separate API-based self-export for configuration details. Furthermore, the
      bulk data export mechanism does not cover data from all major services, specifically
      Object Storage and Compute Images, which would necessitate per-resource API
      calls for data. This combination of separate metadata export and limited bulk
      data export scope for application data across major services requires significant
      manual orchestration for a comprehensive export. Additionally, the documentation
      does not specify a contractual post-termination retrieval window of at least
      30 days, explicitly confirm exportability of IAM policies, encryption key metadata,
      or resource tags, detail comprehensive migration tooling to another cloud provider,
      or guarantee export without service disruption.
