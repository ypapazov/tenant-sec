      for basic port/protocol filtering, allowing tenants to control ingress and egress
      traffic. These NSGs are manageable via API and Terraform, and Flow Logs can
      be configured for monitoring. Additionally, IONOS CLOUD provides a managed DDoS
      Protect service. The 'DDoS Protect Basic' is enabled by default, offering automatic
      detection and containment for Layer 3 and 4 DDoS attacks. The 'DDoS Protect
      Advanced' allows tenants to request on-demand IP-specific filtering and attack
      diagnosis reports, indicating a managed threat-prevention policy with limited
      tenant-side configuration. However, there is no evidence of dedicated tenant-configurable
      managed IDS/IPS, traffic mirroring, managed threat signatures for general traffic,
      or explicit encrypted-traffic controls.
