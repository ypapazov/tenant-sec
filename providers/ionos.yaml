    - id: ev-ionos-cvm-zerotrust
      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm/overview/security-and-trust-model
      title: Security and Trust Model | Products
      source_class: technical
      quote: 'Security and Trust Model

        IONOS CLOUD Confidential VM enforces data privacy through hardware-level cryptography
        rather than software-based hypervisor controls. It details the zero-trust
        architecture, the four-step secure startup process, key management, shared
        responsibilities, and the boundaries of what Confidential VM protects.

        The zero-trust principle

        Standard cloud environments rely on contractual assurances and internal access
        controls to protect VM data. These are policy-based guarantees: they depend
        on the provider behaving as agreed.

        IONOS CLOUD Confidential VM replaces policy-based trust with a hardware-enforced
        cryptographic boundary. The AMD CPU architecture prevents access to VM memory,
        regardless of administrative privilege.'
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
      content_hash: sha256:b11a88a63069750592dbe3a04cf6ec436c57e22fa922bc554ed99ce833741500
      applicability:
        offering: public
        regions:
        - de/fra/1
        services:
        - vcpu-servers
        edition: standard
    - id: ev-ionos-cvm-key-management
      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm/overview/security-and-trust-model
      title: Security and Trust Model | Products
      source_class: technical
      quote: AMD SEV-SNP encrypts VM memory using keys that the AMD Secure Processor,
        a dedicated security microcontroller embedded in the CPU, generates and holds.
        These keys never leave the silicon. The hardware's design physically excludes
        the hypervisor, the host operating system, IONOS CLOUD administrators, and
        IONOS CLOUD itself from the decryption path. IONOS CLOUD has no keys, no backdoor,
        and no mechanism to access your VM's memory.
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
      content_hash: sha256:b11a88a63069750592dbe3a04cf6ec436c57e22fa922bc554ed99ce833741500
