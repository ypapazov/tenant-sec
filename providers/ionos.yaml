      source_class: technical
      quote: 'You can create flow logs using the DCD for your network interfaces and
        the public interfaces of the Managed Network Load Balancer (NLB) and Managed
        NAT Gateway. Flow logs can publish data to your buckets in the IONOS CLOUD
        Object Storage.

        After you have created and configured your bucket in the IONOS CLOUD Object
        Storage, you can create flow logs for your network interfaces.

        Activate flow logs

        To activate flow logs, follow these steps:

        1. In the DCD, go to Menu > Virtual Data Centers.

        2. Open the required data center.

        3. Go to the Server or Cubes element and select the Network tab. Open the
        properties of the Network Controller (NIC).

        4. Select the Flow Log drop-down list and fill in the fields. Provide an appropriate
        name for the flow log rule in the Name field. The name will also be the first
        part of the object name prefix.

        3. Go to the Managed NAT Gateway or Managed Network Load Balancer element
        and select the Settings tab.

        4. Provide an appropriate name for the flow log rule in the Name field. The
        name will also be the first part of the objects’ name prefix.

        5. To create flow logs for all traffic, choose a Direction from the drop-down
        list:

        - Ingress: Captures flow logs for inco'
