  iam.external-idp-federation:
    status: assessed
    score: 2
    evidence: IONOS CLOUD provides native federation support using SAML 2.0 and OpenID
      Connect (OIDC) for interactive login to the Data Center Designer (DCD), Reseller
      Portal, and Control Panel. Multiple Identity Providers (IdPs) can be configured
      simultaneously using domain-based routing. However, federation is strictly authentication-only,
      meaning it does not provision accounts or map IdP attributes to IAM roles or
      groups. Programmatic API/SDK access is not covered by federation and requires
      separate Token Manager tokens. The configuration process is manual, relying
      on REST APIs, with no managed wizard or SDK provided. Only SP-initiated flows
      are explicitly described, with no mention of IdP-initiated flows. These limitations,
      particularly regarding attribute mapping, programmatic access, and configuration
      experience, align with L2 criteria.
    verified_at: '2026-10-26'
    confidence: low
    references:
    - url: https://docs.ionos.com/cloud/set-up-ionos-cloud/management/identity-access-management/iam-federation
      title: IAM Federation | Products
    - url: https://docs.ionos.com/cloud/set-up-ionos-cloud/management/identity-access-management/iam-federation/overview
      title: Overview | Products
    evidence_items:
    - id: ev-iam-fed-1
      url: https://docs.ionos.com/cloud/set-up-ionos-cloud/management/identity-access-management/iam-federation
      title: IAM Federation | Products
      source_class: technical
      quote: 'IAM Federation

        Identity and Access Management (IAM) Federation is a mechanism that lets users
        from an external Identity Provider (IDP) access IONOS CLOUD resources, such
        as the Data Center Designer, on successful authentication and establishing
        the organization account link with the IDP. Federated IDPs such as Security
        Assertion Markup Language (SAML) 2.0 or OpenID Connect (OIDC) are supported
        to establish a trust authentication connection. With IAM Federation, users
        also get to Single Sign-On (SSO) across multiple systems without logging in
        whenever accessing these resources.'
      retrieved_at: '2026-10-23T14:08:29.563971+00:00'
      content_hash: sha256:e3682696e0873137ddd164c5ccbb990b5ec3879a7a0d36e628797ed6edee9307
      applicability:
        offering: public
        regions:
        - de/fra/1
        services: []
        edition: standard
    - id: ev-iam-fed-2a
      url: https://docs.ionos.com/cloud/set-up-ionos-cloud/management/identity-access-management/iam-federation/overview
      title: Overview | Products
      source_class: technical
      quote: 'Overview

        Identity and Access Management (IAM) Federation is a system that offers users
        a seamless authentication experience when logging in to the Data Center Designer
        (DCD). Using an Identity Provider (IDP) to authenticate the users allows them
        to share their identity information and proceed with linking the user account
        with DCD. It also enables Single Sign-On (SSO) when users wants to log in
        to the DCD using IDP.

        When users log in to the DCD with their organization credentials, all services
        and resources accessed within the DCD remain the same as when they log in
        using their IONOS CLOUD account.'
      retrieved_at: '2026-10-23T14:08:29.563971+00:00'
      content_hash: sha256:b621d611a99a71e36c82fb3b1df5690a8cde08360e8906749b42795676de11ba
      applicability:
        offering: public
        regions:
        - de/fra/1
        services: []
        edition: standard
    - id: ev-iam-fed-2b
      url: https://docs.ionos.com/cloud/set-up-ionos-cloud/management/identity-access-management/iam-federation/overview
      title: Overview | Products
      source_class: technical
      quote: 'IAM Federation workflow

        The IAM Federation works as follows:

        1. Identity Provider (IDP): The organization sets up an IDP responsible for
        authenticating users and providing their identity information to other entities.

        2. Service Provider (SP): IONOS CLOUD, which wants to allow users to access
        its resources, such as DCD. For more information, see Configure IAM Federation.

        3. Federation Protocol: The IDP and SP agree on a federation protocol, such
        as SAML (Security Assertion Markup Language), OpenID Connect, or OAuth, to
        facilitate the exchange of identity information.

        4. User Authentication: When users try to access a resource from IONOS CLOUD,
        they are redirected to the IDP for authentication.

        5. Authentication and Authorization: The IDP authenticates the user and provides
        an authentication response to IONOS CLOUD, which includes the user''s identity
        information and authorization attributes.

        6. Access to Resources: IONOS CLOUD then uses the authentication response
        to grant access to the requested resources, eliminating the need for the user
        to log in again to the DCD.'
      retrieved_at: '2026-10-23T14:08:29.563971+00:00'
      content_hash: sha256:b621d611a99a71e36c82fb3b1df5690a8cde08360e8906749b42795676de11ba
      applicability:
        offering: public
        regions:
        - de/fra/1
        services: []
        edition: standard
