  iam.credential-management:
    status: assessed
    score: 2
    evidence: IONOS Cloud provides managed features for credential management, but
      they are incomplete. API tokens can be generated with an expiry date and their
      scope can be restricted by product area and read/write permissions. Object Storage
      keys can be generated, activated/deactivated, and deleted, and their scope can
      be limited to user-owned buckets or all buckets. However, Object Storage keys
      do not support expiry dates, there is no native support for automated rotation
      for either API tokens or Object Storage keys, and expiry cannot be enforced
      retroactively on existing API tokens. No features for usage auditing, anomaly
      detection, or integration with external secrets management services were found.
      Object Storage key scoping is limited to user inheritance rather than fine-grained
      per-credential policies.
