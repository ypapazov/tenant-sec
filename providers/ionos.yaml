  iam.permission-boundaries:
    status: assessed
    score: 0
    evidence: IONOS Cloud Identity and Access Management (IAM) provides a Role-Based
      Access Control (RBAC) system where users are organized into groups, and privileges
      are assigned to these groups. These privileges determine what actions users
      can perform on resources. For Object Storage, fine-grained access control can
      be achieved through Bucket Policies, which are resource-based and specify allowed
      actions, resources, and conditions for specific buckets. However, the documentation
      does not describe any mechanism that acts as a permission boundary or a maximum
      permission ceiling for IAM principals (users or groups) themselves, nor does
      it provide a way to constrain the permissions that a delegated IAM administrator
      can grant. There is no indication of provider-enforced limits that would operate
      as an intersection with granted permissions to prevent privilege escalation
      or enable safer delegation beyond direct trust in assigned roles.
    verified_at: '2026-10-26'
    confidence: high
    references:
    - url: https://docs.ionos.com/cloud/set-up-ionos-cloud/management/identity-access-management
      title: Identity and Access Management
