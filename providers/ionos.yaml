      url: https://docs.ionos.com/cloud/set-up-ionos-cloud/management/identity-access-management
      title: Identity and Access Management
      source_class: technical
      quote: 'Identity and Access Management (IAM) is a framework of policies and
        technologies used to ensure that the right users (or entities) have the appropriate
        access to IONOS CLOUD resources. It helps you to control your resources securely
        and authenticate and authorize access users to use resources and your IONOS
        CLOUD account.

        Identity management

        When you create an account with IONOS CLOUD, you become the contract owner
        and can access your account using your username and password. To begin with,
        you login with a sign-in identity and will have access to all the services
        and resources associated with the account. Ensure that your contract owner
        credentials are safe.

        Next, from your contract owner account, you can set up other users and assign
        them the roles and resources they need. For example, administrators can have
        additional permissions, whereas sub-users can have limited permissions.

        Access management

        Once you create sub-users, they can log in to the IONOS CLOUD account using
        their credentials. The credentials are validated before authorizing access
        to the resources and privileges associated with the respective user account.'
      retrieved_at: '2026-10-26T00:28:32.848606+00:00'
