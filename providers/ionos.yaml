      url: https://docs.ionos.com/cloud/network-services/ddos-protect
      title: DDoS Protect
      source_class: technical
      quote: 'DDoS Protect Basic: This package is enabled by default for all users
        and does not require any configuration. It provides basic DDoS Protection
        for every resource on IONOS CLOUD from common volumetric and protocol attacks
        and has the following features:

        - DDoS traffic filtering - All suspicious traffic is redirected to the filtering
        platform where the DDoS traffic is filtered and the genuine traffic is allowed
        to the original destination.

        - Always-On attack detection - The service is always on by default for all
        users and does not require any added configuration or subscription.

        - Automatic Containment - Each time an attack is identified the system automatically
        triggers the containment of the DDoS attack by activating the DDoS traffic
        and letting through only genuine traffic.

        - Protect against common Layer 3 and 4 attacks - This service protects every
        resource on IONOS CLOUD from common volumetric and protocol attacks in the
        Network and Transport Layer such as UDP, SYN floods, and so on.'
      retrieved_at: '2026-10-26T02:28:20.779175+00:00'
