        by Object Lock and can be deleted, which restores previous versions of the
        objects.
      result: supported
      evidence_item_ids:
      - ev-delete-markers-not-protected
      services: []
    criteria_results:
    - level: 0
      met: true
      reasoning: Log immutability is achievable within the platform using Object Lock
        in Compliance mode, contradicting the L0 criteria.
      claim_ids:
      - cl-object-lock-provides-worm
    - level: 1
      met: true
      reasoning: While exporting logs to Object Storage with Object Lock requires
        tenant configuration, the Object Lock feature itself is a managed capability
        that provides stronger immutability than simply exporting logs to a separate
        account, exceeding the basic L1 criteria.
      claim_ids:
      - cl-object-lock-provides-worm
      - cl-activity-logs-not-auto-protected
    - level: 2
      met: true
      reasoning: Write-once storage (Object Lock in Compliance mode) is available
        and prevents deletion or modification of object content during a retention
        period. Although Compliance mode prevents lock removal, the ability for an
        administrator to delete delete markers on versioned objects and restore previous
        versions introduces a limitation to the comprehensive tamper-evidence of the
        full log history, aligning with the caveats described in L2 where immutability
        is not absolute under all circumstances.
      claim_ids:
      - cl-object-lock-provides-worm
      - cl-compliance-mode-strict-lock
      - cl-delete-markers-can-be-deleted
    - level: 3
      met: false
      reasoning: While Object Lock Compliance mode provides strong immutability for
        object content, the L3 criterion requires that logs "cannot be modified or
        deleted." The ability to delete delete markers on versioned objects, which
        then restores previous versions, means the full audit trail of changes and
        deletions is not entirely tamper-evident and can be manipulated by an administrator,
        thereby failing the absolute immutability requirement of L3.
      claim_ids:
      - cl-delete-markers-can-be-deleted
    licensing:
      status: included
      evidence: The documentation describes Object Lock as a feature of IONOS Object
        Storage without indicating it as a separate paid add-on or requiring special
        contracts.
      references:
      - url: https://docs.ionos.com/cloud/backup-and-storage/ionos-object-storage/settings/object-lock
        title: Object Lock | Products
