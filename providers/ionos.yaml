      source_class: technical
      quote: 'The Users & Groups feature provides core Identity and Access Management
        (IAM) capabilities within the IONOS CLOUD environment. It is designed to support
        Role-Based Access control (RBAC) by enabling fine-grained management of user
        identities, group associations, and resource-level permissions.

        This tutorial guides you through creating and managing Users, Groups, and
        Resources in the Virtual Data Center (VDC) using the User Manager. You can
        create new users, add them to user groups, and assign privileges to each group.
        Privileges either limit or increase your access based on the user role. The
        User Manager lets you control user access to specific areas of your VDC.

        A user is an individual who can log in to IONOS CLOUD. Each user can have
        different roles based on the privileges assigned.'
