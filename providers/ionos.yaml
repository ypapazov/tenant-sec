    - id: ev-object-storage-logging
      url: https://docs.ionos.com/cloud/backup-and-storage/ionos-object-storage/settings/logging
      title: Logging
      source_class: technical
      quote: 'Logging in IONOS CLOUD Object Storage supports the tracking and storage
        of requests made to your bucket. When you enable Logging, Object Storage automatically
        records access requests, such as the requester, bucket name, request time,
        request action, response status, and error codes, if any. By default, Logging
        is disabled for a bucket.

        Use cases

        - Security Monitoring: Tracks access patterns and identifies unauthorized
        or suspicious access to your data. In the event of a security breach, logs
        provide vital information for investigating the incident, such as IP addresses,
        request times, and the actions that were performed.

        - Auditing: Many industries require compliance with specific regulatory standards
        that mandate the monitoring and logging of access to data. Logging facilitates
        compliance with regulations like HIPAA, GDPR, or SOX by providing a detailed
        record of who accessed what data and when.

        - Troubleshooting: If there are issues with how applications are accessing
        your Object Storage data, logs can provide detailed information to help diagnose
        and resolve these issues. Logs show errors and the context in which they occurred,
        aiding in quick troubleshooting.

        Manage Logging

