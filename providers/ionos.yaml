    evidence_items:
    - id: ev-block-storage-deletion-mechanisms
      url: https://docs.ionos.com/cloud/backup-and-storage/block-storage/overview/data-security
      title: Data Security | Products - Block Storage
      source_class: technical
      quote: 'When you initiate the deletion of a Block Storage volume, IONOS CLOUD
        takes the following steps:

        - The volume is immediately flagged for deletion and inaccessible to all systems
        and users. For security reasons, the deletion can be deferred for up to 48
        hours.

        - IONOS CLOUD guarantees that the metadata of the deleted volume is "zeroed
        out":

        - All metadata information is securely overwritten with zeros.

        - The process effectively removes the block mapping between the logical and
        physical volumes.

        Without the block mapping provided by the metadata, retrieving user data for
        the specific volume becomes impossible. The metadata is a required component
        of the encryption key. Deleting the metadata effectively deletes the encryption
        key. With the encryption key deleted, the encrypted user data can no longer
        be decrypted, even if it were to be recovered by any means.'
      retrieved_at: '2026-10-23T00:31:22.763798+00:00'
      content_hash: sha256:5112c6fc33b514a30fa2ecd880962d295ec41a7ea7c2f6fdbb0029d2ef3a1f2c
      applicability:
        offering: public
        regions:
        - de/fra/1
        services: []
        edition: standard
    - id: ev-backup-service-deletion-mechanisms
      url: https://docs.ionos.com/cloud/backup-and-storage/backup-service/overview/data-security
      title: Data Security | Products - Backup Service
      source_class: technical
      quote: 'Secure deletion

        - Secure deletion is achieved by using customer-provided passwords for each
        backup.

        - If no password is set, data is still securely deleted when it leaves the
        Acronis''s perimeter.

        - Acronis manages the physical infrastructure. When drives or equipment need
        repair or decommissioning, Acronis ensures complete data erasure from disks
        and internal memory according to NIST SP 800-88rev1. If erasure is not possible,
        equipment is physically destroyed to prevent data recovery.'
      retrieved_at: '2026-10-23T00:31:22.763798+00:00'
      content_hash: sha256:92bafb2aa43a9cbf3436a12354fc6bcf1548621ba3d709e539e3c3ff5a520efa
      applicability:
