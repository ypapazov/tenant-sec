  net.cross-environment-connectivity:
    status: assessed
    score: 2
    evidence: IONOS Cloud provides cross-environment connectivity through both tenant-managed
      VPN Gateways, which can connect VDCs across different regions, and Cross Connect,
      which offers managed LAN-based peering within the same region and contract.
      However, the documentation explicitly states that only static routing is available
      for VPN Gateways, precluding transitive routing. There is no evidence of a dedicated
      transit gateway, hub-spoke architecture with centralized routing management,
      shared VPC/VNet support across accounts/projects, or centralized egress/ingress
      inspection capabilities. These limitations confirm that the offering aligns
      with L2, as peering is constrained and advanced L3 features are absent.
