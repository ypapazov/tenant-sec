      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm
      title: Confidential VM | Products
      source_class: technical
      quote: 'Confidential VM

        IONOS CLOUD Confidential VM encrypts your VM''s memory at the CPU level. Even
        with full administrative access to the physical host, the hypervisor sees
        only ciphertext.

        It protects data in use, the third state of data that standard encryption
        does not cover. Encryption at rest protects stored data, and encryption in
        transit protects data moving over a network. Confidential VM closes the remaining
        gap by protecting data while it''s being processed in memory.'
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
      content_hash: sha256:d99f06648a6b54bc9f95962e97498728b48694e9a9848945008405208f367c72
      applicability:
        offering: public
        regions:
        - de/fra/1
        services:
        - vcpu-servers
        edition: standard
    - id: ev-ionos-cvm-hardware-isolation
      url: https://docs.ionos.com/cloud/compute-services/compute-engine/confidential-computing-vm
      title: Confidential VM | Products
      source_class: technical
      quote: '- Hardware-Level Isolation: Workloads run in a runs in a hardware-enforced
        Trusted Execution Environment (TEE) using AMD Secure Encrypted Virtualization
        with Secure Nested Paging (AMD SEV-SNP) technology ensuring the hypervisor
        sees only ciphertext. For more information, see Use Cases.'
      retrieved_at: '2026-10-23T01:47:16.956868+00:00'
      content_hash: sha256:d99f06648a6b54bc9f95962e97498728b48694e9a9848945008405208f367c72
