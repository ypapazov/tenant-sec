  data.residency-guarantees:
    status: assessed
    score: 1
    evidence: While IONOS Cloud Object Storage and Nextcloud Workspace offer explicit
      data residency guarantees and contractual commitments for primary data within
      the selected region, the research found no explicit residency guarantees in
      the fetched documentation for other major services on the IONOS Cloud platform,
      such as Managed Kubernetes, Managed Databases, or Block Storage. This means
      that for a significant portion of the offering's major services, data residency
      relies on the tenant's architectural choices and vigilance, without explicit
      provider commitments, thus aligning the overall offering with L1 rather than
      L2. Furthermore, the documentation lacks details on universal technical controls
      against misconfiguration, comprehensive contractual coverage for all metadata,
      logs, backups, and replicas across all services, and auditable scope mechanisms
      to achieve L3.
