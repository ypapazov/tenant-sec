    criteria_results:
    - level: 0
      met: false
      reasoning: The service is a fully managed Kubernetes offering, with the control
        plane managed and patched by the provider, providing platform support. Thus,
        container orchestration security is not entirely tenant-managed.
      claim_ids:
      - cl-managed-k8s
      - cl-cp-managed-patched
    - level: 1
      met: true
      reasoning: The managed Kubernetes offering exists. However, the security posture
        is permissive by default because there are no pod security standards enforced
        by default (cl-pss-not-enforced-default), network policies are not enabled
        by default (cl-network-policies-not-enabled-default), etcd encryption at rest
        is unknown (cl-etcd-encryption-unknown), and RBAC configuration is left to
        the tenant with no specified guardrails (cl-rbac-no-guardrails). This indicates
        that significant hardening is manual.
      claim_ids:
      - cl-managed-k8s
      - cl-pss-not-enforced-default
      - cl-network-policies-not-enabled-default
      - cl-etcd-encryption-unknown
      - cl-rbac-no-guardrails
    - level: 2
      met: false
      reasoning: Although RBAC is enabled (cl-rbac-enabled) and the control plane
        is managed and patched (cl-cp-managed-patched) with network policies requiring
        explicit creation (cl-network-policies-not-enabled-default), the service fails
        to meet L2 because it is unknown if etcd is encrypted at rest by default (cl-etcd-encryption-unknown),
        Pod Security Admission availability is not documented (cl-pss-not-enforced-default),
        and critically, Kubernetes API server audit logging is explicitly unavailable
        to the tenant (cl-audit-logging-unavailable).
      claim_ids:
      - cl-rbac-enabled
      - cl-cp-managed-patched
      - cl-network-policies-not-enabled-default
      - cl-etcd-encryption-unknown
      - cl-audit-logging-unavailable
      - cl-pss-not-enforced-default
    - level: 3
      met: false
      reasoning: There is no evidence of pod security standards enforced by default
        (cl-pss-not-enforced-default), network policies enabled in the default namespace
        (cl-network-policies-not-enabled-default), managed admission controller hooks,
        runtime threat detection for container behavior, or CIS Kubernetes benchmark
        compliance by default. While node security patching happens via rebuilds (cl-worker-node-patching-by-rebuild),
        this alone does not satisfy all L3 criteria.
      claim_ids:
      - cl-pss-not-enforced-default
      - cl-network-policies-not-enabled-default
      - cl-worker-node-patching-by-rebuild
