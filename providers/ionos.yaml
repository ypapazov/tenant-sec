    - id: ev-cp-patched-expert
      url: https://learn.cloud.ionos.com/expert/en/courses/module-6/unit-6.1-kubernetes-platform-design.html
      title: 'Unit 6.1: Kubernetes Platform Design'
      source_class: technical
      quote: 'Operationally, IONOS CLOUD keeps the control plane current: supported
        Kubernetes versions are 1.34, 1.33, 1.32, and 1.31, with a maximum minor-version
        skew of one between the control plane and node pools.'
      retrieved_at: '2026-10-22T22:23:11.560557+00:00'
      content_hash: sha256:fdbd81f3005d9afc3c15e4c9f12611e9aba321efb6b8123243a9bc3e16a285de
      applicability:
        offering: public
        regions:
