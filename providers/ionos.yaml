      title: 'Unit 7.1: Resilience and Business Continuity'
      source_class: technical
      quote: IONOS CLOUD does not sell a managed failover product. There is no orchestrator
        that watches a primary, declares it dead, and promotes a secondary across
        the whole stack, and no managed cross-zone or cross-site failover service.
