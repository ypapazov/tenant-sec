  gov.quotas-service-control:
    status: assessed
    score: 0
    evidence: 'OVHcloud provides an Identity and Access Management (IAM) framework
      that allows tenants to write custom access policies with ''allow'', ''deny'',
      or ''except'' permissions targeting specific product types (services) and actions
      (e.g. reboot, delete). However, this control is applied manually at the account
      level. There is no native organizational hierarchy (such as organizational units
      or folders) that supports automatic cascading of service control policies (SCPs)
      or region restrictions to sub-accounts or newly created projects. Therefore,
      it satisfies the L1 criteria.


      Independent challenge: OVHcloud IAM policies support allow/deny/except actions,
      resource groups, and conditions based on resource tags, names, product types,
      and request parameters (IP, time). However, OVHcloud lacks any hierarchical
      organization-level policy enforcement (such as OUs, folders, or inheritance
      of service control policies across sub-accounts/projects). Any restriction on
      services must be manually configured via IAM policies per account or identity.
      Furthermore, there is no explicit regional restriction capability or region-based
      condition in the IAM framework, meaning regional boundaries cannot be enforced
      globally. Consequently, the capability meets only L0 criteria.'
    verified_at: '2026-09-29'
    confidence: high
    references:
    - url: https://docs.ovhcloud.com/en/guides/account-and-service-management/account-information/iam-policies-api
      title: https://docs.ovhcloud.com/en/guides/account-and-service-management/account-information/iam-policies-api
