  iam.root-account-recovery:
    status: assessed
    score: 1
    evidence: OVHcloud root account (NIC handle) recovery has no tenant-configurable
      managed recovery policies. Password recovery defaults to sending a reset link
      to the primary email. If the primary email is lost, the tenant can use a pre-configured
      backup email by contacting customer service. If both are invalid, the tenant
      must submit physical identity verification documents to support. A 25-hour delay
      is automatically enforced for primary email changes if the old address is inaccessible,
      but this is a platform-wide hardcoded behavior and is not customizable or policy-driven.
      Recovering from lost 2FA also requires manually uploading identity documents,
      with a manual support resolution window of up to 72 hours. Since no managed
      recovery policy with multiple factors or multi-party approval exists, the control
      is assessed at L1, requiring the tenant to secure recovery externally (e.g.,
      protecting the external recovery email domains).
    verified_at: '2026-09-29'
    confidence: high
    references:
