  enc.private-ca-lifecycle:
    status: assessed
    score: 1
    evidence: OVHcloud does not offer a managed, general-purpose Private Certificate
      Authority (CA) or private PKI service. The only certificate management capability
      provided natively is the generation of OKMS 'access certificates' (detailed
      in the OKMS documentation), which are strictly client credentials used to authenticate
      to the Key Management Service (OKMS) API and IAM, rather than general-purpose
      workload certificates. Consequently, establishing a private PKI with automated
      issuance, rotation, and revocation requires tenants to deploy and operate their
      own CA software (e.g., HashiCorp Vault, cert-manager, or step-ca) on tenant-managed
      resources like Public Cloud Instances or Managed Kubernetes Service. This aligns
      to level L1.
