  gov.tagging-governance:
    status: assessed
    score: 0
    evidence: 'OVHcloud allows tagging resources (e.g., Bare Metal servers, public
      cloud instances) and supports referencing resource tags as IAM policy conditions
      (ABAC). However, there is no platform-native tag governance or policy enforcement
      engine (such as AWS Tag Policies or Azure Policy) that can enforce tag presence,
      validate tag values, or block resource creation when tags are missing. Consequently,
      tag governance and compliance must be achieved via tenant-built automation (e.g.,
      using API/CLI queries to audit resources and apply/notify about missing tags),
      matching the requirements for L1.


      Independent challenge: OVHcloud lacks a platform-wide tag governance or policy
      enforcement framework. While tags can be assigned to certain resources as metadata,
      and IAM policies can conditionally grant/deny access based on existing resource
      tags (ABAC), there is no native capability to block the creation of resources
      that lack mandatory tags, validate tag values against predefined schemas/patterns,
      or report on tag non-compliance across the organization. This aligns with L0
      criteria.'
    verified_at: '2026-09-29'
    confidence: medium
    references:
