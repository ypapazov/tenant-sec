      url: https://docs.ovhcloud.com/en/guides/account-and-service-management/account-information/iam-policies-api
      title: How to use IAM policies using the OVHcloud API
      source_class: technical
      quote: "In detail, a policy contains:\n- One or more identities targeted by\
        \ this policy.\n  - It can be account IDs, users or user groups (like the\
        \ ones used in Federation).\n- One or more resources impacted by this policy.\n\
        \  - A resource is an OVHcloud product that will be impacted by this policy\
        \ (a domain name, a Nutanix server, a Load Balancer, etc.).\n- One or more\
        \ actions allowed, denied or excepted by this policy.\n  - Actions are the\
        \ specific rights affected by this policy (reboot a server, create an email\
        \ account, cancel a subscription, etc.)\nFor example, we can create a policy\
        \ to give to a user called John, for a VPS, access to the action \"reboot\"\
        ."
