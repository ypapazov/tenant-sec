      accounts (NIC handles) with no native organizational hierarchy (OUs, folders,
      or parent-child account management) or hierarchical policy inheritance. Tenants
      can segregate resources within a single account using 'Public Cloud projects'
      and can delegate access cross-account using IAM policies targeting other OVHcloud
      accounts. However, managing a multi-account organization with consistent policies
      requires custom tooling and conventions to replicate policies and manage accounts,
      placing OVHcloud at Level 1.
