controls:
  compute.container-orchestration:
    status: assessed
    score: 1
    evidence: OVHcloud Managed Kubernetes Service is available but operates with a
      permissive security posture by default. The default kubeconfig retrieves full
      administrative credentials ('access to everything in the cluster'). The responsibility
      model explicitly designates modifying network default configurations (for connection
      security) and encrypting sensitive data in the cluster as Customer responsibilities
      (Customer RA). Cilium is used as the default CNI, but network policies are not
      enabled by default, and features like transparent WireGuard encryption are opt-in
      and require manual CiliumNodeConfig overrides.
    verified_at: '2026-09-29'
    confidence: high
    references:
    - url: https://docs.ovhcloud.com/en/guides/public-cloud/containers-orchestration/managed-kubernetes/responsibility-model
      title: https://docs.ovhcloud.com/en/guides/public-cloud/containers-orchestration/managed-kubernetes/responsibility-model
