  enc.key-lifecycle:
    status: assessed
    score: 1
    evidence: OVHcloud Key Management Service (KMS) does not support platform-managed
      automatic key rotation, key versioning, or scheduled deletion with a grace period.
      To perform key deletion, a user must manually disable the key and then delete
      it; deletion is immediate and irreversible. Rotation is manual and must be orchestrated
      by the tenant (e.g., by creating a new key, updating application configurations,
      re-encrypting data, and manually deprecating the old key). For Managed Kubernetes,
      rotating ETCD encryption keys via KMIP requires running multiple providers simultaneously
      to transition configurations manually. For Object Storage, server-side encryption
      with OVHcloud-managed keys (SSE-OMK) automatically rotates keys, but the tenant
      has no visibility or configurability. SSE-C requires the tenant to manage and
      rotate keys completely outside the platform.
    verified_at: '2026-09-29'
    confidence: high
    references:
