    - id: ev-k8s-patch
      url: https://docs.ovhcloud.com/en/guides/public-cloud/containers-orchestration/managed-kubernetes/change-security-update
      title: Changing the security update policy on an OVHcloud Managed Kubernetes
        cluster
      source_class: technical
      quote: 'Here, we defined the ovh-eu endpoint because we want to call the OVHcloud
        Europe API, but other endpoints exist, depending on your needs:

        ovh-eu for OVHcloud Europe API

        ovh-us for OVHcloud US API

        ovh-ca for OVHcloud North-America API

        Then, create a variables.tf file with service_name:

        variable service_name { type = string default = "<your_service_name>"}

        Define the resources you want to create in a new file called ovh_kube_cluster.tf:

        resource "ovh_cloud_project_kube" "cluster" { service_name = var.service_name
        name = "my-super-cluster" region = "GRA5" version = "1.31" update_policy =
        "NEVER_UPDATE" # "ALWAYS_UPDATE" by default but you can choose also "MINIMAL_DOWNTIME"
        or "NEVER_UPDATE"}

        In this resources configuration, we ask Terraform to create a Kubernetes cluster,
        in the GRA5 region, using the Kubernetes version 1.31 (the last and recommended
        version at the time we wrote this tutorial), with a security update policy
        that equals to "Do not update".'
      retrieved_at: '2026-09-23T17:21:03.293738+00:00'
      content_hash: sha256:409a96a95102658c44cbf3d9b2cfdd092474f08bc987997b86210b017e2fbbdd
