  log.export-integration:
    status: assessed
    score: 1
    evidence: OVHcloud operates the Logs Data Platform (LDP) as its central observability
      solution. While customers can forward system, platform, and audit logs (such
      as IAM access and account activity logs) from various OVHcloud services into
      LDP streams, LDP does not offer a native managed push-based or streaming export
      mechanism to external customer-owned S3 buckets or SIEM platforms. Instead,
      to export logs out of the OVHcloud ecosystem, tenants must set up, run, and
      maintain their own processing loops (e.g., Logstash or Elasticdump) that pull
      log data via the OpenSearch API, use WebSockets, or run the Python-based 'ldp-archive-mirror'
      tool to retrieve archived logs. Because external export is entirely pull-based
