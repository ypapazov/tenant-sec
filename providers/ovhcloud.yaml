  iam.multi-tenancy-isolation:
    status: assessed
    score: 2
    evidence: 'OVHcloud provides a robust project-based isolation model where resources
      are separated into distinct ''Public Cloud Projects''. These projects act as
      strong boundaries with independent API endpoints, independent billing tracking,
      and isolated quotas. IAM policies can restrict access to specific projects,
      and landing zones can be deployed programmatically using IaC (such as OpenTofu
      via service accounts). However, the architecture is limited by a fixed hierarchy
      depth: all projects exist directly under a single OVHcloud account (NIC handle),
      and it is not possible to create organizational units (OUs) or nested folders
      below this management tier. Therefore, it meets the L2 criteria.'
    verified_at: '2026-09-29'
    confidence: high
