  data.portability-export:
    status: assessed
    score: 1
    evidence: 'OVHcloud aligns with the SWIPO (Switching Cloud Providers and Portability
      Association) IaaS Code of Conduct for its Public Cloud services (Compute, Block
      Storage, and Object Storage), guaranteeing technical reversibility without extra
      termination billing. Because OVHcloud Public Cloud is heavily based on OpenStack,
      infrastructure and instance configuration can be exported using standard OpenStack
      APIs and CLI tools. Databases (PostgreSQL) support native data exports (e.g.,
      pg_dump), and Object Storage is accessible via standard S3/Swift APIs. However,
      OVHcloud does not provide a single, managed bulk export tool for all configurations
      (such as global IAM policies, KMS metadata, and complex networking rules in
      one step), and the documented post-termination data retention window is 7 days
      on Object Storage, which fails the L3 requirement of at least 30 days.


      Independent challenge: OVHcloud meets L1 criteria across all scoped services.
      While core Public Cloud services (Compute, Block Storage, Object Storage) align
      with SWIPO IaaS Code of Conduct principles using standard OpenStack and S3/Swift
      APIs, there is no provider-wide bulk export tool for all services and configuration
      metadata. Additionally, there is no broad contractual commitment to a post-termination
      retrieval window (Object Storage is limited to 7 days, and other services state
      that resource deletion results in immediate loss of data with no restoration
      possible). Services like KMS, Secret Manager, IAM, and Databases rely on per-resource
      APIs and native tooling for export.'
    verified_at: '2026-09-29'
    confidence: high
    references:
    - url: https://docs.ovhcloud.com/en/guides/account-and-service-management/reversibility/public-cloud-reversibility-policy
      title: https://docs.ovhcloud.com/en/guides/account-and-service-management/reversibility/public-cloud-reversibility-policy
