  net.cross-environment-connectivity:
    status: assessed
    score: 2
    evidence: OVHcloud provides cross-environment connectivity through its vRack service,
      a transversal Layer-2 private network. It supports cross-project network sharing,
      allowing a private network and its subnets to be shared between multiple Public
      Cloud projects. Additionally, vRack enables cross-region connectivity by configuring
      a single broadcast domain (VLAN) across regions. However, because the vRack
      operates as a flat Layer-2 network, OVHcloud lacks a native, managed transit
      gateway or centralized routing hub to manage transitive routing policies, and
      it does not offer a native way to centralize egress/ingress inspection across
      multiple connected environments without tenant-constructed virtual routing appliances.
    verified_at: '2026-09-29'
    confidence: high
    references:
