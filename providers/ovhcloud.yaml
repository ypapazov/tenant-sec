      its IAM policy engine and Tag Manager service. Resource-level tags (custom,
      predefined, and system) can be applied to resources and subsequently checked
      in IAM policy conditions using the `resource.Tag(tag_key)` syntax. The IAM engine
      supports logical operators (AND, OR, NOT) and comparison operators (EQ, LT,
