  iam.privileged-access:
    status: assessed
    score: 1
    evidence: OVHcloud IAM does not offer a native, managed Just-In-Time (JIT) access
      elevation interface or Privileged Identity Management (PIM) system. However,
      its IAM policy API supports an 'expiredAt' parameter that automatically disables
      a policy after a specified date/time, and supports time-based conditions (such
      as restricting access to certain days of the week). Consequently, while native
      JIT is unavailable, tenants can achieve time-bound privilege grants and JIT
      access by building their own custom automation (such as scripts or webhooks)
      that programmatically create and delete temporary policies using the 'POST /iam/policy'
      API.
    verified_at: '2026-09-29'
    confidence: high
    references:
