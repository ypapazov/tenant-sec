  log.immutability:
    status: assessed
    score: 1
    evidence: OVHcloud provides audit, activity, and access policy log forwarding
      to its managed Logs Data Platform (LDP). Logs within LDP are stored in streams
      which are immutable under normal conditions, but the entire stream (along with
      any cold-storage archives) can be deleted by an administrator. There are no
      managed WORM or compliance-mode locks available to prevent stream or archive
      deletion by the root/owner account. However, L1 is met because OVHcloud IAM
      can be configured to restrict access to LDP services and streams, effectively
      isolating log management under a separate administrative boundary away from
      operational administrators.
    verified_at: '2026-09-29'
    confidence: high
    references:
