  log.resource-inventory:
    status: assessed
    score: 0
    evidence: 'OVHcloud does not offer a dedicated managed service for continuous
      resource configuration inventory, drift detection, or configuration history
      retention (such as AWS Config or Azure Resource Graph). However, it provides
      a centralized Tag Manager that displays resources across multiple services to
      facilitate tag-based group management, and provides stable REST APIs (as shown
      in the `/iam/policy` and tagging guides) which enable tenants to write custom
      scripts to query resources, enumerate URNs, and maintain their own snapshot
      histories.


      Independent challenge: OVHcloud currently lacks any centralized resource configuration
      tracking service (comparable to AWS Config or Azure Resource Graph). While ''Tag
      Manager'' offers a transverse interface to list tags and assign metadata to
      various resources, it does not support configuration historical versioning,
      drift detection, or SQL-like querying of resource parameters. To construct an
      inventory, tenants must query each service''s list API individually or stream
      activity logs to the Logs Data Platform to build a custom solution, which satisfies
      only the criteria for L0.'
