  incident.availability-zones:
    status: assessed
    score: 2
    evidence: Scaleway provides a resilient architecture across multiple regions (Paris,
      Amsterdam, Warsaw) containing isolated Availability Zones (AZs) designed to
      withstand localized power, network, or hardware failures. At least two AZs are
      available per region, with three AZs available in some regions (such as fr-par-1,
      fr-par-2, and fr-par-3 in Paris), though this is not universal. Major managed
      services, such as Load Balancer, Object Storage, Managed Databases, and Kubernetes
      Kapsule, support multi-AZ deployments. However, multi-AZ is not the default
      configuration (e.g., databases default to Standalone mode, and Kapsule requires
      manual setup of node pools in separate AZs). Additionally, formal blast radius
      analysis documentation is not available. This limits the score to L2.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/use-cases/application-hosting/high-availability-resilience
      title: https://www.scaleway.com/en/docs/use-cases/application-hosting/high-availability-resilience
