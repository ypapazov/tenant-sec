  iam.privileged-access:
    status: assessed
    score: 1
    evidence: Scaleway does not offer a native Just-in-Time (JIT) access elevation,
      Privileged Identity Management (PIM), or approval workflow capability within
      its IAM service. Privileged roles or policy permissions are permanently assigned
      to principals. While static time-bound restrictions can be configured on rules
      using Common Expression Language (CEL) conditions (e.g., limiting request time
      to a certain range), there is no native workflow for users to request, approve,
      and activate temporary elevations. Dynamic JIT must be achieved through tenant-built
      automation, such as Scaleway Serverless Functions combined with the Scaleway
      IAM API to programmatically assign and revoke access.
