  compute.patch-management:
    status: assessed
    score: mixed
    summary: Patch management capabilities vary by service. Serverless Containers
      and Kubernetes Kapsule offer provider-managed patching without explicit tenant
      visibility or scheduling controls (L1). Managed Databases provide maintenance
      notifications and limited tenant control over application timing (L2). For other
      services, documentation was insufficient to assess.
    services:
      containers:
        status: assessed
        evidence: Scaleway states that the platform is managed and benefits from continuous
          security patching, reducing the tenant's operational security burden. This
          implies the provider handles patching without tenant visibility or scheduling
          control.
        confidence: high
        score: 1
        references:
        - url: https://www.scaleway.com/en/docs/serverless-containers/reference-content/migrate-to-serverless-containers
          title: https://www.scaleway.com/en/docs/serverless-containers/reference-content/migrate-to-serverless-containers
      kapsule:
        status: assessed
