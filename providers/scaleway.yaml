  iam.mfa-enforcement:
    status: assessed
    score: 2
    evidence: Scaleway allows administrators to enforce Multifactor Authentication
      (MFA) at the Organization level, making it mandatory for all users when logging
      into the console. The platform supports TOTP for all users (Owners and IAM Members)
      and Passkeys (WebAuthn) for account Owners. However, MFA enforcement is limited
      to console access and does not extend to programmatic paths (CLI/API via API
      keys). Furthermore, conditional access policies (such as context-aware or IP-based
      MFA challenges) are not supported, and WebAuthn is restricted to account Owners
      only.
