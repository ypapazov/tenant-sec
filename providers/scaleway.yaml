  gov.account-lifecycle:
    status: assessed
    score: 1
    evidence: Scaleway does not offer a managed landing zone or account factory solution
      (such as AWS Control Tower or GCP Landing Zones). Instead, resource isolation
      is managed at the Organization and Project levels. While Projects can be created
      manually in the console, lifecycle automation is entirely achievable using tenant-built
      Infrastructure-as-Code (IaC) via the official Scaleway Terraform provider, which
