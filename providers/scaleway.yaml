  net.threat-prevention:
    status: assessed
    score: 1
    evidence: Scaleway VPC provides capabilities to route traffic through custom firewalls
      or network virtual appliances using Custom Routes and VPC Peering Ingress Routing
      Rules. The Ingress Routing Rules specifically allow tenants to force traffic
      entering a VPC from a peering connection to pass through a central firewall/inspection
      appliance before reaching its destination. However, Scaleway does not offer
      any native, managed IDS/IPS, deep packet inspection, or traffic mirroring service;
      native filtering is limited to L3/L4 Security Groups and Network ACLs (NACLs).
      Therefore, the tenant is fully responsible for operating, managing, and scaling
      any packet inspection appliances, landing the offering at L1.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/network/vpc-peering/concepts
      title: https://www.scaleway.com/en/docs/network/vpc-peering/concepts
    - url: https://www.scaleway.com/en/docs/faq/vpc
      title: https://www.scaleway.com/en/docs/faq/vpc
