  compute.image-management:
    status: assessed
    score: 1
    evidence: Scaleway provides a fully managed private Container Registry with integrated
      vulnerability scanning (powered by Trivy). However, it does not meet the L2
      criteria because it lacks native, platform-managed signed image enforcement
      (such as a managed admission controller or container policy) for Kubernetes
      (Kapsule) workloads, serverless containers/functions, or virtual machine instances.
      Tenants must deploy and configure their own admission controllers (e.g., Kyverno,
      Connaisseur) and establish their own scanning/signing pipelines to achieve these
      protections.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/kubernetes/how-to/deploy-image-from-container-registry
      title: https://www.scaleway.com/en/docs/kubernetes/how-to/deploy-image-from-container-registry
    - url: https://www.scaleway.com/en/docs/container-registry/quickstart
      title: https://www.scaleway.com/en/docs/container-registry/quickstart
