  enc.byok:
    status: assessed
    score: 2
    evidence: 'Scaleway Key Manager supports Bring Your Own Key (BYOK) for AES-256
      keys by importing externally generated key material via the Key Manager API.
      However, it carries significant limitations that restrict it to L2. First, asymmetric
      keys cannot be imported. Second, key material is passed as Base64 with a salt
      over the API, without wrapping via a provider-provided public wrapping key.
      Third, rotation is highly limited: you cannot rotate an imported key in-place
      by adding new material without either deleting the existing key material first
      (which disrupts access) or creating a completely new key.'
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/key-manager/api-cli/byok-api-cli
      title: https://www.scaleway.com/en/docs/key-manager/api-cli/byok-api-cli
    evidence_items:
    - id: ev-scaleway-byok-api
      url: https://www.scaleway.com/en/docs/key-manager/api-cli/byok-api-cli
      title: Using Bring Your Own Key with the Scaleway API and CLI
      source_class: technical
      quote: "Import key material\nTo import your key material into your Key Manager\
        \ key, use the ImportKeyMaterial endpoint:\ncurl -X POST 'https://api.scaleway.com/key-manager/v1alpha1/regions/fr-par/keys/<your_key_id>/import-key-material'\
        \ \\\n    --header 'Content-Type: application/json' \\\n    --header 'X-Auth-Token:\
        \ <Scaleway_API_Secret_Key>' \\\n    --data '{\n        \"key_material\":\
        \ \"<your_base64_encoded_key_material>\",\n        \"salt\": \"<your_base64_encoded_salt>\"\
        \n    }'\nExecute the following steps to import and use a key:\n- Generate\
        \ random data locally, which will be used as key material.\n- Create a key\
        \ with the external origin, as described in the Requirements section.\n- Call\
        \ ImportKeyMaterial with thekey_id of the key you created, and pass your key\
        \ material in thekey_material field.\n- Key Manager uses the key material\
        \ to create the first key rotation."
      retrieved_at: '2026-09-23T02:42:42.154744+00:00'
      content_hash: sha256:7262f28399b9176b8492b625f6e66b2e1d21582e036270514b16c95463b74356
