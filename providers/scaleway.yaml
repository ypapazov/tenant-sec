          Kapsule. This indicates the provider manages patching, but there is no mention
          of tenant visibility into schedules or control over timing.
        confidence: high
        score: 1
        references:
        - url: https://www.scaleway.com/en/docs/kubernetes/reference-content/understanding-differences-kapsule-kosmos
          title: https://www.scaleway.com/en/docs/kubernetes/reference-content/understanding-differences-kapsule-kosmos
      rdb:
        status: assessed
        evidence: Scaleway's documentation for Managed Databases indicates that maintenance
          operations (including patching) are scheduled by Scaleway, but tenants are
          notified via a banner in the console and can choose to apply maintenance
