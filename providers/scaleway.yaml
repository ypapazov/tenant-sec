      title: Understanding differences between the Kapsule and Kosmos managed Kubernetes
        services
      source_class: technical
      quote: 'Kubernetes Kosmos

        Kosmos is Scaleway''s multi-cloud Kubernetes solution, designed to operate
        across multiple cloud environments, empowering users to deploy applications
        on different cloud providers, thus offering flexibility and avoiding vendor
        lock-in.

        - Available in multiple Scaleway regions (PAR, AMS, WAW), allowing users to
        deploy applications closer to their target audience for enhanced performance.

        - Offers dedicated control plane options, ensuring dedicated resources for
        managing Kubernetes clusters.

        - Supports various node pool types, including Scaleway instances (x86 and
        ARM architecture) and external providers, providing users with options to
        tailor node configurations according to their application needs.

        - Uses the Kilo Container Network Interface (CNI) plugin for efficient networking
        within Kubernetes clusters.'
