  net.isolation-model:
    status: assessed
    score: 2
    evidence: Scaleway provides a VPC model featuring Layer 3 regional VPCs and Layer
      2 Private Networks (VLANs). Resources attached to a Private Network do not require
      a public IP address and are completely isolated from the public internet (deny-all
      default from the outside). However, routing within the VPC between Private Networks
      is automatically managed and permitted by default (permissive internally until
      restricted by stateless Network ACLs). Scaleway VPC lacks custom subnet-level
      routing tables and there is no evidence of native subnet traffic flow logs in
      the VPC documentation. VPC Peering is supported across projects and organizations,
      but the scope of the VPC and Private Networks remains regional.
