  enc.external-key-management:
    status: assessed
    score: 1
    evidence: Scaleway does not support a managed External Key Management (EKM) or
      Hold Your Own Key (HYOK) integration where the cloud KMS calls out to an external
      HSM or third-party key manager (meaning L3 is not met). Instead, Scaleway's
      Key Manager supports importing locally generated key material (BYOK), but once
      imported, this key material resides and is processed within Scaleway's infrastructure.
      For Object Storage, Scaleway supports Server-Side Encryption with Customer-provided
      keys (SSE-C), which allows the customer to maintain keys externally and pass
      them in HTTPS headers on each request; however, this is an API parameter rather
      than an integrated external key manager. General external key management is
      thus limited to application-layer client-side encryption (L1).
