    - level: 2
      met: false
      reasoning: L2 requires managed signed image enforcement (admission controller
        / container policy) to be available natively for Kubernetes workloads, which
        is not offered out of the box by Scaleway's Kapsule control plane.
      claim_ids:
      - cl-scw-managed-signing-enforcement
    - level: 3
      met: false
      reasoning: Scaleway does not provide managed VM image scanning, continuous registry
        scanning with automated deployment blocking, native Sigstore signature verification,
        or org-level enforcement policies.
      claim_ids:
