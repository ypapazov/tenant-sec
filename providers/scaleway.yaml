  net.cross-environment-connectivity:
    status: assessed
    score: 2
    evidence: Scaleway supports regional VPC Peering which enables secure private
      connections between VPCs in different Projects or Organizations. However, the
      connectivity is constrained to the same region (no cross-region peering is supported),
      and transitive peering is highly restricted (limited to four chained VPCs, disabled
      by default, and routing is managed through manual custom routes per VPC rather
      than a centralized transit hub). This meets the criteria for Level 2.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/vpc-peering/reference-content/understanding-vpc-peering
      title: https://www.scaleway.com/en/docs/vpc-peering/reference-content/understanding-vpc-peering
    evidence_items:
    - id: ev-scaleway-vpc-peering
      url: https://www.scaleway.com/en/docs/vpc-peering/reference-content/understanding-vpc-peering
      title: Understanding VPC Peering | Scaleway Documentation
      source_class: technical
      quote: VPCs do not need to be in the same Scaleway Organization or Project in
        order to be peered. VPC Peering lets you connect a Scaleway VPCs with any
        other Scaleway VPC, whether it is in the same Project or Organization, or
        a different one. The only restrictions are that the two VPCs must be in the
        same Scaleway region, and must not contain Private Networks with overlapping
        CIDR ranges.
      retrieved_at: '2026-09-23T04:16:26.261739+00:00'
      content_hash: sha256:cf6bd0ac1e927ca6886bb522f744f6b7103b4f436d63713a7f0e183aa9fd158c
      applicability:
        offering: public
        regions:
        - fr-par
        services:
        - vpc
        edition: standard
    - id: ev-scaleway-vpc-peering-transitive
      url: https://www.scaleway.com/en/docs/vpc-peering/reference-content/understanding-vpc-peering
      title: Understanding VPC Peering | Scaleway Documentation
      source_class: technical
      quote: Transitive peering is limited to four chained VPCs (three peering connectors).
        It is disabled by default and must be enabled on the intermediary VPC at its
        creation. This setting cannot be disabled afterward.
      retrieved_at: '2026-09-23T04:16:26.261739+00:00'
      content_hash: sha256:cf6bd0ac1e927ca6886bb522f744f6b7103b4f436d63713a7f0e183aa9fd158c
      applicability:
        offering: public
        regions:
