  net.waf:
    status: assessed
    score: 2
    evidence: 'Scaleway offers a managed Web Application Firewall (WAF) through its
      Edge Services pipeline. The service leverages the OWASP Core Rule Set (CRS)
      and allows tenants to configure paranoia levels from 1 to 4, with options for
      either log-only or block modes. However, custom rule authoring is highly limited:
      tenants can only set up to 100 exclusions using Path regex and HTTP request
      method filters to bypass WAF entirely. Advanced options like custom rules with
      complex match conditions (geo, IP reputation, header matching, client rate limiting)
      and bot management (bot detection, CAPTCHA challenges) are not available, which
      aligns with L2 requirements but prevents the service from meeting L3.'
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/edge-services/reference-content/understanding-waf
      title: https://www.scaleway.com/en/docs/edge-services/reference-content/understanding-waf
