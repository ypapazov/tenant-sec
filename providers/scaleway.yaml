  gov.tagging-governance:
    status: assessed
    score: 0
    evidence: Scaleway does not provide any platform-native tagging or labeling governance
      mechanisms. Tags on resources (such as Instances or Kubernetes clusters) are
      optional metadata with no policy engine to mandate tags during creation, validate
      tag formats, or support inheritance from Project/Organization to resources.
      In addition, Scaleway's Cost Manager does not support cost allocation or filtering
      by tags, and is limited to Period, Category, Product, and Project filters. While
      a tenant can build custom compliance loops (L1) using Scaleway APIs and Serverless
      Functions to scan and notify owners of untagged resources, the native platform
      posture is completely devoid of managed tag policies, matching L0.
