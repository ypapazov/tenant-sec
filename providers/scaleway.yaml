  data.deletion-guarantees:
    status: assessed
    score: 1
    evidence: Scaleway supports tenant-driven crypto-shredding capabilities. In Key
      Manager, tenants can schedule customer-managed keys for permanent deletion,
      which occurs after a 7-day retention period. In Object Storage, an HDS-compliant
      deletion method encrypts uploaded objects with a dedicated key that is instantly
      deleted upon receiving an object deletion request, ensuring data is unrecoverable
      immediately even before physical chunks are purged. However, there is no evidence
      of a platform-wide data deletion policy timeline or physical media sanitization
      attestations, which limits the assessment to L1.
