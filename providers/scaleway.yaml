  log.immutability:
    status: assessed
    score: 2
    evidence: Scaleway achieves Level 2 maturity for log immutability. Through Scaleway
      Object Storage, users can enable Object Lock in Compliance Mode. This prevents
      anyone, including administrators and the Organization owner, from deleting or
      modifying objects (logs) within the retention period, and the lock period cannot
      be shortened. Scaleway's Audit Trail service can be configured to export logs
      directly to an Object Storage bucket configured with Object Lock. However, because
      Audit Trail exports are managed configurations rather than immutable pipelines,
      an administrator can delete or modify the export pipeline itself (for example,
      by deleting the export configuration in the console), which matches the Level
      2 limitation where logs could be redirected or stopped.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/object-storage/how-to/use-object-lock
      title: https://www.scaleway.com/en/docs/object-storage/how-to/use-object-lock
