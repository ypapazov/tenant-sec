        Set. Custom rule authoring is limited only to path/method-based exclusions
        that bypass WAF entirely, and bot management is not available.
      claim_ids:
      - cl-scaleway-waf-managed-owasp
      - cl-scaleway-waf-custom-rules-limitations
      - cl-scaleway-waf-no-bot-management
    - level: 3
      met: false
      reasoning: Scaleway does not support complex custom rule authoring (such as
        geography, IP reputation, header matching, or per-client rate limiting), nor
        does it offer bot management (CAPTCHA challenges, bot detection), failing
        the L3 criteria.
      claim_ids:
      - cl-scaleway-waf-custom-rules-limitations
      - cl-scaleway-waf-no-bot-management
