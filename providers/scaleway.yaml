  enc.hsm-backing:
    status: assessed
    score: 0
    evidence: Scaleway Key Manager is implemented in software only, with key generation
      and cryptographic operations running on standard virtualized infrastructure.
      Official documentation indicates that keys are generated using a software Cryptographically
      Secure Pseudorandom Number Generator (CSPRNG) based on modern Linux kernels
      drawing entropy from /dev/urandom and AMD64 CPU instructions (RDSEED/RDRAND),
      rather than an HSM. There is no mention of FIPS 140-2/3 validated Hardware Security
      Modules (HSMs) backing the standard KMS, and Scaleway does not offer a managed
      single-tenant dedicated HSM option.
