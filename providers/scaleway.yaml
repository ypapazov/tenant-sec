  # ── Incident Response ─────────────────────────────────────────────────────

  incident.forensic-access:
    score: 1
    evidence: >
      VM disk snapshots can be created while instances are running. Snapshots
      can be copied to a separate project for isolated forensic analysis.
      However, VPC traffic mirroring (packet capture) is not available
      as a managed feature. Memory dumps must be performed manually within
      a running instance. No automated instance quarantine / isolation
      triggered by security events.
    verified_at: "2026-01-28"

  incident.notification-sla:
    score: 2
    evidence: >
      Scaleway publishes security advisories and incident reports on their
      trust center (status.scaleway.com). As a GDPR-subject company,
      Scaleway has contractual obligations for data breach notification
      within 72 hours. However, targeted notification for specific affected
      tenants (rather than general announcements) is limited. No published
      SLA for advance notification of vulnerabilities requiring tenant action.
    verified_at: "2026-01-28"

  incident.automated-response:
    score: 1
    evidence: >
      No native security-specific automated response capability. Cockpit
      alert webhooks can trigger external automation (Zapier, custom webhooks).
      Tenants can build event-driven response pipelines using Scaleway
      Functions triggered by logs/metrics. No pre-built security response
      playbooks from Scaleway. No SOAR integration.
    verified_at: "2026-01-28"

  incident.availability-zones:
    score: 2
    evidence: >
      Scaleway's PAR region (Paris) has two distinct AZs (PAR-1, PAR-2,
      PAR-3 in newer infrastructure). AZ independence is documented at the
      network and power level. Multi-AZ deployment is supported and
      documented for Load Balancers and RDB. Cross-region failover requires
      tenant-managed replication. Three AZs are available in PAR but not
      in all Scaleway regions (AMS and WAW may have fewer).
    verified_at: "2026-01-28"

  incident.resilience-testing:
    score: 0
    evidence: >
      No managed chaos or resilience testing tooling from Scaleway. Tenants
      must use third-party tools (Chaos Monkey, LitmusChaos) or manual
      procedures (stopping instances, blocking security group rules) to
      test resilience. No native fault injection API.
    verified_at: "2026-01-28"

