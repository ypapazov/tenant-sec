  compute.runtime-security:
    status: assessed
    score: 1
    evidence: Scaleway Instances run standard OS images with root access, supporting
      standard package management and custom agent installation (L1). They do not
      offer managed Shielded VM features such as tenant-configurable Secure Boot,
      vTPM, or startup integrity monitoring (L2/L3), as advanced settings are limited
      to local boot, rescue boot, and boot volume selection. Other compute services
      (Kapsule, Containers, Functions) are marked unknown due to a lack of specific
      documentation.
    verified_at: '2026-09-23'
    confidence: high
    references:
    - url: https://www.scaleway.com/en/docs/compute/instances/how-to/use-boot-modes/
