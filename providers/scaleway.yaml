        sticky sessions) on the traffic it has decrypted.

        - Depending on your Load Balancer''s backend configuration, and whether your
        backend server also has a certificate, traffic can also be encrypted as it
        flows between the Load Balancer and the backend server (SSL bridging), or
        else left unencrypted (SSL offloading)

        You may not need to add an SSL/TLS certificate to your Load Balancer''s frontend
        if:

        - Your backend server has an SSL/TLS certificate, and you want to use an SSL
        passthrough setup for secure connections.'
