      url: https://www.scaleway.com/en/docs/use-cases/application-hosting/high-availability-resilience
      title: High availability and resilience in application hosting | Scaleway Documentation
      source_class: technical
      quote: 'When to distribute resources across AZs

        We recommend using multiple AZs within the same region when:

        - You need high availability and fault tolerance against localized failures
        such as power outages, network issues or hardware failures.

        - Your application must meet uptime SLAs (99.9% or higher, for example).

        - You want low-latency data replication and fast failover.

        - You’re running production workloads that do not require global reach.'
      retrieved_at: '2026-09-23T04:08:08.547011+00:00'
      content_hash: sha256:9e643d72cfaa5f7d3c3c732e63fe590b6a4902bf7fe6948a5e3ce117786719f1
      applicability:
        offering: public
        regions:
        - fr-par
        services:
        - vpc
        - load-balancer
        - object-storage
        edition: standard
    - id: ev-scaleway-kapsule-multiaz
      url: https://www.scaleway.com/en/docs/kubernetes/reference-content/multi-az-clusters
      title: Ensuring resiliency with multi-AZ Kubernetes clusters | Scaleway Documentation
      source_class: technical
      quote: "Each node pool should correspond to a different AZ for high availability.\n\
        # Terraform/OpenTofu configuration for Scaleway Kapsule cluster and node pools\n\
        resource \"scaleway_k8s_cluster\" \"kapsule_multi_az\" {\n  name = \"kapsule-multi-az\"\
        \n  tags = [\"multi-az\"]\n  type    = \"kapsule\"\n  version = \"1.28\"\n\
        \  cni     = \"cilium\"\n  delete_additional_resources = true\n  autoscaler_config\
        \ {\n    ignore_daemonsets_utilization = true\n    balance_similar_node_groups\
        \   = true\n  }\n  auto_upgrade {\n    enable                        = true\n\
        \    maintenance_window_day        = \"sunday\"\n    maintenance_window_start_hour\
        \ = 2\n  }\n  private_network_id = scaleway_vpc_private_network.pn_multi_az.id\n\
        }\nresource \"scaleway_k8s_pool\" \"pool-multi-az\" {\n  for_each = {\n  \
        \  \"fr-par-1\" = 1,\n    \"fr-par-2\" = 2,\n    \"fr-par-3\" = 3\n  }\n \
        \ name                   = \"pool-${each.key}\"\n  zone                  \
        \ = each.key\n  tags                   = [\"multi-az\"]\n  cluster_id    \
        \         = scaleway_k8s_cluster.kapsule_multi_az.id\n  node_type        \
        \      = \"PRO2-XXS\"\n  size                   = 2\n  min_size          \
        \     = 2\n  max_size               = 3\n  autoscaling            = true\n\
        \  autohealing            = true\n  container_runtime"
      retrieved_at: '2026-09-23T04:08:08.547011+00:00'
      content_hash: sha256:585b34535c2070ae8d111088e52c9498855e4a151591cdf6f7616264bd6a659f
