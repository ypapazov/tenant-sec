        services:
        - vpc
        edition: standard
    - id: ev-scaleway-vpc-peering-routes
      url: https://www.scaleway.com/en/docs/vpc-peering/reference-content/understanding-vpc-peering
      title: Understanding VPC Peering | Scaleway Documentation
      source_class: technical
      quote: Each side of the peering connection must independently create their own
        custom routes in their VPC's route table - these are not shared automatically
        between the peered VPCs.
      retrieved_at: '2026-09-23T04:16:26.261739+00:00'
      content_hash: sha256:cf6bd0ac1e927ca6886bb522f744f6b7103b4f436d63713a7f0e183aa9fd158c
