  gov.quotas-service-control:
    status: assessed
    score: 0
    evidence: Scaleway does not offer Service Control Policies (SCPs) or Organization
      Policies to restrict accessible services, regions, or resource types at the
      organization or project level. Service and region restrictions cannot be globally
      enforced via block-lists or allow-lists that override standard IAM policies.
      Although Scaleway IAM supports Common Expression Language (CEL) conditions to
      restrict access based on attributes like 'resource.locality', these resource-level
      conditions are limited to select products, only apply within ALLOW rules (since
      Scaleway IAM has no DENY rules), and can be bypassed if a principal has broader
      permissions (such as 'AllProductsFullAccess') via another policy. Additionally,
      Scaleway's Organization Quotas are provider-defined limits that cannot be self-managed
      or set to zero by the tenant to enforce service restrictions. Consequently,
      service and regional restriction relies entirely on granular IAM custom policy
      management per principal, which matches the criteria for L0.
