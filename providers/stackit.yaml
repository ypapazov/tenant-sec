  iam.directory-integration:
    status: assessed
    score: 2
    evidence: 'STACKIT provides a managed SCIMv2 endpoint for user and group synchronization.
      This enables provisioning, deprovisioning via user status, and management of
      group memberships. It also supports federation with external Identity Providers
      via SAML 2.0 and OIDC 1.0, including just-in-time (JIT) user creation and standard
      attribute mapping. However, research confirms several limitations that prevent
      it from reaching L3: synchronization is one-way from the directory to the STACKIT
      IdP, with no documented bidirectional sync or writeback. The attribute mapping
      is limited to predefined SCIM schemas without explicit support for arbitrary
      custom attributes. There is no explicit support for group nesting, and the synchronization
      process is client-driven, implying periodic rather than real-time or event-driven
      updates. Additionally, while federation from multiple sources is supported for
      authentication, the SCIM provisioning endpoint appears intended for a single
      primary directory, not simultaneous provisioning from multiple distinct sources.'
