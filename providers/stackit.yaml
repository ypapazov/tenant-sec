      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: 'Object Lock (WORM Protection) in Object Storage

        Last updated on

        STACKIT Object Storage supports S3 Object Lock, which provides Write Once
        Read Many (WORM) protection for your objects. Once Object Lock is active on
        a bucket, objects stored in that bucket can be protected against deletion
        or overwriting for a defined retention period.

        Object Lock is useful for regulatory compliance, legal holds, and any scenario
        where data immutability is required.'
      retrieved_at: '2026-10-21T12:19:03.911376+00:00'
      content_hash: sha256:41ba4e368a75da062fd141fe12041c862ba917ed489765d3cc71812421c15c12
      applicability:
