  incident.forensic-access:
    status: assessed
    score: 2
    evidence: STACKIT Compute Engine supports the creation of disk snapshots for servers
      and volumes without requiring instance shutdown, implying 'hot' snapshot capability.
      While not a dedicated feature for cross-account forensic isolation, the IaaS-API
      allows for downloading and uploading snapshots, providing the technical means
      to transfer copies to isolated environments. SSH access is available, enabling
      manual forensic data capture. However, there is no documented support for control
      plane-initiated in-memory forensic capture, VPC traffic mirroring (full packet
      capture), automated instance isolation on security findings, or integration
      with incident response workflows.
