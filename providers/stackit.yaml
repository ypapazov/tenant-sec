  compute.image-management:
    status: assessed
    score: mixed
    summary: STACKIT offers a managed Container Registry with integrated vulnerability
      scanning for Kubernetes Engine. For Compute Engine, customers can upload their
      own VM images, but there is no provider-managed registry or scanning service.
      Most other services are not applicable to image and artifact management.
    services:
      compute-engine:
        status: assessed
        evidence: STACKIT Compute Engine allows customers to upload and use their
          own VM images. However, the provider does not offer a dedicated managed
          private VM image registry service, nor integrated vulnerability scanning,
          signed image enforcement, or org-level policies for these VM images. This
          aligns with L1, where private image management is achievable through tenant
          self-managed solutions with no managed provider service.
        confidence: high
        score: 1
        references:
        - url: https://stackit.com/en/products/compute-engine/stackit-compute-engine
          title: stackit.com documentation
        - url: https://stackit.com/en/learn/knowledge/virtual-machine
          title: stackit.com documentation
      kubernetes-engine:
        status: assessed
        evidence: STACKIT Container Registry provides a fully managed private container
          registry service with integrated vulnerability scanning powered by Trivy.
          While access control is granular at the project level, the documentation
          does not explicitly detail signed image enforcement for Kubernetes workloads
          or org-level policies to mandate registry sources or block deployments based
          on vulnerabilities, which aligns with the limitations described in L2.
        confidence: high
        score: 2
        references:
