    evidence: STACKIT implements Role-Based Access Control (RBAC) with an additive
      access model for role bindings, requiring explicit removal for revocation. The
      platform does not offer native Just-in-Time (JIT) access elevation, time-bound
      privilege grants, approval workflows for sensitive operations, or platform-managed
      break-glass procedures for human users. Workload Identity Federation (WIF) provides
      short-lived tokens but is exclusively for service accounts, not for human privileged
