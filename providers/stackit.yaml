    - level: 1
      met: false
      reasoning: While a tenant might potentially build custom logic outside of STACKIT
        IAM, the documentation does not provide any specific hooks, APIs, or recommended
        integration patterns (e.g., for custom authorizers or external policy engines)
        that would enable ABAC through tenant-built logic using STACKIT's native IAM
        for attribute evaluation. The system is described as pure RBAC without native
        attribute evaluation.
      claim_ids: []
    - level: 2
      met: false
      reasoning: There are no native tag-based or attribute-based conditions documented
