      source_class: technical
      quote: "Service coverage\nSection titled “Service coverage”\nMost managed services\
        \ in STACKIT generate audit events when a user or system modifies a resource.\n\
        | Category | Specific products or services | Examples of logged events | \n\
        |---|---|---|\n| Compute & Runtime | STACKIT Kubernetes Engine (SKE), Compute\
        \ Engine | Creating or deleting clusters, scaling VM instances, or changing\
        \ firewall rules. | \n| Databases | PostgreSQL Flex, MongoDB Flex, MariaDB,\
        \ SQLServer Flex, Redis | Creating database instances, manual backups, or\
        \ changing access credentials. | \n| Security & Identity | STACKIT IAM, KMS,\
        \ Secrets Manager | Role assignments (RBAC), rotating keys, or creating service\
        \ accounts. | \n| Storage | Object Storage, Block Storage | Creating buckets,\
        \ changing access permissions (ACLs), or deleting volumes. | \n| Network |\
        \ Load Balancer, DNS | Creating listeners, updating DNS records, or modifying\
        \ ingress rules. | \n| Management | Resource Manager, Billing | Creating or\
        \ deleting projects, and changing billing account details. |"
