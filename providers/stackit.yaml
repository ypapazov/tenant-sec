  iam.multi-tenancy-isolation:
    status: assessed
    score: 2
    evidence: STACKIT implements multi-tenancy isolation through 'Projects' which
      serve as organizational and security boundaries, each with independent IP address
      spaces, security policies, and resource quotas. Projects are isolated by default,
      and cross-project communication requires explicit configuration. Programmatic
      provisioning of new projects is supported via the `stackit-cli`, and baseline
      security configurations can be automatically applied using the Terraform-based
      STACKIT Landing Zone Accelerator. Independent quotas per project are enforced,
      and billing is reported on a project-specific basis within invoices, with a
      consolidated view available in the portal. Cross-environment access is governed
      by explicit policy grants using Security Groups. However, STACKIT currently
      supports only a single level of folder hierarchy for organizing projects, which
      represents a fixed hierarchy depth as described in the L2 criteria.
    verified_at: '2026-10-26'
    confidence: high
    references:
