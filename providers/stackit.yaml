  enc.external-key-management:
    status: assessed
    score: 0
    evidence: STACKIT offers Client-Side Encryption (CSE) for its 'Workspace by STACKIT'
      product, which encrypts data on user devices. However, the documentation consistently
      states that STACKIT manages the encryption keys for this service within its
      German data centers. Similarly, STACKIT's general-purpose Key Management Service
      (KMS) supports 'Bring Your Own Key' (BYOK) functionality, but this involves
      uploading/importing keys into the STACKIT KMS, where they are then managed by
      STACKIT. The control defines External Key Management (EKM) as the ability to
      use keys that 'never enter the provider's infrastructure' and where 'the key
      material resides entirely outside the cloud provider.' Since all key material
      for both CSE and KMS, once in use, resides within STACKIT's infrastructure and
      is managed by STACKIT, neither offering meets the fundamental definition of
      external key management as per this control.
