    evidence_items:
    - id: ev-security-groups-egress
      url: https://docs.stackit.cloud/products/network/core-networking/basics/concepts
      title: Concepts | Docs
      source_class: technical
      quote: 'Security Groups act as virtual firewalls that control traffic at the
        network interface level. They define rules for both inbound (ingress) and
        outbound (egress) traffic based on IP addresses, ports, and protocols.

        Key characteristics of Security Groups:

        - Stateful operation – When you allow incoming traffic, the response is automatically
        allowed, regardless of outbound rules

        - Default deny for ingress – All incoming traffic is blocked unless explicitly
        permitted

        - Default allow for egress – All outgoing traffic is permitted unless explicitly
        blocked

        - Rule-based filtering – Define precise rules based on source/destination
        IP, port ranges, and protocols'
      retrieved_at: '2026-10-23T11:56:14.918824+00:00'
      content_hash: sha256:bd1f0533e543509eb7e6cb6b6daea313c1d4bc8af9cbb9dc9d1bea754dab0a5e
