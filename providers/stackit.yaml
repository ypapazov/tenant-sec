  iam.external-idp-federation:
    status: assessed
    score: 2
    evidence: 'STACKIT provides native federation support for SAML 2.0 and OIDC protocols.
      Programmatic access for service accounts is supported via Workload Identity
      Federation (WIF) using OIDC. However, there are several limitations: IdP-initiated
      flows are not supported for SAML 2.0. Configuration for both protocols requires
      opening a support ticket, indicating a semi-managed process rather than a fully
      self-service wizard. While SCIM v2 is supported for synchronizing users and
      groups, the explicit mapping of federated IdP group memberships to STACKIT roles
      for fine-grained authorization is not clearly documented. It is also not explicitly
      confirmed whether multiple distinct external IdPs can be configured and used
      simultaneously for a single tenant.'
