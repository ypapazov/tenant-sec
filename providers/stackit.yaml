      url: https://docs.stackit.cloud/platform/access-and-identity/service-accounts/authentication-flows
      title: Service account authentication | Docs
      source_class: technical
      quote: Section titled “Workload Identity Federation flow (recommended)” The
        Workload Identity Federation flow is the recommended method. It allows a service
        account to authenticate by using short-lived tokens acquired from an external
        OIDC issuer. You can acquire short-lived tokens without static keys.
      retrieved_at: '2026-10-22T23:03:18.121965+00:00'
      content_hash: sha256:a212d614859d0e5cd04cc2b3b13475ceaff1af97774ce84d1bff47f6081914b7
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-wif-external-idp
      url: https://docs.stackit.cloud/platform/access-and-identity/service-accounts/authentication-flows
      title: Service account authentication | Docs
      source_class: technical
      quote: 'Link your service account to an external OIDC issuer by configuring
        a federated identity provider. Tokens from the external issuer are accepted
        only when the issuer URL matches and all assertion conditions are met.

        - The workload (such as a CI runner) requests a token from the external IDP
        (such as GitHub).

        - The external IDP issues a token to the workload.

        - The workload requests a token from the STACKIT IDP, presenting this external
        token as a credential.

        - The STACKIT IDP validates the token against the configured issuer URL and
        assertions (for example, checking whether the subjectEQUALS a specific value).

        - After successful verification, the STACKIT IDP issues a short-lived access
        token to the workload.

        - The workload uses the short-lived access token to access the resource.'
      retrieved_at: '2026-10-22T23:03:18.121965+00:00'
      content_hash: sha256:a212d614859d0e5cd04cc2b3b13475ceaff1af97774ce84d1bff47f6081914b7
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
