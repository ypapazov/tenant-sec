  iam.credential-management:
    status: assessed
    score: 2
    evidence: STACKIT provides managed credential features for service account keys,
      including the option to set an expiry date at creation and modify it on existing
      keys. API access tokens obtained through the key flow are short-lived, minimizing
      the exposure window. Workload Identity Federation allows authentication without
      static service account keys. However, the platform does not offer automated
      rotation for service account private keys, explicitly stating this is the user's
      responsibility. The documentation does not describe mechanisms for detecting
      unused service account keys or for auditing their usage patterns, nor does it
      detail policy enforcement to prevent long-lived keys for human identities or
      mandate specific expiry periods.
    verified_at: '2026-10-26'
    confidence: low
    references:
    - url: https://docs.stackit.cloud/platform/access-and-identity/service-accounts/how-tos/manage-service-account-keys
