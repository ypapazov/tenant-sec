      title: Understand STACKIT Audit Log | STACKIT Documentation
      source_class: technical
      quote: 'Most managed services in STACKIT generate audit events when a user or
        system modifies a resource.

        | Category | Specific products or services | Examples of logged events |

        |---|---|---|

        | Compute & Runtime | STACKIT Kubernetes Engine (SKE), Compute Engine | Creating
        or deleting clusters, scaling VM instances, or changing firewall rules. |

        | Databases | PostgreSQL Flex, MongoDB Flex, MariaDB, SQLServer Flex, Redis
        | Creating database instances, manual backups, or changing access credentials.
        |

        | Security & Identity | STACKIT IAM, KMS, Secrets Manager | Role assignments
        (RBAC), rotating keys, or creating service accounts. |

        | Storage | Object Storage, Block Storage | Creating buckets, changing access
        permissions (ACLs), or deleting volumes. |

        | Network | Load Balancer, DNS | Creating listeners, updating DNS records,
        or modifying ingress rules. |

        | Management | Resource Manager, Billing | Creating or deleting projects,
        and changing billing account details. |'
