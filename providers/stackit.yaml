    - id: ev-key-flow-mechanism
      url: https://docs.stackit.cloud/platform/access-and-identity/service-accounts/authentication-flows
      title: Service account authentication | Docs
      source_class: technical
      quote: 'The key flow separates a long-lived private key from the short-lived
        access tokens used for API requests.

        - Your application (the client) uses its private RSA key to sign a JSON Web
        Token (JWT). The private key is kept secret and is never sent over the network.

        - The application sends the signed JWT to the STACKIT server to request a
        temporary access token.

        - The STACKIT server uses the corresponding public key to verify the authenticity
        and integrity of the JWT.

        - After successful verification, the STACKIT Server issues a short-lived access
        token.

        - Your application uses the temporary access token as a bearer token for API
        requests until it expires. After expiry, request a new token by repeating
        the JWT exchange.'
      retrieved_at: '2026-10-22T23:03:18.121965+00:00'
      content_hash: sha256:a212d614859d0e5cd04cc2b3b13475ceaff1af97774ce84d1bff47f6081914b7
