  iam.service-identity:
    status: assessed
    score: 2
    evidence: STACKIT provides Workload Identity Federation (WIF) and Key Flow for
      service identity, both utilizing short-lived tokens and avoiding static keys.
      WIF is the recommended method, supports OIDC-based cross-cloud federation (e.g.,
      GitHub Actions, external K8s), and is managed via the STACKIT Portal. It is
      natively integrated and provides automated rotation for STACKIT Kubernetes Engine
      (SKE) containers. However, the OIDC-based WIF flow is not explicitly documented
      or shown to be available for all major compute surfaces, specifically for virtual
      machines (where a separate metadata service provides instance tokens) and serverless
      functions. This limitation in comprehensive coverage across all major compute
      surfaces prevents a full L3 score.
