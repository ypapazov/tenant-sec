  log.immutability:
    status: assessed
    score: 2
    evidence: STACKIT Object Storage provides S3 Object Lock, which enables Write
      Once Read Many (WORM) protection. This feature, when configured in Compliance
      mode, prevents deletion or overwriting of objects until their retention period
      expires, and the lock cannot be shortened or removed. Object Lock can be enabled
      at bucket creation, and a project-level Compliance Lock prevents project deletion
      if locked buckets exist. Audit logs can be routed to Object Storage via the
      STACKIT Telemetry Router. However, the Telemetry Router is a flexible forwarder,
      not a dedicated audit log vault, and there are no documented preventative controls
      to stop a privileged administrator from redirecting the log stream to a non-immutable
      destination. Furthermore, the documentation does not explicitly confirm that
      failed attempts to modify or delete objects under compliance lock generate specific
      meta-audit events as required for L3. The maximum retention period is 365 days.
    verified_at: '2026-10-26'
    confidence: high
    references:
    - url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
    - url: https://docs.stackit.cloud/products/logging-and-monitoring/telemetry-router/basics/overview
      title: Overview | Telemetry Router | Docs
    evidence_items:
    - id: ev-obj-lock-worm
      url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: STACKIT Object Storage supports S3 Object Lock, which provides Write
        Once Read Many (WORM) protection for your objects. Once Object Lock is active
        on a bucket, objects stored in that bucket can be protected against deletion
        or overwriting for a defined retention period. Object Lock is useful for regulatory
        compliance, legal holds, and any scenario where data immutability is required.
      retrieved_at: '2026-10-23T11:41:21.525419+00:00'
      content_hash: sha256:41ba4e368a75da062fd141fe12041c862ba917ed489765d3cc71812421c15c12
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-obj-lock-project-compliance
      url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: 'Level 1: Project-level compliance lock

        Section titled “Level 1: Project-level compliance lock”

        Before you can use Object Lock on any bucket, you must enable the Compliance
        Lock on the project level with the STACKIT API. This is the prerequisite for
        all Object Lock functionality within the project.

        - Enabled/disabled with POST /DELETE /v1/project/{projectId}/compliance-lock

        - The maximum retention period for projects is 365 days.

        - The Compliance Lock can only be disabled if no buckets with Object Lock
        exist in the project.

        - A project with an active Compliance Lock cannot be deleted (HTTP 409). You
        must deactivate the Compliance Lock first.

        For details, see Manage Object Lock.'
      retrieved_at: '2026-10-23T11:41:21.525419+00:00'
      content_hash: sha256:41ba4e368a75da062fd141fe12041c862ba917ed489765d3cc71812421c15c12
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-obj-lock-bucket-creation
      url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: 'Level 2: bucket-level Object Lock

        Section titled “Level 2: bucket-level Object Lock”

        Once the Compliance Lock is active, individual buckets can be created with
        Object Lock enabled.

        - Object Lock can only be enabled at bucket creation time, not afterwards

        - Object Lock cannot be disabled once enabled on a bucket

        - You can configure a default retention policy for the bucket, which automatically
        applies to every object uploaded to that bucket

        For details, see Manage Object Lock and Configure Default Retention.'
      retrieved_at: '2026-10-23T11:41:21.525419+00:00'
      content_hash: sha256:41ba4e368a75da062fd141fe12041c862ba917ed489765d3cc71812421c15c12
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-obj-lock-compliance-mode
      url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: 'Retention modes

        Section titled “Retention modes”

        Object Lock supports two retention modes. The following table describes how
        each mode affects the retention period of individual objects:

        | Mode | Description | Retention can be shortened? | Retention extendable?
        | Retention removable? |

        |---|---|---|---|---|

        | COMPLIANCE | Strictest protection. No one can delete or overwrite the object
        until the retention period expires. | No | Yes | No |

        | GOVERNANCE | Objects are protected, but users with special S3 permissions
        ( s3:BypassGovernanceRetention ) can modify or delete them before the retention
        period expires. | With bypass | Yes | With bypass |

        Choose COMPLIANCE mode when you need to meet regulatory requirements that
        mandate immutable storage. Choose GOVERNANCE mode when you need protection
        against accidental deletion but want to retain the ability to remove objects
        in exceptional cases.'
      retrieved_at: '2026-10-23T11:41:21.525419+00:00'
      content_hash: sha256:41ba4e368a75da062fd141fe12041c862ba917ed489765d3cc71812421c15c12
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-obj-lock-max-retention
      url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: 'Constraints and limits

        Section titled “Constraints and limits”

        | Parameter | Value |

        |---|---|

        | Maximum retention period | 365 days |

        | Object Lock activation | Only at bucket creation time |

        | Object Lock deactivation | Not possible once enabled on a bucket |

