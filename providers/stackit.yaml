      reasoning: STACKIT IAM is explicitly stated to use a Role-Based Access Control
        (RBAC) model. Permissions are granted via roles that are assigned at the organization,
        folder, or project level. There is no support for fine-grained resource-level
        policies, nor the ability to condition access based on resource attributes,
        tags, or request context. This directly aligns with the L0 criteria.
      claim_ids:
