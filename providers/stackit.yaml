      title: Application Load Balancer (ALB) Ingress | Docs - the STACKIT Docs
      source_class: technical
      quote: 'To expose your application securely through HTTPS, the ALB Ingress controller
        supports TLS offloading using standard Kubernetes TLS Secrets.

        This functionality integrates seamlessly with tools like cert-manager to automate
        certificate provisioning and renewal. When a Secret is referenced in the Ingress
        tls block, the controller automatically handles the certificate deployment
        on the ALB. It continuously monitors the Secret for changes, such as during
        automated certificate rotation, and updates the ALB without manual intervention.
        Once a TLS Secret is no longer referenced by any Ingress on that ALB, it is
        automatically removed.'
