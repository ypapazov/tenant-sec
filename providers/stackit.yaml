      title: Service account authentication | Docs
      source_class: technical
      quote: The key flow uses a cryptographic challenge-response mechanism based
        on a service account key and an RSA key pair to authenticate applications.
        This method uses short-lived tokens, which significantly reduces security
        risks.
      retrieved_at: '2026-10-22T23:03:18.121965+00:00'
      content_hash: sha256:a212d614859d0e5cd04cc2b3b13475ceaff1af97774ce84d1bff47f6081914b7
