  incident.availability-zones:
    status: assessed
    score: 2
    evidence: STACKIT regions provide at least three physically independent Availability
      Zones (AZs) with formal independence guarantees, including separate power, cooling,
      and network infrastructure. Multi-AZ deployment is supported for major services
      like Compute Engine and Block Storage via 'Metro AZ', which offers automatic
      failover within a region. However, 'Metro AZ' is not available for all services
      and is considered less predictable for high-availability workloads, with recommendations
      to use Single AZ deployments and application-level redundancy for services like
      managed databases. STACKIT operates in two distinct regions (Germany and Austria),
      and offers Disaster Recovery as a Service (DRaaS) for managed geo-redundant
      active-passive failover between regions. However, explicit blast radius analysis
      documentation is not available, and multi-AZ is not the default or strongly
      guided configuration for all managed services.
    verified_at: '2026-10-26'
    confidence: low
    references:
    - url: https://docs.stackit.cloud/products/compute-engine/server/basics/regions-and-availability-zones
      title: Regions and availability zones | Docs
    - url: https://docs.stackit.cloud/platform/regions
      title: Regions | Docs
    evidence_items:
