      url: https://docs.stackit.cloud/platform/access-and-identity/service-accounts/authentication-flows
      title: Service account authentication | Docs
      source_class: technical
      quote: Manage federated identity providers in the STACKIT Portal under IAM and
        Management > Service accounts. Define the provider name, the exact issuer
