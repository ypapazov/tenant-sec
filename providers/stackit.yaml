      url: https://docs.stackit.cloud/products/network/core-networking/basics/concepts
      title: Concepts | Docs
      source_class: technical
      quote: 'Virtual Networks and Network Isolation

        Section titled “Virtual Networks and Network Isolation”

        At the heart of Core Networking is the concept of Virtual Networks-SDNs that
        provide complete isolation between different projects and customers. Each
        Virtual Network operates independently with its own IP address space, routing
        tables, and security policies.

        When you create a Virtual Network, you define an IP address range (CIDR block)
        that determines the available addresses for your resources. All resources
        within the same Virtual Network can communicate with each other by default,
        while traffic between different Virtual Networks is blocked unless explicitly
        configured.

        This isolation ensures that:

        - Your network traffic remains private and secure

        - You have complete control over which resources can communicate

        - Compliance and security requirements are easier to meet'
