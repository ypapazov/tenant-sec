  enc.key-lifecycle:
    status: assessed
    score: 1
    evidence: STACKIT Key Management Service (KMS) is a managed service that includes
      'Key Rotation' and 'key lifecycle management'. However, key rotation is explicitly
      a manual process, achievable via API or UI, and there is no platform-managed
      automatic rotation schedule. This means tenants can build automation around
      the API (meeting L1). The service does provide key versioning where older versions
      remain accessible for decryption after rotation. While 'scheduled deletion'
      is mentioned, the documentation lacks details on configurable grace periods,
      pending deletion states, or cryptographic shredding upon key material deletion.
      The absence of automatic rotation and these detailed L3 features places the
      service at L1.
    verified_at: '2026-10-26'
    confidence: low
