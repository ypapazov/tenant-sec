    evidence: STACKIT Telemetry Router provides native, fully managed streaming export
      of Audit Logs to external S3-compatible storage and SIEMs (Splunk, Elasticsearch).
      Data is routed via the OpenTelemetry Protocol (OTLP), a standard format. This
      meets criteria for native export to external destinations with streaming capabilities
      and a standard format. However, the Telemetry Router is explicitly limited to
      handling only Audit Logs; customers cannot send their own custom telemetry data
      (application logs, metrics, or traces) for export. Research confirms no alternative
      mechanisms exist within STACKIT for exporting data plane, application, or network
      flow logs to external destinations. STACKIT Logs centrally stores and analyzes
      server and application logs internally, but lacks external export capabilities.
      This partial coverage of log types (only control plane logs exportable, not
      application, data plane, or network flow logs) prevents it from reaching L3,
