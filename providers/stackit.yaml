  iam.mfa-enforcement:
    status: assessed
    score: 2
    evidence: STACKIT enforces multi-factor authentication (MFA) for all non-federated
      users accessing the STACKIT Portal (console). MFA enrollment is mandatory after
      a seven-day grace period. Supported MFA methods include TOTP-based authenticator
      apps and email. For federated users, MFA enforcement is managed by their external
      Identity Provider. The documentation does not provide details on MFA enforcement
      for programmatic access (CLI/API) for users, support for FIDO2/WebAuthn or hardware
      tokens, the availability of conditional access policies, or API-auditable compliance,
      preventing it from reaching L3.
    verified_at: '2026-10-26'
    confidence: low
    references:
