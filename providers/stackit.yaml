        services:
        - object-storage
        edition: standard
    - id: ev-project-level-lock
      url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: 'Level 1: Project-level compliance lock

        Section titled “Level 1: Project-level compliance lock”

        Before you can use Object Lock on any bucket, you must enable the Compliance
        Lock on the project level with the STACKIT API. This is the prerequisite for
        all Object Lock functionality within the project.

        - Enabled/disabled with POST /DELETE /v1/project/{projectId}/compliance-lock

        - The maximum retention period for projects is 365 days.

        - The Compliance Lock can only be disabled if no buckets with Object Lock
        exist in the project.

        - A project with an active Compliance Lock cannot be deleted (HTTP 409). You
        must deactivate the Compliance Lock first.

        For details, see Manage Object Lock.'
      retrieved_at: '2026-10-21T12:19:03.911376+00:00'
      content_hash: sha256:41ba4e368a75da062fd141fe12041c862ba917ed489765d3cc71812421c15c12
      applicability:
        offering: public
        regions:
        - eu01
        services:
        - object-storage
        edition: standard
    - id: ev-bucket-level-lock
      url: https://docs.stackit.cloud/products/storage/object-storage/basics/object-lock
      title: Object Lock (WORM Protection) in Object Storage | Docs
      source_class: technical
      quote: 'Level 2: bucket-level Object Lock

        Section titled “Level 2: bucket-level Object Lock”

        Once the Compliance Lock is active, individual buckets can be created with
        Object Lock enabled.

        - Object Lock can only be enabled at bucket creation time, not afterwards

        - Object Lock cannot be disabled once enabled on a bucket

        - You can configure a default retention policy for the bucket, which automatically
        applies to every object uploaded to that bucket

        For details, see Manage Object Lock and Configure Default Retention.'
      retrieved_at: '2026-10-21T12:19:03.911376+00:00'
      content_hash: sha256:41ba4e368a75da062fd141fe12041c862ba917ed489765d3cc71812421c15c12
