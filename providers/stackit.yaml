    criteria_results:
    - level: 0
      met: false
      reasoning: Log immutability is achievable within the platform through STACKIT
        Object Storage's Object Lock feature.
      claim_ids:
      - cl-worm-available
    - level: 1
      met: false
      reasoning: Log immutability is offered as a managed feature (Object Lock), not
        solely through tenant-built architecture requiring separate accounts.
      claim_ids:
      - cl-worm-available
    - level: 2
      met: true
      reasoning: Write-once storage (Object Lock in Compliance mode) is available
        and can be applied to log storage buckets (routed via Telemetry Router) to
        prevent deletion during a configurable retention period. While the lock itself
        in Compliance mode cannot be removed, an administrator could still redirect
        the audit log stream using the flexible Telemetry Router to a different, unprotected
        storage destination.
      claim_ids:
      - cl-worm-available
      - cl-compliance-mode-strong-immutability
      - cl-bucket-lock-immutable-after-creation
      - cl-router-forwards-audit-logs
      - cl-router-flexible-routing-to-object-storage
    - level: 3
      met: false
      reasoning: STACKIT does not provide a 'dedicated audit log vault' service where
        immutability is inherently enforced by the logging system itself, preventing
        redirection or bypass at the ingestion level. The Telemetry Router acts as
        a forwarder, not a vault, and while it routes to immutable storage, the overall
        system is not a dedicated, tamper-proof audit log vault. The maximum retention
        period of 365 days is also a limitation compared to typical L3 solutions.
      claim_ids:
      - cl-router-forwards-audit-logs
      - cl-router-flexible-routing-to-object-storage
      - cl-max-retention-365d
