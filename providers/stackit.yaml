      source_class: technical
      quote: 'STACKIT Network Area (SNA): Inter-Project Connectivity

        Section titled “STACKIT Network Area (SNA): Inter-Project Connectivity”

        STACKIT Network Area extends networking beyond a single project by connecting
        multiple projects within your organization at the network level. Instead of
        isolated projects that can only communicate via the public internet, SNA creates
        a private transfer network that links project routers together.

        Benefits of SNA:

        - Simplified microservices architectures across projects

        - Hybrid cloud enablement by providing a central connection point for on-premises
        networks

        - Enhanced security by avoiding public internet transit for inter-project
        communication

        - Automatic routing with no manual route table management required

        - Network-level isolation still maintained through Security Groups'
      retrieved_at: '2026-10-23T11:45:43.055321+00:00'
      content_hash: sha256:bd1f0533e543509eb7e6cb6b6daea313c1d4bc8af9cbb9dc9d1bea754dab0a5e
