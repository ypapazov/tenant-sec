    summary: STACKIT Object Storage provides robust object retention and immutability
      capabilities, including S3 Object Lock with both GOVERNANCE and COMPLIANCE modes,
      and a distinct Legal Hold feature. Project-level and bucket-level policies allow
      for strong controls over data immutability. However, explicit documentation
      on audit logging of all retention and hold changes, which is an L3 criterion,
      was not found.
