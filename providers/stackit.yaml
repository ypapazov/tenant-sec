    - id: ev-hybrid-cloud-connectivity-02
      url: https://docs.stackit.cloud/products/network/core-networking/basics/concepts
      title: Concepts | Docs
      source_class: technical
      quote: 'Hybrid Cloud Connectivity

        Section titled “Hybrid Cloud Connectivity”

        Connect your STACKIT projects to on-premises data centers using SNA as a central
        hub:

        - Establish VPN or MPLS connections to the SNA

        - Configure routing to make on-premises networks accessible

        - Apply consistent security policies across cloud and on-premises resources

        - Enable seamless workload migration between environments'
      retrieved_at: '2026-10-23T11:45:43.055321+00:00'
      content_hash: sha256:bd1f0533e543509eb7e6cb6b6daea313c1d4bc8af9cbb9dc9d1bea754dab0a5e
      applicability:
