    - id: ev-rbac-model
      url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
      source_class: technical
      quote: STACKIT uses Role Based Access Control (RBAC) to allow or deny access
        to different endpoints. In RBAC, a policy assigns a role to a subject for
        a specific resource.
      retrieved_at: '2026-10-22T20:22:15.548260+00:00'
      content_hash: sha256:09cbdbcf846c61565a291ce3bdaf9a0e4b63f322f117019c12b5170f2a7286be
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-permissions-roles
      url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
      source_class: technical
      quote: 'Permissions define the specific actions users can perform in your STACKIT
        environment. They are the lowest level in the RBAC model used by STACKIT.
        Every operation in your organization, whether run through the STACKIT Portal,
        API, or infrastructure tools, requires a specific permission. There is generally
        a one-to-one relationship between each permission and an API method.

        Each permission has two components:

        - Name: A human-readable identifier used for recognition in the STACKIT Portal.

        - Description: A human-readable description of the permission’s purpose.

        A role is a collection of permissions. Roles can be broad, like Owner, or
        specific, like postgres-flex.reader. You can think of roles as logically cohesive
        sets of permissions. When you grant a user one or more roles, you give them
        all the permissions those roles contain.'
      retrieved_at: '2026-10-22T20:22:15.548260+00:00'
      content_hash: sha256:09cbdbcf846c61565a291ce3bdaf9a0e4b63f322f117019c12b5170f2a7286be
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-role-binding-scope
      url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
      source_class: technical
      quote: Role bindings, also referred to as memberships, are the core mechanism
        for access control. They link a subject (a user, service account, or group)
        to a specific role within a defined scope. This is the sole method used to
        manage access across your organization, folders, and projects.
      retrieved_at: '2026-10-22T20:22:15.548260+00:00'
      content_hash: sha256:09cbdbcf846c61565a291ce3bdaf9a0e4b63f322f117019c12b5170f2a7286be
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-no-resource-level
      url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
      source_class: technical
      quote: Role bindings on individual cloud resource levels (like a specific bucket
        or VM) aren’t supported.
      retrieved_at: '2026-10-22T20:22:15.548260+00:00'
      content_hash: sha256:09cbdbcf846c61565a291ce3bdaf9a0e4b63f322f117019c12b5170f2a7286be
      applicability:
        offering: public
        regions:
