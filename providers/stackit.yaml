  gov.hierarchy-delegation:
    status: assessed
    score: 2
    evidence: STACKIT's Resource Manager provides a native hierarchical structure
      involving Organizations, Folders, and Projects. IAM roles, quota, and billing
      references are inherited down this hierarchy. Delegated administration is possible
      by granting roles at Organization, Folder, or Project scope. All hierarchical
      nodes (Organizations, Folders, Projects) can be created and managed programmatically
      via API/CLI. However, Folders are explicitly stated as 'single-layer only' and
      'cannot be nested,' which limits the depth and flexibility of the organizational
      hierarchy, preventing it from reaching L3's 'deep, flexible' criteria.
    verified_at: '2026-10-26'
    confidence: high
    references:
    - url: https://docs.stackit.cloud/platform/resource-manager/basics
      title: Introduction to the Resource Manager | Docs
    - url: https://docs.stackit.cloud/platform/resource-manager/getting-started
      title: docs.stackit.cloud documentation
    - url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions | Docs
