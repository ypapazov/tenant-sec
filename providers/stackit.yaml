  net.waf:
    status: assessed
    score: 2
    evidence: 'STACKIT offers two managed Web Application Firewalls: ALB WAF and CDN
      WAF. Both utilize the OWASP Core Rule Set (CRS) for predefined protection against
      common web attacks. The ALB WAF supports custom rule groups defined via a structured
      JSON model, but the documentation does not explicitly detail support for advanced
      conditions like geo-location, IP reputation, or per-client rate limiting. Custom
      rules for the CDN WAF are stated to be "on the roadmap." Comprehensive bot management
      features, specifically CAPTCHA challenges, are not documented for either service,
      though bot blocking is mentioned. Integration is available with the Application
      Load Balancer and CDN, but the Network Load Balancer explicitly does not offer
      a WAF option. The documentation does not explicitly state that the managed OWASP
      rule sets receive automatic updates. While ALB WAF provides detailed logging
      of rule matches and blocking events, specific logging capabilities and retention
      policies for the CDN WAF are not documented.'
    verified_at: '2026-10-26'
