  enc.private-ca-lifecycle:
    status: assessed
    score: 1
    evidence: STACKIT does not provide a managed private Certificate Authority (CA)
      or a service that issues private workload certificates directly. The STACKIT
      Certificate API is designed for storing and managing TLS/SSL certificates that
      have been issued by external CAs or are self-signed, and it does not act as
      a CA itself. However, the documentation for STACKIT Kubernetes Engine explicitly
      states compatibility with tools like `cert-manager` for automating certificate
      provisioning and renewal using standard Kubernetes TLS Secrets. This indicates
      that private PKI, including the operation of CA software, is achievable by tenants
      deploying and managing such solutions within their tenant-managed workloads
      (e.g., Kubernetes clusters). This aligns with the L1 criterion, where private
      PKI is possible through tenant-managed software and pipelines.
    verified_at: '2026-10-26'
    confidence: high
    references:
