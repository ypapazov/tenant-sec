      title: Basic concepts of the Certificate API | Docs
      source_class: technical
      quote: 'STACKIT Certificate API integrates with STACKIT Application Load Balancer
        (ALB) to help you manage TLS/SSL certificates securely and efficiently. This
        integration ensures encrypted communication between clients and your applications
        running behind STACKIT Application Load Balancer.

        By using STACKIT Certificate API, you can:

        - Store TLS/SSL certificates securely.

        - Access detailed certificate metadata, which is automatically extracted from
        your public keys.

        - Track certificate usage, to see which load balancers and listeners are using
        which certificate.

        - Manage certificates dynamically.

        - Retrieve and use stored certificates when creating HTTPS listeners for the
        ALB.

        - Enable encrypted communication for applications behind the ALB.'
