  iam.session-management:
    status: assessed
    score: 1
    evidence: The STACKIT Secrets Manager documentation indicates that tokens issued
      via userpass or AppRole authentication have a default lifetime of 15 minutes,
      which can be renewed up to a maximum token lifetime of 24 hours. Tenants can
      specify renewal duration and manually revoke unused tokens immediately. This
      demonstrates configurable token lifetime and tenant-initiated revocation for
      a specific type of temporary credentials. However, the documentation lacks evidence
      for general configurable maximum session duration for user accounts, adjustable
      console session timeouts, configurable idle timeouts, or concurrent session
      limits per user. While STACKIT IdP ensures permissions are 'promptly revoked',
      there is no explicit confirmation that active sessions are immediately invalidated
      upon such changes. The absence of these broader controls, coupled with the limited
      scope of the existing token lifetime configuration (only for Secrets Manager
      tokens), means that comprehensive native session policy configuration is not
      offered, aligning with L1 where key features like idle timeout and concurrent
      session limits would require external tooling.
