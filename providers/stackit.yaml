  net.flow-logging:
    status: assessed
    score: 1
    evidence: While STACKIT offers a general log management service, STACKIT Logs,
      it does not provide a general, managed VPC-level or subnet-level network flow
      logging service available to tenants for the entire offering. The Core Networking
      documentation describes connection tracking for security groups at a flow level
      but lacks details on platform-managed flow logging for tenant consumption. However,
      within the STACKIT Kubernetes Engine (SKE), the Cilium CNI, when configured
      with its Hubble component, provides network flow visibility for Kubernetes cluster
      behavior and communication between services. This functionality requires tenant
      action to enable and tenant-managed tools (like Prometheus) to collect metrics,
      and its scope is limited to the Kubernetes cluster overlay network, not extending
      to non-Kubernetes resources within the same VPC. This aligns with a tenant-deployed
      solution rather than a fully managed platform service for comprehensive flow
      logging across the entire VPC.
