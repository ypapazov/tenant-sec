        services: []
        edition: standard
    - id: ev-iam-description
      url: https://docs.stackit.cloud/platform/access-and-identity
      title: Understand STACKIT IAM
      source_class: technical
      quote: STACKIT IAM is a central authorization system built on top of the resource
        manager to provide fine-grained access management to your STACKIT resources.
        It includes a variety of concepts and functions, such as user accounts, service
        accounts, roles and permissions, and integrates with the STACKIT Identity
        Provider (IDP).
      retrieved_at: '2026-10-22T20:22:15.548260+00:00'
      content_hash: sha256:9be06d3de2c33e53842668c43d18c27200f4a34072e919e83900881a68171a0a
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-support-rbac
      url: https://docs.stackit.cloud/release-notes
      title: 'null'
      source_class: technical
      quote: 'We are rolling out a new permission model for STACKIT Support that gives
        you fine-grained control over who can access tickets, right inside the STACKIT
        Portal.

        Every user can still work with their own tickets out of the box. On top of
        that, you can now designate ticket administrators who are able to view and
        manage all tickets across an organization or project, without any manual permission
        upkeep for individual tickets.'
      retrieved_at: '2026-10-22T20:22:15.548260+00:00'
