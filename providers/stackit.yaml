    criteria_results:
    - level: 0
      met: false
      reasoning: STACKIT Kubernetes Engine is a managed Kubernetes offering, directly
        contradicting the L0 criterion of 'No managed Kubernetes offering.'
      claim_ids:
      - cl-managed-k8s
    - level: 1
      met: false
      reasoning: While some aspects of the security posture are permissive by default
        (e.g., PSS not enforced, network policies not enabled by default), the crucial
        L1 criterion 'All hardening is manual' is contradicted. The provider explicitly
        manages and auto-updates the control plane and underlying OS, which is a form
        of managed hardening.
      claim_ids:
      - cl-control-plane-auto-patched
    - level: 2
      met: true
      reasoning: The offering provides a managed Kubernetes service with a managed
        and automatically patched control plane. RBAC is implicitly enabled as the
        primary access control. Pod Security Standards are available for tenant use
        but not enforced by default, and network policies require explicit tenant
        creation. These elements align with L2's 'available managed, limited' approach
        and 'improved defaults' where tenant action is still needed for full enforcement.
        The lack of explicit documentation for default etcd encryption and specific
        API audit logging as provider-managed 'improved defaults' means these specific
        L2 aspects are not fully met, but enough other L2 criteria are supported to
        reach this level.
      claim_ids:
      - cl-managed-k8s
      - cl-control-plane-auto-patched
      - cl-rbac-enabled-tenant-configured
      - cl-pss-available-not-enforced
      - cl-network-policies-tenant-created
    - level: 3
      met: false
      reasoning: L3 requires hardened managed Kubernetes where features like Pod Security
        Standards and network policies are enforced by default, and managed admission
        controller hooks (e.g., binary authorization) and runtime threat detection
        are present. The documentation indicates that PSS and network policies require
        tenant configuration and are not enforced by default, and there is no mention
        of managed admission controller hooks or runtime threat detection.
      claim_ids:
      - cl-pss-available-not-enforced
      - cl-network-policies-tenant-created
