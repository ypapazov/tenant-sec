  iam.permission-boundaries:
    status: assessed
    score: 0
    evidence: STACKIT IAM uses a Role-Based Access Control (RBAC) model where permissions
      are strictly additive. The documentation explicitly states that 'Owner' roles
      grant full access, including the ability to assign roles, and that inherited
      permissions cannot be restricted or denied by adding bindings on child nodes.
      There is no documented mechanism for permission boundaries, maximum permission
      ceilings, or managed constraints that would limit the scope of permissions a
      delegated IAM administrator can grant, nor is there a system that evaluates
      effective permissions as an intersection with a defined boundary. The absence
      of such features means that any principal with role assignment capabilities
      can grant any permission available to them, enabling potential privilege escalation
      and making delegation of IAM administration unsafe without full administrative
      trust.
    verified_at: '2026-10-26'
    confidence: high
    references:
    - url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
    - url: https://docs.stackit.cloud/platform/access-and-identity
      title: Understand STACKIT IAM
    - url: https://docs.stackit.cloud/products/runtime/kubernetes-engine/getting-started/access-cluster
      title: Access a cluster
    evidence_items:
    - id: ev-iam-overview
      url: https://docs.stackit.cloud/platform/access-and-identity
      title: Understand STACKIT IAM
      source_class: technical
      quote: STACKIT IAM is a central authorization system built on top of the resource
        manager to provide fine-grained access management to your STACKIT resources.
        It includes a variety of concepts and functions, such as user accounts, service
        accounts, roles and permissions, and integrates with the STACKIT Identity
        Provider (IDP).
      retrieved_at: '2026-10-22T22:49:45.385577+00:00'
      content_hash: sha256:9be06d3de2c33e53842668c43d18c27200f4a34072e919e83900881a68171a0a
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-rbac-additive
      url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
      source_class: technical
      quote: The access model for Role bindings is strictly additive. Access is granted
        only through the creation of a new role binding and cannot be revoked by subsequent
        bindings. To reduce a subject’s effective permissions, the existing, overly
        permissive role binding(s) must be explicitly removed.
      retrieved_at: '2026-10-22T22:49:45.385577+00:00'
      content_hash: sha256:09cbdbcf846c61565a291ce3bdaf9a0e4b63f322f117019c12b5170f2a7286be
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-owner-grants-full-access
      url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
      source_class: technical
      quote: 'General roles, such as Owner, Editor, and Reader, provide broad access
        across all STACKIT services and contain extensive permission sets. Use these
        roles with caution in production environments, and limit their scope to specific
        folders or projects rather than applying them at the organization level.

        - Owner : Grants full access to manage all resources, including the ability
        to assign roles.'
      retrieved_at: '2026-10-22T22:49:45.385577+00:00'
      content_hash: sha256:09cbdbcf846c61565a291ce3bdaf9a0e4b63f322f117019c12b5170f2a7286be
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-no-restrictive-inheritance
      url: https://docs.stackit.cloud/platform/access-and-identity/roles-permissions/roles-permissions
      title: Understand roles and permissions
      source_class: technical
      quote: If you want to remove a permission that is granted through inheritance,
        the binding must be removed at the parent level. Access cannot be restricted
        or denied by adding a binding on a child node (project or folder).
      retrieved_at: '2026-10-22T22:49:45.385577+00:00'
      content_hash: sha256:09cbdbcf846c61565a291ce3bdaf9a0e4b63f322f117019c12b5170f2a7286be
      applicability:
        offering: public
        regions:
        - eu01
        services: []
        edition: standard
    - id: ev-kube-admin-access
      url: https://docs.stackit.cloud/products/runtime/kubernetes-engine/getting-started/access-cluster
      title: Access a cluster
      source_class: technical
      quote: All users of a STACKIT project who have one of the owner, editor, ske.admin
        or ske.editor roles are allowed to run all available cluster operations from
        the context menu. The only exception is that ske.editor does not permit deleting
        cluster. This means every member with theses roles in a project has the right
        to access the cluster with the kubeconfig (which provides admin access for
        the whole cluster) and also delete it.
      retrieved_at: '2026-10-22T22:49:45.385577+00:00'
