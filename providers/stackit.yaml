  incident.automated-response:
    status: assessed
    score: 1
    evidence: STACKIT offers capabilities that allow tenants to build custom event-driven
      security responses. Specifically, STACKIT Container Registry provides a flexible
      webhook system that can trigger external systems upon events like 'Scan Completed'
      or 'Scan Failed', enabling integration with ticketing systems for vulnerability
      management. STACKIT RabbitMQ is available as a managed message broker service
      that can be used as a component for building custom event-driven architectures
      for asynchronous communication. The STACKIT Automation Service is a general-purpose
      managed service for automating tasks, but its documented functionalities are
      focused on infrastructure automation (e.g., volume backups) and do not include
      specific security response templates. The STACKIT Cloud Security Posture Management
      (CSPM) service provides automated detection of misconfigurations and event-driven
      scans but lacks explicit automated remediation features. While these components
      facilitate custom automation, there is no evidence of a native, general-purpose
      event-driven response framework that aggregates security findings across multiple
      services, nor are there pre-built security response playbooks for common scenarios
      like isolating compromised instances, revoking credentials, or blocking IPs.
      Native SOAR integration is not available, requiring custom connectors for any
      such integration.
    verified_at: '2026-10-26'
    confidence: high
    references:
