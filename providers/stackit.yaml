    evidence: STACKIT Key Management Service (KMS) supports Bring Your Own Key (BYOK)
      functionality by allowing users to upload externally generated keys (cl-byok-upload-supported).
      The documentation implies that imported keys must be of types AES-256, RSA-2048,
      RSA-3072, or RSA-4096, consistent with the algorithms KMS supports for generation
      (cl-byok-import-key-types). General key rotation is also a core feature of KMS
      (cl-kms-key-rotation-supported), and third-party documentation explicitly refers
      to key rotation for BYOK. These capabilities support L2. However, the documentation
      lacks detailed, secure import procedures that specify cryptographic wrapping
      with a provider-provided public wrapping key (cl-no-secure-wrapping-details).
      Furthermore, there is no explicit confirmation that imported keys have the exact
      same capabilities and management properties as provider-generated CMKs across
      all operations (cl-no-full-parity-confirmation), nor is there a comprehensive
      list or explicit confirmation that BYOK is available across all STACKIT services
      that support CMK (cl-no-universal-cmk-availability). These missing details constitute
      significant limitations, preventing the assessment from reaching L3.
