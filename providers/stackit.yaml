      source_class: secondary
      quote: 'The starting point is the STACKIT Resource Manager API: the Explorer
        identifies the parent organization and recursively walks the entire folder
        hierarchy to find every accessible project. Dedicated scrapers then catalog
        the individual resource types:

        - Virtual machines: availability zone, power state (RUNNING ,SHUTOFF ), machine
        type, boot and attached volumes, security groups, SSH keypairs, plus private
        and public IP addresses.

        - Block storage: persistent volumes with size, performance class, encryption
        state, and the server they are attached to.

        - Object storage: S3-compatible buckets including region and configuration.

        - Networking: VPCs with prefixes, gateway routing, and labels, plus load balancers
        with their listeners and target pools.

        - IAM: project-level role bindings for users, groups, and service accounts,
        alongside the service accounts defined within each project.'
