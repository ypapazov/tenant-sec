controls:
  compute.container-orchestration:
    status: assessed
    score: 2
    evidence: STACKIT Kubernetes Engine (SKE) is a managed Kubernetes service with
      a managed and automatically updated control plane, moving it beyond an L1 'all
      manual hardening' scenario. While RBAC is enabled, platform-level audit logging
      for SKE management events is available, and Pod Security Standards (PSS) and
      network policies are available for tenant configuration, they are not enforced
      or enabled by default. This aligns with L2 criteria for managed Kubernetes with
      improved defaults where certain security features are available but require
      explicit tenant action for full enforcement. However, the critical L2 criterion
      of 'etcd encrypted at rest' is not met for standard SKE, as this feature is
      explicitly highlighted for the separate STACKIT Confidential Kubernetes offering,
      implying its absence in standard SKE. Additionally, detailed in-cluster Kubernetes
      API server audit logs are not explicitly documented as available to tenants.
    verified_at: '2026-10-26'
    confidence: low
