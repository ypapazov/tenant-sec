        evidence: STACKIT Object Storage supports S3 Object Lock, providing Write
          Once Read Many (WORM) protection. It offers both GOVERNANCE and COMPLIANCE
          retention modes, with COMPLIANCE mode preventing deletion by anyone until
          expiry. A distinct Legal Hold feature is available to prevent deletion regardless
          of the retention period. Retention policies can be set at the bucket level
          (default retention) and a project-level Compliance Lock acts as an organizational
          prerequisite. While these features align with most L3 criteria, explicit
          audit logging of all retention and hold changes is not detailed in the provided
