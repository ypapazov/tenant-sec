[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-sec"
version = "1.0.0rc1"
description = "Open-source framework for evaluating cloud provider security capabilities at the tenant level"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["cloud", "security", "compliance", "assessment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "click>=8.1",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://tenant-sec.io/"
Documentation = "https://tenant-sec.io/"
Repository = "https://github.com/ypapazov/tenant-sec"
Issues = "https://github.com/ypapazov/tenant-sec/issues"

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tenant-sec = "tenant_sec.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_sec"]

[tool.hatch.build.targets.wheel.force-include]
"controls" = "tenant_sec/data/controls"
"providers" = "tenant_sec/data/providers"
"mappings" = "tenant_sec/data/mappings"
"profiles" = "tenant_sec/data/profiles"
"schema" = "tenant_sec/data/schema"
"METHODOLOGY.md" = "tenant_sec/data/METHODOLOGY.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/controls",
    "/providers",
    "/mappings",
    "/profiles",
    "/schema",
    "/METHODOLOGY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
