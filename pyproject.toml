[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-sec"
version = "0.1.0"
description = "Open-source framework for evaluating cloud provider security capabilities at the tenant level"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["cloud", "security", "compliance", "assessment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "click>=8.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tenant-sec = "tenant_sec.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_sec"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/controls",
    "/providers",
    "/mappings",
    "/profiles",
    "/schema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
